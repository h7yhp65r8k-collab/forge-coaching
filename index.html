 return e;
}

function btn(text,fn,secondary=false){
 const b=node("button",text,secondary?"secondary":"");
 b.type="button";
 b.onclick=fn;
 return b;
}

function panel(){
 return node("div","","fp-panel");
}

function details(title,open=false){
 const d=node("details");
 d.open=open;
 d.append(node("summary",title));
 return d;
}

function field(type,placeholder=""){
 const e=node("input");
 e.type=type;
 e.placeholder=placeholder;
 return e;
}

function select(options){
 const s=node("select");
 options.forEach(([value,label])=>{
  const o=node("option",label);
  o.value=value;
  s.append(o);
 });
 return s;
}

function day(value){
 if(!value)return "";
 if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Europe/Rome",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).format(new Date(value));
}

function labelDate(value){
 if(!value)return "—";
 return new Date(day(value)+"T12:00:00")
 .toLocaleDateString("it-IT");
}

function number(value){
 if(value===null||value===undefined||value==="")return "—";
 return Number(value).toLocaleString("it-IT",{
  maximumFractionDigits:2
 });
}

function stat(label,value){
 const box=node("div","","fp-stat");
 box.append(node("span",label),node("strong",value));
 return box;
}

function status(root,text,error=false){
 root.textContent=text;
 root.className="status "+(error?"error":"success");
}

async function result(request){
 const {data,error}=await request;
 if(error)throw error;
 return data;
}

async function rpc(name,params={}){
 return result(db.rpc(name,params));
}

function valueOf(row,key){
 return row&&row[key]!==null&&row[key]!==undefined
 ?row[key]:null;
}

async function render(root){

 const account=user.id;
 const request=serial;
 const admin=role==="admin";

 let client=account;
 let generation=0;

 const shell=node("div");
 shell.id="fp24";

 const content=node("div");

 shell.append(
  node("div","FORGE PROGRESS","fp-title"),
  node("div","CHECK • EVOLUTION • TRANSFORMATION","fp-sub")
 );

 root.replaceChildren(shell);

 function valid(){
  return shell.isConnected&&
   user?.id===account&&
   serial===request;
 }

 if(admin){

  const coach=panel();
  coach.append(node("h3","Area coach"));

  const clients=select([[account,"I miei progressi"]]);

  coach.append(clients);
  shell.append(coach);

  clients.onchange=()=>{
   client=clients.value;
   load();
  };

  try{
   const profiles=await result(
    db.from("profiles").select("*").limit(1000)
   );

   if(!valid())return;

   (profiles||[]).forEach(p=>{
    const id=p.user_id||p.id;
    if(!id||id===account)return;

    const name=p.full_name||
     p.display_name||
     [p.first_name,p.last_name].filter(Boolean).join(" ")||
     p.email;

    if(!name)return;

    const o=node("option",name);
    o.value=id;
    clients.append(o);
   });

  }catch(e){
   coach.append(node("p","Elenco clienti: "+e.message,"small"));
  }

 }

 if(!valid())return;

 shell.append(content);

 async function load(){

  const current=++generation;
  const target=client;

  const alive=()=>valid()&&
   generation===current&&client===target;

  content.replaceChildren(
   node("p","Caricamento progressi...","muted")
  );

  try{

   const [dashboard,measurements,photos,checks]=
   await Promise.all([

    rpc("forge_progress_v4_dashboard",{
     p_client_id:target
    }),

    result(
     db.from("body_measurements")
     .select("*")
     .eq("client_id",target)
     .order("recorded_at",{ascending:false})
     .limit(1000)
    ),

    result(
     db.from("progress_photos")
     .select("*")
     .eq("client_id",target)
     .eq("archived",false)
     .order("photo_date",{ascending:false})
     .order("created_at",{ascending:false})
     .limit(1000)
    ),

    result(
     db.from("forge_client_checkins")
     .select("*")
     .eq("client_id",target)
     .order("checkin_date",{ascending:false})
     .limit(1000)
    )

   ]);

   if(!alive())return;

   content.replaceChildren();

   const latest=measurements[0]||{};
   const first=measurements[measurements.length-1]||{};

   const overview=panel();
   overview.append(node("h3","La tua evoluzione"));

   const grid=node("div","","fp-grid");

   const delta=latest.weight!=null&&first.weight!=null
    ?Number(latest.weight)-Number(first.weight):null;

   grid.append(
    stat("Peso attuale",latest.weight!=null
     ?number(latest.weight)+" kg":"—"),
    stat("Variazione peso",delta!==null
     ?(delta>0?"+":"")+number(delta)+" kg":"—"),
    stat("Ultima vita",latest.waist!=null
     ?number(latest.waist)+" cm":"—"),
    stat("Check registrati",String(checks.length))
   );

   overview.append(grid);
   content.append(overview);

   /* PROMEMORIA CHECK */

   const reminder=dashboard?.reminder||{};
   const reminderBox=panel();

   reminderBox.append(node("h3","Prossimo check"));

   if(reminder.next_check){

    const days=Number(reminder.days_remaining);

    reminderBox.append(
     node("div",days<0
      ?Math.abs(days)+" giorni di ritardo"
      :days===0?"Oggi":days+" giorni","fp-count"),

     node("p","Data prevista: "+
      labelDate(reminder.next_check),"small")
    );

    if(days<=3){
     reminderBox.append(
      node("div",days<0
       ?"Il check è scaduto."
       :days===0
        ?"È il momento del tuo check."
        :"Il prossimo check si avvicina.",
       "fp-alert"+(days<0?" fp-overdue":""))
     );
    }

   }else{
    reminderBox.append(
     node("p","Registra le prime misure per avviare il conto alla rovescia.")
    );
   }

   content.append(reminderBox);

   /* NUOVO CHECK */

   if(target===account||admin){

    const form=details("＋ Registra misure corporee");

    const intro=node("p",
     "Compila soltanto le misure disponibili. Le altre possono restare vuote.",
     "small"
    );

    form.append(intro);

    const inputs={};
    const formGrid=node("div","","fp-grid");

    fields.forEach(([key,title,unit,guide])=>{

     const wrap=node("div");
     const label=node("label",title+" ("+unit+")");
     const inp=field("number",unit);

     inp.min="0.1";
     inp.max=key==="body_fat"?"99.9":"500";
     inp.step="0.1";
     inp.inputMode="decimal";

     inputs[key]=inp;

     wrap.append(label,inp);
     formGrid.append(wrap);

    });

    form.append(formGrid);

    const method=field("text","Metodo di rilevazione");
    const notes=node("textarea");
    notes.placeholder="Note sulle misurazioni";

    const message=node("div");

    const save=btn("Salva misurazioni",async()=>{

     if(!alive())return;

     const data={};

     for(const [key,inp] of Object.entries(inputs)){

      if(inp.value==="")continue;

      const n=Number(inp.value);

      if(!Number.isFinite(n)||n<=0||
       n>500||(key==="body_fat"&&n>=100)){
       status(message,"Controlla i valori inseriti.",true);
       return;
      }

      data[key]=n;

     }

     if(!Object.keys(data).length){
      status(message,"Inserisci almeno una misura.",true);
      return;
     }

     if(method.value.trim())
      data.measurement_method=method.value.trim();

     if(notes.value.trim())
      data.measurement_notes=notes.value.trim();

     save.disabled=true;

     try{

      await rpc("forge_progress_v4_save_measurement",{
       p_data:data,
       p_client_id:target
      });

      if(!alive())return;

      Object.values(inputs).forEach(i=>i.value="");

      alert("Misurazioni salvate.");
      await load();

     }catch(e){
      status(message,e.message,true);
     }finally{
      save.disabled=false;
     }

    });

    form.append(method,notes,save,message);
    content.append(form);

   }

   /* GUIDA ALLE MISURAZIONI */

   const guide=details("Guida alle misurazioni");

   guide.append(node("p",
    "Utilizza un metro morbido, senza comprimere la pelle. Mantieni sempre gli stessi punti di riferimento.",
    "small"
   ));

   fields.forEach(([key,title,unit,text])=>{
    guide.append(
     node("strong",title),
     node("p",text,"fp-guide")
    );
   });

   content.append(guide);

   /* FEEDBACK CHECK */

   if(target===account){

    const checkForm=details("＋ Compila check periodico");

    const checkDate=field("date");
    checkDate.value=todayRome();
    checkDate.max=todayRome();

    checkForm.append(node("label","Data check"),checkDate);

    const checkFields=[
     ["body_weight_kg","Peso corporeo (kg)",500,0.1],
     ["sleep_hours","Ore di sonno",24,0.5],
     ["energy_score","Energia (1–10)",10,1],
     ["adherence_score","Aderenza generale (1–10)",10,1],
     ["stress_score","Stress (1–10)",10,1],
     ["hunger_score","Fame (1–10)",10,1],
     ["recovery_score","Recupero (1–10)",10,1],
     ["mood_score","Umore (1–10)",10,1],
     ["digestion_score","Digestione (1–10)",10,1],
     ["motivation_score","Motivazione (1–10)",10,1]
    ];

    const checkInputs={};
    const cg=node("div","","fp-grid");

    checkFields.forEach(([key,title,max,step])=>{

     const wrap=node("div");
     const i=field("number");

     i.min=String(step);
     i.max=String(max);
     i.step=String(step);

     checkInputs[key]=i;
     wrap.append(node("label",title),i);
     cg.append(wrap);

    });

    checkForm.append(cg);

    const notes=node("textarea");
    notes.placeholder="Come è andato questo periodo?";

    const message=node("div");

    const save=btn("Salva check",async()=>{

     if(!alive())return;

     const data={};

     for(const [key,i] of Object.entries(checkInputs)){

      if(i.value==="")continue;

      const n=Number(i.value);

      if(!Number.isFinite(n)||
       n<Number(i.min)||n>Number(i.max)||
       (key.endsWith("_score")&&!Number.isInteger(n))){
       status(message,"Controlla i valori del check.",true);
       return;
      }

      data[key]=n;

     }

     if(!Object.keys(data).length){
      status(message,"Inserisci almeno un valore.",true);
      return;
     }

     if(!checkDate.value||
      checkDate.value>todayRome()){
      status(message,"Data non valida.",true);
      return;
     }

     if(notes.value.trim())data.notes=notes.value.trim();

     save.disabled=true;

     try{

      await rpc("forge_progress_v3_save_checkin",{
       p_data:data,
       p_date:checkDate.value
      });

      if(!alive())return;

      alert("Check salvato.");
      await load();

     }catch(e){
      status(message,e.message,true);
     }finally{
      save.disabled=false;
     }

    });

    checkForm.append(notes,save,message);
    content.append(checkForm);

   }

   /* CARICAMENTO FOTO IPHONE */

   if(target===account){

    const upload=details("＋ Carica foto progressi",true);

    const photoDate=field("date");
    photoDate.value=todayRome();
    photoDate.max=todayRome();

    const pose=select(angles);

    const file=field("file");
    file.accept="image/*";

    const photoNotes=node("textarea");
    photoNotes.placeholder="Note facoltative";

    const message=node("div");

    async function prepareImage(original){

     if(original.size>15*1024*1024)
      throw Error("La foto supera 15 MB.");

     if(["image/jpeg","image/png","image/webp"]
      .includes(original.type))return original;

     const url=URL.createObjectURL(original);

     try{

      const img=new Image();
      img.src=url;

      await img.decode();

      const canvas=document.createElement("canvas");
      const scale=Math.min(1,1800/
       Math.max(img.width,img.height));

      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);

      canvas.getContext("2d").drawImage(
       img,0,0,canvas.width,canvas.height
      );

      const blob=await new Promise(resolve=>
       canvas.toBlob(resolve,"image/jpeg",0.88)
      );

      if(!blob)throw Error("Conversione non riuscita.");

      return blob;

     }catch(e){
      throw Error("Formato non leggibile. Seleziona una foto JPEG o PNG.");
     }finally{
      URL.revokeObjectURL(url);
     }

    }

    const save=btn("Carica e salva foto",async()=>{

     if(!alive())return;

     if(!file.files?.[0]){
      status(message,"Seleziona una foto.",true);
      return;
     }

     if(!photoDate.value||
      photoDate.value>todayRome()){
      status(message,"Data non valida.",true);
      return;
     }

     save.disabled=true;
     status(message,"Caricamento in corso...");

     let path="";
     let uploaded=false;
     let registered=false;

     try{

      const image=await prepareImage(file.files[0]);

      if(!alive())return;

      const ext=image.type==="image/png"?"png":
       image.type==="image/webp"?"webp":"jpg";

      path=account+"/"+photoDate.value+"/"+
       pose.value+"-"+crypto.randomUUID()+"."+ext;

      await result(
       db.storage.from(bucket).upload(path,image,{
        contentType:image.type,
        upsert:false
       })
      );

      uploaded=true;

      await rpc("forge_progress_v3_register_photo",{
       p_storage_path:path,
       p_photo_angle:pose.value,
       p_photo_date:photoDate.value,
       p_notes:photoNotes.value.trim()
      });

      registered=true;

      if(!alive())return;

      alert("Foto salvata nella galleria privata.");
      await load();

     }catch(e){

      if(uploaded&&!registered){

       const cleanup=await db.storage.from(bucket)
        .remove([path]);

       if(cleanup.error){
        status(message,
         e.message+" — Pulizia del file non riuscita.",
         true
        );
        return;
       }

      }

      status(message,e.message,true);

     }finally{
      save.disabled=false;
     }

    });

    upload.append(
     node("label","Data della foto"),
     photoDate,
     node("label","Posizione"),
     pose,
     node("label","Seleziona foto dall'iPhone"),
     file,
     photoNotes,
     save,
     message
    );

    content.append(upload);

   }

   /* CONFRONTO MULTIPLO */

   const comparison=details(
    "Prima e dopo • Confronta fino a 5 check",true
   );

   const allDates=[...new Set([

    ...measurements.map(m=>day(m.recorded_at)),
    ...photos.map(p=>day(p.photo_date)),
    ...checks.map(c=>day(c.checkin_date))

   ])].filter(Boolean).sort().reverse();

   comparison.append(node("p",
    "Seleziona da 2 a 5 date, anche di settimane o mesi differenti.",
    "small"
   ));

   const selected=new Set();
   const dateList=node("div");

   dateList.style.maxHeight="240px";
   dateList.style.overflowY="auto";

   const counter=node("p","0 di 5 date selezionate","small");

   const poseFilter=select(angles);

   const comparisonOutput=node("div");

   allDates.forEach(date=>{

    const label=node("label","","fp-check");
    const cb=field("checkbox");

    const photoCount=photos.filter(p=>
     day(p.photo_date)===date
    ).length;

    cb.onchange=()=>{

     if(cb.checked&&selected.size>=5){
      cb.checked=false;
      alert("Puoi confrontare al massimo 5 date.");
      return;
     }

     if(cb.checked)selected.add(date);
     else selected.delete(date);

     counter.textContent=selected.size+
      " di 5 date selezionate";

     comparisonOutput.replaceChildren();

    };

    label.append(
     cb,
     node("span",labelDate(date)+
      (photoCount?" • "+photoCount+" foto":""))
    );

    dateList.append(label);

   });

   if(!allDates.length){
    dateList.append(node("p",
     "Nessun check disponibile.","muted"));
   }

   comparison.append(dateList,counter,
    node("label","Posizione fotografica"),poseFilter);

   let compareRun=0;

   poseFilter.onchange=()=>{
    compareRun++;
    comparisonOutput.replaceChildren();
   };

   async function photoCard(photo,date){

    const card=node("div","","fp-photo");

    card.append(node("div",labelDate(date),"fp-date"));

    if(!photo){
     card.append(node("p","Foto non disponibile","small"));
     return card;
    }

    try{

     const data=await result(
      db.storage.from(photo.bucket_name||bucket)
       .createSignedUrl(photo.storage_path,900)
     );

     const img=node("img");

     img.src=data.signedUrl;
     img.alt="Foto progressi "+labelDate(date);
     img.loading="lazy";

     img.onerror=()=>{
      img.replaceWith(node("p",
       "Foto non visualizzabile.","small"));
     };

     card.append(img);

    }catch(e){
     card.append(node("p","Foto non accessibile.","small"));
    }

    return card;

   }

   const compareButton=btn("Confronta date selezionate",async()=>{

    if(selected.size<2){
     alert("Seleziona almeno due date.");
     return;
    }

    const run=++compareRun;
    const dates=[...selected].sort();
    const angle=poseFilter.value;

    compareButton.disabled=true;

    comparisonOutput.replaceChildren(
     node("p","Preparazione confronto...","small")
    );

    try{

     const gallery=node("div","","fp-scroll");

     const cards=await Promise.all(dates.map(date=>{

      const photo=photos.find(p=>
       day(p.photo_date)===date&&p.photo_angle===angle
      );

      return photoCard(photo,date);

     }));

     if(!alive()||run!==compareRun)return;

     gallery.append(...cards);

     comparisonOutput.replaceChildren(
      node("h3","Evoluzione fotografica"),
      gallery
     );

     const tableWrap=node("div","","fp-table");
     const table=node("table");
     const head=node("tr");

     head.append(node("th","Misura"));

     dates.forEach(d=>
      head.append(node("th",labelDate(d)))
     );

     head.append(node("th","Variazione"));

     const thead=node("thead");
     thead.append(head);
     table.append(thead);

     const tbody=node("tbody");

     const rows=dates.map(date=>
      measurements.find(m=>day(m.recorded_at)===date)
     );

     fields.forEach(([key,title,unit])=>{

      const values=rows.map(r=>valueOf(r,key));

      if(values.every(v=>v===null))return;

      const tr=node("tr");

      tr.append(node("td",title));

      values.forEach(v=>{
       tr.append(node("td",v===null?"—":
        number(v)+" "+unit));
      });

      const a=values[0];
      const b=values[values.length-1];

      const delta=a!==null&&b!==null
       ?Number(b)-Number(a):null;

      tr.append(node("td",delta===null?"—":
       (delta>0?"+":"")+number(delta)+" "+unit));

      tbody.append(tr);

     });

     table.append(tbody);
     tableWrap.append(table);

     comparisonOutput.append(
      node("h3","Confronto misurazioni"),
      node("p",
       "Variazione calcolata tra la prima e l'ultima data selezionata.",
       "small"),
      tableWrap
     );

    }catch(e){
     status(comparisonOutput,e.message,true);
    }finally{
     compareButton.disabled=false;
    }

   });

   comparison.append(compareButton,comparisonOutput);
   content.append(comparison);

   /* GALLERIA COMPLETA */

   const gallery=details("Galleria fotografica");
   const galleryPose=select([
    ["all","Tutte le posizioni"],...angles
   ]);

   const galleryOutput=node("div");

   let galleryRun=0;

   async function loadGallery(){

    const run=++galleryRun;

    galleryOutput.replaceChildren(
     node("p","Caricamento foto...","small")
    );

    const rows=photos.filter(p=>
     galleryPose.value==="all"||
     p.photo_angle===galleryPose.value
    );

    const grid=node("div","","fp-grid");

    const cards=await Promise.all(
     rows.slice(0,30).map(async p=>{

      const card=await photoCard(p,p.photo_date);

      card.append(node("p",
       angles.find(a=>a[0]===p.photo_angle)?.[1]||
       "Foto","small"));

      if(target===account){

       const archive=btn("Archivia",async()=>{

        if(!alive())return;
        if(!confirm("Archiviare questa foto?"))return;

        archive.disabled=true;

        try{

         await rpc("forge_progress_v3_archive_photo",{
          p_photo_id:p.id,
          p_archived:true
         });

         if(alive())await load();

        }catch(e){
         alert(e.message);
        }finally{
         archive.disabled=false;
        }

       },true);

       card.append(archive);

      }

      return card;

     })
    );

    if(!alive()||run!==galleryRun)return;

    grid.append(...cards);
    galleryOutput.replaceChildren(grid);

    if(!rows.length){
     galleryOutput.append(node("p",
      "Nessuna foto disponibile.","muted"));
    }

    if(rows.length>30){
     galleryOutput.append(node("p",
      "Visualizzate le 30 foto più recenti. Le altre restano disponibili nel confronto per data.",
      "small"));
    }

   }

   galleryPose.onchange=loadGallery;

   gallery.ontoggle=()=>{
    if(gallery.open)loadGallery();
   };

   gallery.append(galleryPose,galleryOutput);
   content.append(gallery);

   /* GRAFICI EVOLUZIONE */

   const charts=details("Grafici delle misurazioni");

   const metric=select(fields.map(([k,t,u])=>
    [k,t+" ("+u+")"]
   ));

   const range=select([
    ["30","Ultimi 30 giorni"],
    ["90","Ultimi 3 mesi"],
    ["180","Ultimi 6 mesi"],
    ["365","Ultimo anno"],
    ["all","Tutto lo storico"]
   ]);

   const chartOutput=node("div");

   function drawChart(){

    chartOutput.replaceChildren();

    const key=metric.value;

    const cutoff=range.value==="all"?0:
     Date.now()-Number(range.value)*86400000;

    const rows=measurements.filter(m=>
     m[key]!=null&&
     new Date(m.recorded_at).getTime()>=cutoff
    ).slice().reverse();

    if(!rows.length){
     chartOutput.append(node("p",
      "Nessuna misurazione nel periodo.","muted"));
     return;
    }

    const values=rows.map(r=>Number(r[key]));
    const low=Math.min(...values);
    const high=Math.max(...values);

    const svg=document.createElementNS(
     "http://www.w3.org/2000/svg","svg"
    );

    svg.setAttribute("viewBox","0 0 340 200");
    svg.style.width="100%";

    function shape(tag,attrs){

     const e=document.createElementNS(
      "http://www.w3.org/2000/svg",tag
     );

     Object.entries(attrs).forEach(([k,v])=>
      e.setAttribute(k,String(v))
     );

     svg.append(e);
     return e;

    }

    const x=i=>rows.length===1?170:
     38+i*282/(rows.length-1);

    const y=v=>high===low?95:
     165-(v-low)/(high-low)*130;

    for(let j=0;j<5;j++){

     const yy=35+j*32.5;

     shape("line",{
      x1:38,x2:320,y1:yy,y2:yy,
      stroke:"#39352e"
     });

    }

    if(rows.length>1){

     shape("polyline",{
      points:values.map((v,i)=>x(i)+","+y(v)).join(" "),
      stroke:"#e9c675",
      "stroke-width":2.5,
      fill:"none"
     });

    }

    values.forEach((v,i)=>{

     const dot=shape("circle",{
      cx:x(i),cy:y(v),r:4,fill:"#e9c675"
     });

     dot.onclick=()=>{

      chartTip.textContent=
       labelDate(rows[i].recorded_at)+
       " • "+number(v);

     };

    });

    const chartTip=node("p",
     "Tocca un punto per visualizzare la misura.",
     "small");

    const summary=node("div","","fp-grid");

    summary.append(
     stat("Iniziale",number(values[0])),
     stat("Attuale",number(values[values.length-1])),
     stat("Minimo",number(low)),
     stat("Massimo",number(high))
    );

    chartOutput.append(svg,chartTip,summary);

   }

   metric.onchange=drawChart;
   range.onchange=drawChart;

   charts.append(metric,range,chartOutput);
   content.append(charts);

   drawChart();

   /* STORICO CHECK */

   const history=details("Storico check e misurazioni");

   allDates.forEach(date=>{

    const item=details(labelDate(date));

    const ms=measurements.filter(m=>
     day(m.recorded_at)===date
    );

    const cs=checks.filter(c=>
     day(c.checkin_date)===date
    );

    ms.forEach(m=>{

     const box=panel();

     box.append(node("h3","Misurazioni"));

     fields.forEach(([key,title,unit])=>{

      if(m[key]!=null){

       box.append(node("div",
        title+": "+number(m[key])+" "+unit,
        "history-item"
       ));

      }

     });

     if(m.measurement_notes)
      box.append(node("p",m.measurement_notes,"small"));

     item.append(box);

    });

    cs.forEach(c=>{

     const box=panel();

     box.append(node("h3","Feedback periodico"));

     [
      ["body_weight_kg","Peso"],
      ["sleep_hours","Ore di sonno"],
      ["energy_score","Energia"],
      ["adherence_score","Aderenza"],
      ["stress_score","Stress"],
      ["hunger_score","Fame"],
      ["recovery_score","Recupero"],
      ["mood_score","Umore"],
      ["digestion_score","Digestione"],
      ["motivation_score","Motivazione"]
     ].forEach(([key,title])=>{

      if(c[key]!=null)
       box.append(node("div",
        title+": "+number(c[key]),"history-item"));

     });

     if(c.notes)box.append(node("p",c.notes));

     if(admin){

      const review=node("textarea");
      review.placeholder="Feedback del coach";

      const plan=node("textarea");
      plan.placeholder="Indicazioni per il prossimo periodo";

      const score=field("number","Valutazione 1–10");
      score.min="1";
      score.max="10";
      score.step="1";

      const message=node("div");

      const save=btn("Invia valutazione coach",async()=>{

       if(!alive())return;

       const n=Number(score.value);

       if(!Number.isInteger(n)||n<1||n>10||
        !review.value.trim()){
        status(message,"Inserisci valutazione e feedback.",true);
        return;
       }

       save.disabled=true;

       try{

        await rpc("forge_progress_v3_review_checkin",{
         p_checkin_id:c.id,
         p_score:n,
         p_feedback:review.value.trim(),
         p_action_plan:plan.value.trim()
        });

        status(message,"Valutazione salvata.");

       }catch(e){
        status(message,e.message,true);
       }finally{
        save.disabled=false;
       }

      });

      box.append(score,review,plan,save,message);

     }

     item.append(box);

    });

    const count=photos.filter(p=>
     day(p.photo_date)===date
    ).length;

    item.append(node("p",count+" foto registrate","small"));

    history.append(item);

   });

   if(!allDates.length){
    history.append(node("p",
     "Lo storico è ancora vuoto.","muted"));
   }

   content.append(history);

   /* FEEDBACK COACH */

   const feedback=dashboard?.latest_coach_feedback;

<script>
(()=>{
'use strict';

if(window.forgeCompleteV27)return;
window.forgeCompleteV27=true;

const themes={
 gold:{
  name:'Forge Gold',
  gold:'#e9c675',
  bg:'#08090b',
  panel:'#191a1f',
  line:'#59492f'
 },
 silver:{
  name:'Titanium',
  gold:'#d3d8e0',
  bg:'#090b10',
  panel:'#191e25',
  line:'#505965'
 },
 red:{
  name:'Dark Red',
  gold:'#ed7777',
  bg:'#100809',
  panel:'#241719',
  line:'#67383b'
 },
 blue:{
  name:'Midnight Blue',
  gold:'#78baff',
  bg:'#080e18',
  panel:'#15202e',
  line:'#344f70'
 }
};

const logo=document.querySelector(
 'header img'
);

const originalLogo=logo?
 logo.getAttribute('src'):'';

const home=document.getElementById(
 'welcome'
)?.closest('.card');

const previousSection=section;

function isAdmin(){
 return !!user&&role==='admin';
}

function key(){
 return 'forge_personalization_v27_'+user.id;
}

function readSettings(){
 if(!user)return {};

 try{
  return JSON.parse(
   localStorage.getItem(key())||'{}'
  );
 }catch(e){
  return {};
 }
}

function applySettings(s){

 const t=themes[s.theme]||themes.gold;
 const css=document.documentElement.style;

 css.setProperty('--gold',s.color||t.gold);
 css.setProperty('--bg',t.bg);
 css.setProperty('--panel',t.panel);
 css.setProperty('--line',t.line);

 if(logo){
  logo.src=isAdmin()&&s.logo?
   s.logo:originalLogo;
 }

 if(home){
  home.classList.toggle(
   'f27-cover',!!s.cover
  );

  home.style.backgroundImage=s.cover?
   'linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.12)),url("'+s.cover+'")':
   '';
 }

 const logoBtn=document.getElementById(
  'f27ChangeLogo'
 );

 if(logoBtn){
  logoBtn.style.display=
   isAdmin()?'block':'none';
 }

 const coverBtn=document.getElementById(
  'f27ChangeCover'
 );

 if(coverBtn){
  coverBtn.style.display=
   user?'block':'none';
 }

 const removeBtn=document.getElementById(
  'f27RemoveCover'
 );

 if(removeBtn){
  removeBtn.style.display=
   user&&s.cover?'block':'none';
 }
}

function saveSettings(s){

 if(!user)return;

 try{
  localStorage.setItem(
   key(),JSON.stringify(s)
  );

  applySettings(s);

  return true;

 }catch(e){

  alert(
   'Memoria del dispositivo insufficiente. Prova una foto più piccola.'
  );

  return false;
 }
}

function updateSetting(name,value){

 const s=readSettings();

 if(value===null){
  delete s[name];
 }else{
  s[name]=value;
 }

 return saveSettings(s);
}

function pickImage(type,done){

 if(!user)return;

 if(type==='logo'&&!isAdmin())return;

 const account=user.id;

 const picker=document.createElement('input');

 picker.type='file';
 picker.accept='image/*';

 picker.style.position='fixed';
 picker.style.left='-9999px';

 document.body.append(picker);

 picker.addEventListener('cancel',()=>{
  picker.remove();
 },{once:true});

 picker.onchange=()=>{

  const file=picker.files?.[0];

  picker.remove();

  if(!file)return;

  const reader=new FileReader();

  reader.onerror=()=>{
   alert('Impossibile leggere la foto.');
  };

  reader.onload=()=>{

   const img=new Image();

   img.onerror=()=>{
    alert('Formato immagine non supportato.');
   };

   img.onload=()=>{

    if(user?.id!==account)return;

    if(type==='logo'&&!isAdmin())return;

    const max=type==='logo'?800:1200;

    const ratio=Math.min(
     1,max/Math.max(img.width,img.height)
    );

    const canvas=document.createElement(
     'canvas'
    );

    canvas.width=Math.max(
     1,Math.round(img.width*ratio)
    );

    canvas.height=Math.max(
     1,Math.round(img.height*ratio)
    );

    const ctx=canvas.getContext('2d');

    if(!ctx)return;

    if(type==='logo'){
     ctx.fillStyle='#000';
     ctx.fillRect(
      0,0,canvas.width,canvas.height
     );
    }

    ctx.drawImage(
     img,0,0,canvas.width,canvas.height
    );

    try{

     const data=canvas.toDataURL(
      'image/jpeg',.78
     );

     if(updateSetting(type,data)){

      if(typeof done==='function'){
       done();
      }

     }

    }catch(e){

     alert('Impossibile salvare immagine.');

    }

   };

   img.src=reader.result;

  };

  reader.readAsDataURL(file);

 };

 picker.click();
}

 reset.append(

function nutrition27(root){

  nutritionObserver.disconnect();
  nutritionObserver=null;

  if(active!=='Forge Nutrition')return;

  if(!panel.querySelector(

    )
   );

   panel.prepend(heading);

  }

  const search=panel.querySelector(
   'input[type="search"]'
  );

  if(search&&search.placeholder!==
   'Cerca un alimento...'){

   search.placeholder=
    'Cerca un alimento...';

  }

  const diaryHeading=[
   ...panel.querySelectorAll('h3')
  ].find(h=>

   h.textContent.trim()===
    'Diario della giornata'

  );

  if(diaryHeading){

   const diary=diaryHeading.parentElement;

   const calories=diary.querySelector(
    '.forge-n10-kcal'
   );

   if(calories){

    calories.classList.add(
     'f27-daily-kcal'
    );

   }

  }

 }

 decorate();

 nutritionObserver=new MutationObserver(
  decorate
 );

 nutritionObserver.observe(root,{
  childList:true,
  subtree:true
 });

}

section=function(name){

 if(nutritionObserver){

  nutritionObserver.disconnect();

  nutritionObserver=null;

 }

 if(name==='Forge Studio'&&user){

  serial++;
  calendarSerial++;

  active=name;

  $('sectionTitle').textContent=

   );

  });

  studio27($('sectionContent'));

  $('sectionCard').scrollIntoView({
   behavior:'smooth',
   block:'start'
  });

  return;

 }

 const result=previousSection.apply(
  this,arguments
 );

 if(name==='Forge Nutrition'){

  nutrition27($('sectionContent'));

 }

 return result;

};

 height:auto;

}
.f29-section{

}

 width:25px;
 height:25px;
 fill:none;
 stroke:currentColor;

}

 pointer-events:none;
}

.f29-panel select{

}

}

 color:var(--gold);

 font-weight:700;
}
.f29-caption{
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
}
</style>

<script>
(()=>{
'use strict';

if(window.forgeV29)return;

const welcome=document.getElementById('welcome');
const home=welcome?.closest('.card');

if(!home)return;

window.forgeV29=true;

const get=id=>document.getElementById(id);

function make(tag,text='',cls=''){
 const e=document.createElement(tag);
 if(text)e.textContent=text;
 if(cls)e.className=cls;
 return e;
}

function btn(label,fn,cls='secondary'){
 const b=make('button',label,cls);
 b.type='button';
 b.onclick=fn;
 return b;
}

function field(label,value='',autocomplete='off'){
 const box=make('div');
 const l=make('label',label,'f29-label');
 const i=make('input');
 i.type='text';
 i.value=value;
 i.maxLength=80;
 i.autocomplete=autocomplete;
 i.setAttribute('aria-label',label);
 box.append(l,i);
 return {box,input:i};
}

function greetingField(value='neutral'){
 const box=make('div');
 const select=make('select');

 [
 ['neutral','Ciao'],
 ['male','Bentornato'],
 ['female','Bentornata']
 ].forEach(([v,t])=>{
 const o=make('option',t);
 o.value=v;
 select.append(o);
 });

 select.value=value;

 if(!select.value)select.value='neutral';

 box.append(
 make('label','Come preferisci essere salutato?','f29-label'),
 select
 );

 return {box,input:select};
}

function metadata(){
 return user?.user_metadata||{};
}

function identity(){
 const m=metadata();
 return {
 first:String(m.first_name||m.full_name||m.name||'').trim().split(/\s+/)[0],
 last:String(m.last_name||'').trim(),
 greeting:m.forge_greeting||'neutral'
 };
}

function readLocal(){
 if(!user)return {};

 try{
 return JSON.parse(
 localStorage.getItem(
 'forge_personalization_v27_'+user.id
 )||'{}'
 )||{};
 }catch(e){
 return {};
 }
}

const icons={
 training:'<path d="M6 5v14M18 5v14M3 8v8M21 8v8M6 12h12"/>',
 nutrition:'<path d="M4 3v7a3 3 0 006 0V3M7 3v18M20 3c-4 2-5 6-5 10h5M20 3v18"/>',
 water:'<path d="M12 3C9 8 5 12 5 16a7 7 0 0014 0c0-4-4-8-7-13Z"/>',
 weight:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 9a5 5 0 0110 0M12 9l2-3"/>',
 progress:'<path d="M3 3v18h18M6 16l5-5 4 3 6-8"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2"/>',
 video:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4Z"/>',
 premium:'<path d="m3 6 5 5 4-7 4 7 5-5-2 13H5Z"/>',
 studio:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1"/><circle cx="14" cy="7" r="1"/><circle cx="17" cy="12" r="1"/>',
 feedback:'<path d="M21 11a9 9 0 01-9 9H4l2-5a9 9 0 1115-4Z"/><path d="M8 11h8M8 14h5"/>',
 packages:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/>',
 shop:'<path d="M3 3h3l3 12h10l2-9H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
 settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};

function svg(name){
 return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
 (icons[name]||icons.profile)+
 '</svg>';
}

/* REGISTRAZIONE */

const signup=get('signupBtn');

if(signup){

 const registration=make('div','','f29-panel');

 registration.id='f29Registration';
 registration.hidden=true;

 const first=field('Nome','','given-name');
 const last=field('Cognome','','family-name');
 const greeting=greetingField();

 registration.append(
 make('h3','Crea il tuo account'),
 first.box,
 last.box,
 greeting.box,
 make('p',
 'Inserisci anche email e password. Il coach dovrà approvare il tuo account.',
 'f29-caption')
 );

 signup.before(registration);

 const cancel=btn('Annulla registrazione',()=>{
 registration.hidden=true;
 });

 registration.append(cancel);

 signup.onclick=async()=>{

 if(registration.hidden){
 registration.hidden=false;
 first.input.focus();
 return;
 }

 signup.disabled=true;

 try{

 const email=get('email').value.trim();
 const password=get('password').value;
 const firstName=first.input.value.trim();
 const lastName=last.input.value.trim();

 if(!firstName||!lastName){
 throw Error('Inserisci nome e cognome.');
 }

 if(!email||password.length<8){
 throw Error('Email e password di almeno 8 caratteri richieste.');
 }

 const {error}=await db.auth.signUp({
 email,
 password,
 options:{
 emailRedirectTo:SITE_URL,
 data:{
 first_name:firstName,
 last_name:lastName,
 full_name:firstName+' '+lastName,
 forge_greeting:greeting.input.value
 }
 }
 });

 if(error)throw error;

 registration.hidden=true;
 first.input.value='';
 last.input.value='';

 msg(
 'authStatus',
 'Registrazione inviata. Attendi approvazione.'
 );

 }catch(e){

 msg('authStatus',friendly(e),true);

 }finally{

 signup.disabled=false;

 }

 };

}

/* HOME */

home.classList.add('f29-home');

const roleInfo=get('roleInfo');
const logoutButton=get('logoutBtn');

const row=make('div','','f29-row');
const avatar=make('div','','f29-avatar');
const text=make('div','','f29-text');

home.prepend(row);

row.append(avatar,text);
text.append(welcome);

if(roleInfo)text.append(roleInfo);

const settings=btn('',()=>{
 account.hidden=!account.hidden;

 settings.setAttribute(
 'aria-expanded',
 String(!account.hidden)
 );

 if(!account.hidden)renderAccount();
},'f29-settings');

settings.innerHTML=svg('settings');
settings.setAttribute('aria-label','Impostazioni account');
settings.setAttribute('aria-expanded','false');

row.append(settings);

const account=make('div','','f29-panel');
account.hidden=true;

row.after(account);

const cover=make('div');
cover.id='f29Cover';
cover.hidden=true;

const coverImage=make('img');
coverImage.alt='Copertina personale Forge Coaching';

cover.append(coverImage);
account.after(cover);

coverImage.onerror=()=>{
 cover.hidden=true;
};

coverImage.onload=()=>{
 if(user&&coverImage.getAttribute('src')){
 cover.hidden=false;
 }
};

/* FOTO PROFILO */

function avatarKey(id){
 return 'forge_avatar_v29_'+id;
}

function readAvatar(){
 if(!user)return null;

 try{
 return localStorage.getItem(
 avatarKey(user.id)
 );
 }catch(e){
 return null;
 }
}

function pickAvatar(){

 if(!user)return;

 const id=user.id;
 const picker=make('input');

 picker.type='file';
 picker.accept='image/*';

 picker.style.position='fixed';
 picker.style.left='-9999px';

 document.body.append(picker);

 picker.addEventListener('cancel',()=>{
 picker.remove();
 },{once:true});

 picker.onchange=()=>{

 const file=picker.files?.[0];
 picker.remove();

 if(!file)return;

 const reader=new FileReader();

 reader.onerror=()=>{
 alert('Impossibile leggere la foto.');
 };

 reader.onload=()=>{

 const img=new Image();

 img.onerror=()=>{
 alert('Formato immagine non supportato.');
 };

 img.onload=()=>{

 if(user?.id!==id)return;

 const canvas=make('canvas');

 canvas.width=320;
 canvas.height=320;

 const ctx=canvas.getContext('2d');
 if(!ctx)return;

 const side=Math.min(img.width,img.height);

 ctx.drawImage(
 img,
 (img.width-side)/2,
 (img.height-side)/2,
 side,side,
 0,0,320,320
 );

 try{

 localStorage.setItem(
 avatarKey(id),
 canvas.toDataURL('image/jpeg',.85)
 );

 refreshHome();

 }catch(e){

 alert('Spazio insufficiente sul dispositivo.');

 }

 };

 img.src=reader.result;

 };

 reader.readAsDataURL(file);

 };

 picker.click();

}

/* IMPOSTAZIONI ACCOUNT */

function renderAccount(){

 if(!user)return;

 const id=user.id;
 const current=identity();

 const first=field(
 'Nome',current.first,'given-name'
 );

 const last=field(
 'Cognome',current.last,'family-name'
 );

 const greeting=greetingField(
 current.greeting
 );

 const status=make('p','','f29-caption');

 const save=btn('Salva dati personali',async()=>{

 if(user?.id!==id)return;

 const f=first.input.value.trim();
 const l=last.input.value.trim();

 if(!f||!l){
 status.textContent='Inserisci nome e cognome.';
 return;
 }

 save.disabled=true;

 try{

 const {data,error}=await db.auth.updateUser({
 data:{
 first_name:f,
 last_name:l,
 full_name:f+' '+l,
 forge_greeting:greeting.input.value
 }
 });

 if(error)throw error;

 if(user?.id!==id)return;

 if(data?.user)user=data.user;

 status.textContent='Profilo aggiornato.';
 refreshHome();

 }catch(e){

 status.textContent=friendly(e);

 }finally{

 save.disabled=false;

 }

 });

 account.replaceChildren(
 make('h3','Il mio account'),
 make('p',user.email||'','f29-caption'),
 first.box,
 last.box,
 greeting.box,
 save,
 status,
 make('h3','Foto profilo'),
 btn('Carica foto profilo',pickAvatar),
 btn('Rimuovi foto profilo',()=>{

 if(user?.id!==id)return;

 localStorage.removeItem(avatarKey(id));

 refreshHome();

 }),
 make('p',
 'La foto profilo è salvata su questo dispositivo.',
 'f29-caption'),
 btn('Personalizza app',()=>{

 account.hidden=true;
 settings.setAttribute('aria-expanded','false');

 section('Forge Studio');

 }),
 btn('Apri profilo completo',()=>{

 account.hidden=true;
 settings.setAttribute('aria-expanded','false');

 section('Profilo');

 })
 );

 if(logoutButton){

 account.append(logoutButton);

 }else{

 account.append(btn('Esci',()=>logout()));

 }

}

/* AGGIORNAMENTO HOME */

let lastId=null;
let lastCover=null;
let lastAvatar=null;

function refreshHome(){

 const id=user?.id||null;

 if(id!==lastId){

 account.hidden=true;
 settings.setAttribute('aria-expanded','false');

 lastId=id;
 lastAvatar=null;

 avatar.replaceChildren();

 }

 if(!id){

 cover.hidden=true;
 coverImage.removeAttribute('src');
 lastCover=null;
 avatar.replaceChildren();

 return;

 }

 const p=identity();

 const prefix=p.greeting==='female'
 ?'Bentornata'
 :p.greeting==='male'
 ?'Bentornato'
 :'Ciao';

 const title=role==='admin'
 ?'Bentornato, Coach'
 :p.first
 ?prefix+', '+p.first
 :'Benvenuto in Forge Coaching';

 if(welcome.textContent!==title){
 welcome.textContent=title;
 }

 if(roleInfo){

 const subtitle=role==='admin'
 ?'Profilo amministratore'
 :role==='premium'
 ?'Forge Premium'
 :'La tua area personale';

 if(roleInfo.textContent!==subtitle){
 roleInfo.textContent=subtitle;
 }

 }

 const local=readLocal();

 const src=typeof local.cover==='string'&&
 local.cover.startsWith('data:image/')
 ?local.cover:null;

 if(src!==lastCover){

 lastCover=src;
 cover.hidden=true;

 if(src){

 coverImage.src=src;

 }else{

 coverImage.removeAttribute('src');

 }

 }

 const photo=readAvatar();

 const initials=role==='admin'
 ?'5%'
 :((p.first[0]||'F')+
 (p.last[0]||'')).toUpperCase();

 const avatarState=photo||initials;

 if(lastAvatar!==avatarState){

 lastAvatar=avatarState;
 avatar.replaceChildren();

 if(photo){

 const img=make('img');
 img.src=photo;
 img.alt='Foto profilo';

 avatar.append(img);

 }else{

 avatar.textContent=initials;

 }

 }

}

/* ICONE DEL MENU */

function iconFor(name){

 const n=name.toLowerCase();

 if(/training|allenamento/.test(n))return 'training';
 if(/nutrition|aliment/.test(n))return 'nutrition';
 if(/hydration|idratazione/.test(n))return 'water';
 if(/weight|peso/.test(n))return 'weight';
 if(/progress/.test(n))return 'progress';
 if(/prenot|calendar/.test(n))return 'calendar';
 if(/video/.test(n))return 'video';
 if(/premium/.test(n))return 'premium';
 if(/studio/.test(n))return 'studio';
 if(/feedback/.test(n))return 'feedback';
 if(/pacchett|lezioni/.test(n))return 'packages';
 if(/shop/.test(n))return 'shop';

 return 'profile';

}

function decorateMenu(){

 document.querySelectorAll('button[data-section]')
 .forEach(b=>{

 if(b.dataset.f29==='1'&&b.querySelector('svg')){
 return;
 }

 const name=b.dataset.section;

 let label=b.textContent.trim();

 if(name==='Allenamento'){
 label='Forge Training';
 }

 if(name==='Progress Evolution'){
 label='Forge Progress';
 }

 const span=make('span',label);

 b.innerHTML=svg(iconFor(name));
 b.append(span);

 b.classList.add('f29-section');
 b.dataset.f29='1';

 });

}

refreshHome();
decorateMenu();

setInterval(()=>{

 refreshHome();
 decorateMenu();

},1000);

window.addEventListener('storage',refreshHome);

console.info('FORGE V29 HOME & PERSONAL ACCOUNT ACTIVE');

})();
</script>
<!-- END FORGE V29 -->
