<style>

body{

header{

main{

.card{

h2,h3{

p{line-height:1.5}
.small,.muted{

button{

nav{

.stat span{

gap:6px;

.filters button.active{

.calendar-head{

.calendar-head button{

.calendar-grid{

color:#eee

.day.selected{
background:var(--gold);
color:#111
}
.day small{

.legend{

.dot{

width:10px;

}
.green{background:var(--green)}
.red{background:var(--red)}

.slot.available{

.history-item{

.calendar-blocked{

.calendar-pending{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
'use strict';

const SUPABASE_URL=
'https://ctcbhysolhcjdsekoxkg.supabase.co';

const SUPABASE_KEY=
'sb_publishable_iTsNSEjOrS2mT8JhRBCvig_OONdjU5F';

const SITE_URL=
'https://h7yhp65r8k-collab.github.io/forge-coaching/';

const $=id=>document.getElementById(id);

const db=window.supabase.createClient(
SUPABASE_URL,SUPABASE_KEY
);

let user=null;
let role='client';
let active='';
let period='day';

let resetting=false;
let resetReady=false;
let serial=0;

let selectedDay='';
let calendarWeek='';
let calendarSerial=0;

const screens=[
'loading','auth','forgot','reset','pending','app'
];

const descriptions={
'Allenamento':'Programmi ed esercizi assegnati dal coach.',
'Forge Nutrition':'Monitoraggio calorie e macronutrienti.',
'Forge Hydration':'Acqua assunta e andamento nel tempo.',
'Forge Weight':'Peso corporeo, obiettivi e grafici.',
'Progress Evolution':'Foto, misure e progressi.',
'Prenotazioni':'Calendario e appuntamenti.',
'Video esercizi':'Libreria degli esercizi.',
'Forge Premium':'Contenuti esclusivi.',
'Forge Studio':'Personalizzazione del profilo.',
'Feedback':'Feedback delle sessioni.',
'Pacchetti lezioni':'Lezioni acquistate e residue.',
'Forge Shop':'Acquisti, rinnovi e pagamenti.',
'Profilo':'Informazioni account.'
};

/* FUNZIONI GENERALI */

function show(id){
screens.forEach(x=>
$(x).classList.toggle('hidden',x!==id)
);
}

function msg(id,text,error=false){
const e=$(id);
if(!e)return;
e.textContent=text;
e.className='status '+(error?'error':'success');
}

function friendly(e){
return e?.message||String(e);
}

function el(tag,text='',cls=''){
const e=document.createElement(tag);
e.textContent=text;
e.className=cls;
return e;
}

function add(parent,...children){
children.forEach(x=>parent.append(x));
return parent;
}

function money(n){
return Number(n).toLocaleString('it-IT',{
style:'currency',
currency:'EUR'
});
}

function fmt(n,d=1){
return Number(n).toLocaleString('it-IT',{
maximumFractionDigits:d
});
}

function iso(d){
return d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');
}

function parseDay(s){
return new Date(s+'T12:00:00');
}

function plusDays(s,n){
const d=parseDay(s);
d.setDate(d.getDate()+n);
return iso(d);
}

function monday(s){
const d=parseDay(s);
d.setDate(d.getDate()-(d.getDay()+6)%7);
return iso(d);
}

function timeLabel(t){
return String(t||'').slice(0,5);
}

function dateLabel(s){
return parseDay(s).toLocaleDateString('it-IT',{
weekday:'short',
day:'numeric',
month:'short'
});
}

function dt(s){
return s?new Date(s).toLocaleString('it-IT'):'—';
}

function input(type='text',placeholder=''){
const e=el('input');
e.type=type;
e.placeholder=placeholder;
return e;
}

function button(label,fn,cls=''){
const b=el('button',label,cls);
b.onclick=fn;
return b;
}

function notice(root,text,error=false){
root.append(
el('div',text,'status '+(error?'error':'success'))
);
}

function cleanUrl(){
history.replaceState(
{},document.title,location.pathname
);
}

function recoveryLink(){
const q=new URLSearchParams(location.search);
const h=new URLSearchParams(location.hash.slice(1));
return q.get('type')==='recovery'||
h.get('type')==='recovery';
}

function todayRome(){
const parts=new Intl.DateTimeFormat('en-GB',{
timeZone:'Europe/Rome',
year:'numeric',
month:'2-digit',
day:'2-digit'
}).formatToParts(new Date());

const get=t=>parts.find(p=>p.type===t)?.value;

return get('year')+'-'+get('month')+'-'+get('day');
}

/* AUTENTICAZIONE */

async function userState(){

if(resetting)return;

const {data:{session},error}=
await db.auth.getSession();

if(error||!session){
user=null;
role='client';
show('auth');
return;
}

user=session.user;

const [r,a]=await Promise.all([
db.from('user_roles')
.select('role')
.eq('user_id',user.id),

db.from('account_access')
.select('status')
.eq('user_id',user.id)
]);

if(r.error||a.error){
show('pending');
return;
}

if(a.data?.[0]?.status!=='approved'){
show('pending');
return;
}

role=r.data?.some(x=>x.role==='admin')?'admin':
r.data?.some(x=>x.role==='trainer')?'trainer':
r.data?.some(x=>x.role==='premium')?'premium':
'client';

$('welcome').textContent=
role==='admin'?
'Amministratore riconosciuto':
'Benvenuto in Forge Coaching';

$('roleInfo').textContent=user.email+' • '+role;

show('app');
}

async function logout(){
serial++;
calendarSerial++;

await db.auth.signOut();

user=null;
role='client';
active='';
resetting=false;
resetReady=false;

cleanUrl();

$('sectionCard').classList.add('hidden');

show('auth');
}

$('loginBtn').onclick=async()=>{

const b=$('loginBtn');
b.disabled=true;

try{
const {error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(error)throw error;

await userState();

}catch(e){
msg('authStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('signupBtn').onclick=async()=>{

const b=$('signupBtn');
b.disabled=true;

try{
const email=$('email').value.trim();
const password=$('password').value;

if(!email||password.length<8){
throw Error(
'Email e password di almeno 8 caratteri richieste.'
);
}

const {error}=await db.auth.signUp({
email,
password,
options:{emailRedirectTo:SITE_URL}
});

if(error)throw error;

msg(
'authStatus',
'Registrazione inviata. Attendi approvazione.'
);

}catch(e){
msg('authStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('forgotBtn').onclick=()=>{
$('recoveryEmail').value=$('email').value;
show('forgot');
};

$('backLoginBtn').onclick=()=>show('auth');

$('sendRecoveryBtn').onclick=async()=>{

const b=$('sendRecoveryBtn');
b.disabled=true;

try{
const {error}=await db.auth.resetPasswordForEmail(
$('recoveryEmail').value.trim(),
{redirectTo:SITE_URL}
);

if(error)throw error;

msg(
'forgotStatus',
'Se la mail è registrata, riceverai il link di recupero.'
);

}catch(e){
msg('forgotStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('savePasswordBtn').onclick=async()=>{

const b=$('savePasswordBtn');
b.disabled=true;

try{
if(!resetting||!resetReady){
throw Error('Link non verificato.');
}

const p=$('newPassword').value;

if(p.length<8||
p!==$('confirmPassword').value){
throw Error('Password non valide o differenti.');
}

const {error}=await db.auth.updateUser({
password:p
});

if(error)throw error;

await db.auth.signOut();

resetting=false;
resetReady=false;

cleanUrl();
show('auth');

msg(
'authStatus',
'Password aggiornata. Accedi nuovamente.'
);

}catch(e){
msg('resetStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('logoutBtn').onclick=logout;
$('pendingLogoutBtn').onclick=logout;

/* NAVIGAZIONE */

function section(name){

serial++;
calendarSerial++;
active=name;

$('sectionTitle').textContent=name;
$('sectionText').textContent=
descriptions[name]||'';

const root=$('sectionContent');
root.replaceChildren();

$('sectionCard').classList.remove('hidden');

document.querySelectorAll('[data-section]')
.forEach(b=>
b.classList.toggle(
'active',
b.dataset.section===name
)
);

if(name==='Prenotazioni'){
renderCalendar();
}else if(name==='Forge Shop'){
renderShop();
}else if(name==='Pacchetti lezioni'){
renderPackages();
}else if(name==='Forge Weight'){
renderMetric('weight');
}else if(name==='Forge Hydration'){
renderMetric('water');
}else if(name==='Forge Nutrition'){
renderNutrition();
}else if(name==='Profilo'){
renderProfile();
}else{
root.append(el(
'p',
'Questa sezione richiede ancora il collegamento operativo a Supabase.',
'muted'
));
}

$('sectionCard').scrollIntoView({
behavior:'smooth',
block:'start'
});
}

document.querySelectorAll('[data-section]')
.forEach(b=>
b.onclick=()=>section(b.dataset.section)
);

$('closeSectionBtn').onclick=()=>{
serial++;
calendarSerial++;
active='';

$('sectionCard').classList.add('hidden');

document.querySelectorAll('[data-section]')
.forEach(b=>b.classList.remove('active'));
};

/* PESO E IDRATAZIONE */

const metrics={
weight:{
table:'forge_weight_entries',
field:'weight_kg',
unit:'kg',
title:'Peso corporeo'
},
water:{
table:'forge_water_entries',
field:'amount_ml',
unit:'ml',
title:'Idratazione'
}
};

function renderMetric(kind){

const c=metrics[kind];
const root=$('sectionContent');

period=kind==='weight'?'entry':'day';

root.replaceChildren();

const value=input(
'number',
kind==='weight'?'Es. 82.5':'Es. 250'
);

value.step=kind==='weight'?'0.1':'1';
value.min='1';
value.max=kind==='weight'?'500':'10000';

const feedback=el('div','','status hidden');

const save=button('Salva registrazione',async()=>{

const n=Number(value.value);

if(!value.value||
!Number.isFinite(n)||
n<=0||
n>Number(value.max)||
(kind==='water'&&!Number.isInteger(n))){
feedback.textContent='Inserisci un valore valido.';
feedback.className='status error';
return;
}

save.disabled=true;

try{
const {error}=await db.from(c.table).insert({
user_id:user.id,
[c.field]:n,
recorded_at:new Date().toISOString()
});

if(error)throw error;

value.value='';
feedback.textContent='Registrazione salvata.';
feedback.className='status success';

await loadMetric(kind);

}catch(e){
feedback.textContent=friendly(e);
feedback.className='status error';
}finally{
save.disabled=false;
}
});

add(
root,
el('h3',c.title),
value,
save,
feedback
);

if(kind==='weight'){

const goal=input('number','Obiettivo peso (kg)');
goal.step='0.1';

goal.value=
localStorage.getItem('forge_goal_'+user.id)||'';

root.append(el('label','Obiettivo personale'));
root.append(goal);

root.append(button(
'Salva obiettivo',
()=>{
const n=Number(goal.value);

if(!goal.value||n<=0||n>500){
return alert('Obiettivo non valido.');
}

localStorage.setItem(
'forge_goal_'+user.id,
String(n)
);

alert('Obiettivo salvato sul dispositivo.');
},
'secondary'
));
}

const filters=el('div','','filters');

for(const [k,t] of [
['entry','Singole'],
['day','Giorni'],
['week','Settimane'],
['month','Mesi']
]){
const b=button(t,()=>{
period=k;
loadMetric(kind);
});

b.dataset.period=k;
filters.append(b);
}

root.append(filters);

const summary=el('div','','stats');
summary.id='metricSummary';

const svg=document.createElementNS(
'http://www.w3.org/2000/svg',
'svg'
);

svg.setAttribute('viewBox','0 0 600 260');
svg.classList.add('chart');
svg.id='forgeMetricSvg';

const tip=el('p','','small');
tip.id='metricTip';

const history=el('div');
history.id='metricHistory';

add(root,summary,svg,tip,history);

loadMetric(kind);
}

function groupMetric(rows,kind,p){

const c=metrics[kind];
const sorted=rows.slice().reverse();

if(p==='entry'){
return sorted.slice(-30).map(r=>({
key:r.recorded_at,
value:Number(r[c.field])
}));
}

const groups=new Map();

for(const r of sorted){

const d=new Date(r.recorded_at);

const parts=new Intl.DateTimeFormat('en-GB',{
timeZone:'Europe/Rome',
year:'numeric',
month:'2-digit',
day:'2-digit'
}).formatToParts(d);

const get=t=>parts.find(x=>x.type===t)?.value;

const day=
get('year')+'-'+get('month')+'-'+get('day');

const key=
p==='day'?day:
p==='week'?monday(day):
day.slice(0,7);

if(!groups.has(key)){
groups.set(key,[]);
}

groups.get(key).push(Number(r[c.field]));
}

return [...groups]
.sort((a,b)=>a[0].localeCompare(b[0]))
.slice(-30)
.map(([key,v])=>({
key,
value:kind==='water'?
v.reduce((a,b)=>a+b,0):
v.reduce((a,b)=>a+b,0)/v.length
}));
}

function svgNode(tag,attrs={},text){

const n=document.createElementNS(
'http://www.w3.org/2000/svg',
tag
);

Object.entries(attrs).forEach(([k,v])=>
n.setAttribute(k,v)
);

if(text!==undefined){
n.textContent=text;
}

return n;
}

function drawMetric(points,unit){

const svg=$('forgeMetricSvg');
if(!svg)return;

svg.replaceChildren();

if(!points.length){
svg.append(svgNode('text',{
x:300,
y:130,
fill:'#aaa',
'text-anchor':'middle'
},'Nessun dato'));
return;
}

const vals=points.map(p=>p.value);

const lo=Math.min(...vals);
const hi=Math.max(...vals);

const pad=Math.max(
(hi-lo)*.2,
unit==='kg'?.5:hi*.1,
1
);

const min=
unit==='kg'?lo-pad:Math.max(0,lo-pad);

const max=hi+pad;

const x=i=>points.length===1?
300:
55+i*500/(points.length-1);

const y=v=>
210-(v-min)/(max-min||1)*170;

for(let j=0;j<=4;j++){

const yy=40+j*42.5;

svg.append(svgNode('line',{
x1:55,
x2:555,
y1:yy,
y2:yy,
stroke:'#48413a',
'stroke-dasharray':'4 5'
}));

svg.append(svgNode('text',{
x:48,
y:yy+4,
fill:'#aaa',
'text-anchor':'end',
'font-size':11
},
fmt(
max-j*(max-min)/4,
unit==='kg'?1:0
)));
}

if(points.length>1){

svg.append(svgNode('polyline',{
points:points.map((p,i)=>
x(i)+','+y(p.value)
).join(' '),
fill:'none',
stroke:'#f0cd76',
'stroke-width':3
}));
}

points.forEach((p,i)=>{

const dot=svgNode('circle',{
cx:x(i),
cy:y(p.value),
r:5,
fill:'#f0cd76'
});

dot.addEventListener('click',()=>{
$('metricTip').textContent=
p.key+' • '+fmt(p.value,2)+' '+unit;
});

svg.append(dot);
});

$('metricTip').textContent=
points.length===1?
'Una sola registrazione.':
'Tocca i punti del grafico.';
}

function calendarTimeOptions(){

const result=[];

for(let hour=9;hour<=18;hour++){

for(const minute of [0,15,30,45]){

const value=
String(hour).padStart(2,'0')+':'+
String(minute).padStart(2,'0');

result.push(value);
}
}

result.push('19:00');

return result;
}

function calendarValidTime(value){

if(!/^\d{2}:\d{2}$/.test(value)){
return false;
}

const [h,m]=value.split(':').map(Number);

return h>=9&&h<=18&&
[0,15,30,45].includes(m)&&
(h<18||m===0);
}

function calendarSlotEnd(start){

const [h,m]=start.split(':').map(Number);

return String(h+1).padStart(2,'0')+':'+
String(m).padStart(2,'0');
}

el('p','Caricamento...','muted')
);

el('p','Caricamento...','muted')
);

const expectedDay=day;
const expectedSerial=calendarSerial;

db.from('forge_calendar_exceptions')
.select(

.eq('trainer_id',user.id)
.eq('exception_date',day)

(() => {

const bridge = window.ForgeBridge;
const originalSection = section;

const supported = [
  'Allenamento',

  'Forge Studio'
];

function formatValue(value) {

  if(value === null || value === undefined)
    return 'Non disponibile';

  if(typeof value === 'boolean')
    return value ? 'Sì' : 'No';

  if(typeof value === 'number')
    return fmt(value,2);

  return String(value);
}

function readableLabel(key) {

  const labels = {
    weight: 'Peso',
    weight_kg: 'Peso (kg)',
    current_weight: 'Peso attuale',
    body_fat: 'Massa grassa',
    measurements: 'Misurazioni',
    total_checkins: 'Check effettuati',
    active: 'Attivo',
    status: 'Stato',
    theme: 'Tema',
    theme_name: 'Tema selezionato',
    subscription_status: 'Abbonamento',
    price_eur: 'Prezzo in euro',
    expires_at: 'Scadenza',
    title: 'Titolo',
    description: 'Descrizione',
    created_at: 'Data creazione',
    updated_at: 'Ultimo aggiornamento'
  };

  return labels[key] ||
    key.replace(/_/g,' ')
    .replace(/^./,x=>x.toUpperCase());
}

function privateField(key) {

  return /(^id$|_id$|password|token|secret|storage_path|api_key|email|notes|url|path)/i
    .test(key);
}

function renderData(root,data,depth=0) {

  if(depth>4)return;

  if(data===null||data===undefined){

    root.append(el(
      'p','Nessun dato disponibile.','muted'
    ));

    return;
  }

  if(Array.isArray(data)){

    if(!data.length){

      root.append(el(
        'p','Nessuna registrazione.','muted'
      ));

      return;
    }

    for(const row of data.slice(0,50)){

      const card=el('div','','item');

      renderData(card,row,depth+1);

      root.append(card);
    }

    return;
  }

  if(typeof data!=='object'){

    root.append(el('p',formatValue(data)));

    return;
  }

  for(const [key,value] of Object.entries(data)){

    if(privateField(key))continue;

    if(value!==null&&typeof value==='object'){

      const card=el('div','','item');

      card.append(el('h3',readableLabel(key)));

      renderData(card,value,depth+1);

      root.append(card);

    }else{

      const row=el('div','','history-item');

      add(
        row,
        el('span',readableLabel(key)),
        el('strong',formatValue(value))
      );

      root.append(row);
    }
  }
}

    try{

      )return;

      if(panel.isConnected){

        output.replaceChildren(
          el(
            'div',
            friendly(e),
            'status error'
          )
        );
      }

    }finally{

      refresh.disabled=false;
    }
  }

  await load();

(() => {

'use strict';

const previousSection = section;
const previousPackages = renderPackages;

const bridge = window.ForgeBridge;

const productTypes = {
  lessons: 'Pacchetto lezioni',
  coaching: 'Coaching online',
  mixed: 'Coaching + lezioni'
};

const durationUnits = {
  days: 'giorni',
  weeks: 'settimane',
  months: 'mesi'
};

const paymentLabels = {
  pending: 'In attesa',
  confirmed: 'Confermato',
  rejected: 'Rifiutato',
  refunded: 'Rimborsato'
};

const coachingLabels = {
  active: 'Attivo',
  scheduled: 'Programmato',
  expired: 'Scaduto',
  paused: 'Sospeso',
  cancelled: 'Annullato'
};

async function call(name,params={}) {
  const {data,error}=await db.rpc(name,params);
  if(error)throw error;
  return data;
}

function selectOptions(options,value){

  const select=el('select');

  for(const [key,label] of Object.entries(options)){
    const option=el('option',label);
    option.value=key;
    select.append(option);
  }

  if(value!==undefined)select.value=value;

  return select;
}

function field(root,label,control){
  const box=el('div');
  add(box,el('label',label),control);
  root.append(box);
  return box;
}

function feedbackBox(){
  return el('div','','status hidden');
}

function feedbackMessage(root,text,error=false){
  root.className='status '+(error?'error':'success');
  root.textContent=text;
}

function isCurrent(name,request,account){
  return active===name &&
    serial===request &&
    user?.id===account;
}

function asRows(data){

  if(Array.isArray(data))return data;

  if(data&&typeof data==='object'){

    for(const key of [
      'results','foods','items',
      'exercises','rows','data'
    ]){
      if(Array.isArray(data[key])){
        return data[key];
      }
    }

    if(data.name||data.title||data.food_key){
      return [data];
    }
  }

  return [];
}

function durationText(product){

  const type=product.product_type||'lessons';
  const parts=[];

  if(type==='lessons'||type==='mixed'){
    parts.push(product.total_sessions+' lezioni');
  }

  if(type==='coaching'||type==='mixed'){
    parts.push(
      product.duration_value+' '+
      (durationUnits[product.duration_unit]||
      product.duration_unit)
    );
  }

  return parts.join(' + ');
}

function productEditor(pkg=null){

  const card=el('div','','item');

  const title=input('text','Nome prodotto');
  title.value=pkg?.title||'';

  const type=selectOptions(
    productTypes,
    pkg?.product_type||'lessons'
  );

  const sessions=input('number','Numero lezioni');
  sessions.min='0';
  sessions.step='1';
  sessions.value=pkg?.total_sessions??5;

  const duration=input('number','Durata');
  duration.min='1';
  duration.step='1';
  duration.value=pkg?.duration_value||4;

  const unit=selectOptions(
    durationUnits,
    pkg?.duration_unit||'weeks'
  );

  const price=input('number','Prezzo in euro');
  price.min='0';
  price.step='0.01';
  price.value=pkg?.price_eur??'';

  const description=el('textarea');
  description.placeholder='Descrizione del servizio';
  description.value=pkg?.description||'';
  description.rows=3;

  const availability=selectOptions({
    yes:'Pubblicato',
    no:'Non pubblicato'
  },pkg?.active?'yes':'no');

  card.append(el(
    'h3',
    pkg?'Modifica prodotto':'Crea nuovo prodotto'
  ));

  field(card,'Nome',title);
  field(card,'Tipologia',type);

  const sessionBox=field(
    card,'Numero lezioni',sessions
  );

  const durationBox=field(
    card,'Durata coaching',duration
  );

  const unitBox=field(
    card,'Unità di durata',unit
  );

  field(card,'Prezzo (€)',price);
  field(card,'Descrizione',description);
  field(card,'Visibilità nel catalogo',availability);

  const preview=el('p','','small');
  card.append(preview);

  function update(){

    sessionBox.classList.toggle(
      'hidden',type.value==='coaching'
    );

    durationBox.classList.toggle(
      'hidden',type.value==='lessons'
    );

    unitBox.classList.toggle(
      'hidden',type.value==='lessons'
    );

    preview.textContent=
      type.value==='coaching'?
      'Coaching senza lezioni incluse.':
      type.value==='mixed'?
      'Coaching con lezioni incluse.':
      'Pacchetto tradizionale di lezioni.';
  }

  type.onchange=update;
  update();

  const feedback=feedbackBox();
  const request=serial;
  const account=user?.id;

  const save=button(
    pkg?'Salva modifiche':'Crea prodotto',
    async()=>{

      const n=Number(price.value);

      const count=type.value==='coaching'?
        0:Number(sessions.value);

      const length=type.value==='lessons'?
        0:Number(duration.value);

      if(
        !title.value.trim()||
        price.value===''||
        !Number.isFinite(n)||
        n<0||
        !Number.isInteger(count)||
        count<0||
        (type.value!=='coaching'&&count<1)||
        !Number.isInteger(length)||
        (type.value!=='lessons'&&
        (length<1||length>3650))
      ){
        feedbackMessage(
          feedback,
          'Controlla nome, prezzo, lezioni e durata.',
          true
        );
        return;
      }

      save.disabled=true;

      try{

        await call(
          'forge_shop_save_product_v2',{
            p_title:title.value.trim(),
            p_price:n,
            p_product_type:type.value,
            p_total_sessions:count,
            p_duration_value:length,
            p_duration_unit:unit.value,
            p_description:
              description.value.trim()||null,
            p_active:availability.value==='yes',
            p_id:pkg?.id||null
          }
        );

        if(isCurrent('Forge Shop',request,account)){
          alert('Prodotto salvato correttamente.');
          await renderShop();
        }

      }catch(e){
        feedbackMessage(
          feedback,friendly(e),true
        );
      }finally{
        save.disabled=false;
      }
    }
  );

  add(card,save,feedback);

  return card;
}

/* CATALOGO SHOP */

renderShop=async function(){

  const root=$('sectionContent');
  const request=serial;
  const account=user?.id;

  root.replaceChildren(
    el('p','Caricamento Forge Shop...','muted')
  );

  try{

    let query=db
      .from('forge_shop_packages')
      .select(
        'id,title,total_sessions,price_eur,'+
        'active,created_at,product_type,'+
        'duration_value,duration_unit,description'
      )
      .order('created_at',{ascending:true});

    if(role!=='admin'){
      query=query.eq('active',true);
    }

    const {data,error}=await query;

    if(error)throw error;

    if(!isCurrent('Forge Shop',request,account)){
      return;
    }

    root.replaceChildren(
      el('h3','Forge Shop')
    );

    if(role==='admin'){

      const createPanel=el('details');
      createPanel.className='item';

      add(
        createPanel,
        el('summary','+ Crea nuovo prodotto'),
        productEditor()
      );

      root.append(createPanel);
    }

    for(const [type,label] of
      Object.entries(productTypes)){

      const products=(data||[]).filter(
        p=>(p.product_type||'lessons')===type
      );

      if(!products.length)continue;

      root.append(el('h3',label));

      for(const pkg of products){

        const card=el('div','','item');

        add(
          card,
          el('h3',pkg.title),
          el('div',money(pkg.price_eur),'price'),
          el('p',durationText(pkg)),
          el(
            'p',
            pkg.active?'Disponibile':'Non pubblicato',
            'small'
          )
        );

        if(pkg.description){
          card.append(el('p',pkg.description));
        }

        if(pkg.active){

          const method=selectOptions(
            methods,'bank_transfer'
          );

          const feedback=feedbackBox();

          const buy=button(
            'Richiedi acquisto',
            async()=>{

              if(!confirm(
                'Acquistare '+pkg.title+
                ' per '+money(pkg.price_eur)+'?'
              ))return;

              buy.disabled=true;

              try{

                await call(
                  'forge_shop_create_order',{
                    p_package_id:pkg.id,
                    p_payment_method:method.value
                  }
                );

                feedbackMessage(
                  feedback,
                  'Ordine registrato. Attendi conferma.'
                );

                if(isCurrent(
                  'Forge Shop',request,account
                )){
                  await loadOrders();
                }

              }catch(e){
                feedbackMessage(
                  feedback,friendly(e),true
                );
              }finally{
                buy.disabled=false;
              }
            }
          );

          add(
            card,
            el('label','Metodo di pagamento'),
            method,
            el(
              'p',
              'La richiesta non esegue il pagamento.',
              'small'
            ),
            buy,
            feedback
          );
        }

        if(role==='admin'){

          const editor=el('details');

          add(
            editor,
            el('summary','Modifica prodotto'),
            productEditor(pkg)
          );

          card.append(editor);
        }

        root.append(card);
      }
    }

    if(!data?.length){
      root.append(el(
        'p','Nessun prodotto disponibile.','muted'
      ));
    }

    const orders=el('div');
    orders.id='ordersRoot';

    root.append(orders);

    await loadOrders();

  }catch(e){

    if(isCurrent('Forge Shop',request,account)){
      root.replaceChildren(
        el('div',friendly(e),'status error')
      );
    }
  }
};

/* ORDINI E INCASSI V2 */

loadOrders=async function(){

  const root=$('ordersRoot');
  if(!root)return;

  root.replaceChildren(
    el(
      'h3',
      role==='admin'?
      'Ordini e incassi':'I miei acquisti'
    )
  );

  try{

    let q=db.from('forge_shop_orders')
      .select(
        'id,client_id,package_title,'+
        'total_sessions,price_eur,'+
        'payment_method,payment_status,'+
        'created_at,confirmed_at,'+
        'activated_package_id,product_type,'+
        'duration_value,duration_unit,'+
        'coaching_starts_on,coaching_expires_on'
      )
      .order('created_at',{ascending:false})
      .limit(100);

    if(role!=='admin'){
      q=q.eq('client_id',user.id);
    }

    const {data,error}=await q;

    if(error)throw error;
    if(!root.isConnected)return;

    const orders=data||[];

    if(role==='admin'){

      const confirmed=orders.filter(
        o=>o.payment_status==='confirmed'
      );

      const pending=orders.filter(
        o=>o.payment_status==='pending'
      );

      const stats=el('div','','stats');

      for(const [label,value] of [

        [
          'Incassi ultimi 100 ordini',
          money(confirmed.reduce(
            (a,b)=>a+Number(b.price_eur),0
          ))
        ],

        [
          'In attesa',
          String(pending.length)
        ],

        [
          'Pagamenti confermati',
          String(confirmed.length)
        ]

      ]){

        const box=el('div','','stat');

        add(
          box,
          el('span',label),
          el('strong',value)
        );

        stats.append(box);
      }

      root.append(stats);
    }

    if(!orders.length){
      root.append(el(
        'p','Nessun ordine.','muted'
      ));
    }

    for(const order of orders){

      const card=el('div','','item');

      add(
        card,
        el('h3',order.package_title),
        el('div',money(order.price_eur),'price'),
        el('p',durationText(order)),
        el(
          'p',
          'Pagamento: '+
          (methods[order.payment_method]||
          order.payment_method)
        ),
        el(
          'p',
          'Stato: '+
          (paymentLabels[order.payment_status]||
          order.payment_status)
        ),
        el('p',dt(order.created_at),'small')
      );

      if(order.coaching_starts_on){
        card.append(el(
          'p',
          'Inizio coaching: '+
          dateLabel(order.coaching_starts_on)
        ));
      }

      if(order.coaching_expires_on){
        card.append(el(
          'p',
          'Scadenza: '+
          dateLabel(order.coaching_expires_on)
        ));
      }

      if(role==='admin'){

        card.append(el(
          'p',
          'Cliente: '+order.client_id,
          'small'
        ));

        if(order.payment_status==='pending'&&
          !order.activated_package_id){

          const feedback=feedbackBox();

          const approve=button(
            'Conferma incasso e attiva',
            ()=>processOrder(true)
          );

          const reject=button(
            'Rifiuta ordine',
            ()=>processOrder(false),
            'secondary'
          );

          async function processOrder(approved){

            if(!confirm(
              approved?
              'Hai ricevuto realmente '+
              money(order.price_eur)+'?':
              'Rifiutare questo ordine?'
            ))return;

            approve.disabled=true;
            reject.disabled=true;

            try{

              await call(
                approved?
                'forge_shop_confirm_order':
                'forge_shop_cancel_order',
                {p_order_id:order.id}
              );

              if(root.isConnected){
                await loadOrders();
              }

            }catch(e){

              feedbackMessage(
                feedback,friendly(e),true
              );

            }finally{

              approve.disabled=false;
              reject.disabled=false;
            }
          }

          add(card,approve,reject,feedback);
        }
      }

      root.append(card);
    }

    const coaching=el('div');

    root.append(coaching);

    await renderCoaching(coaching);

  }catch(e){

    if(root.isConnected){
      notice(root,friendly(e),true);
    }
  }
};

    'Cerca alimento',

          feedback,
          'Inserisci almeno due caratteri.',
          true
        );
        return;

          }
        );

        if(!panel.isConnected||
          request!==searchSerial)return;

        function extractFoods(value){

  if(typeof value==='string'){
    try{
      return extractFoods(JSON.parse(value));
    }catch{
      return [];
    }
  }

  if(Array.isArray(value)){
    return value.flatMap(extractFoods);
  }

  if(!value||typeof value!=='object'){
    return [];
  }

  if(
    value.food_key!=null||
    value.food_name||
    value.name||
    value.product_name
  ){
    return [{
      ...value,
      name:value.name||
        value.food_name||
        value.product_name||
        value.title||
        'Alimento'
    }];
  }

  return Object.values(value)
    .flatMap(extractFoods);
}

const foods=extractFoods(data);

        result.replaceChildren();

/* =====================================================
   PROGRESS EVOLUTION
===================================================== */

function progressChart(root){

  const panel=el('div','','item');

  const metric=selectOptions({
    weight:'Peso corporeo',
    body_fat:'Massa grassa',
    waist:'Circonferenza vita'
  },'weight');

  const range=selectOptions({
    month:'Mese'
  },'month');

  const output=el('div');

  const load=button(
    'Visualizza andamento',
    async()=>{

      load.disabled=true;

      output.replaceChildren(
        el('p','Caricamento grafico...','muted')
      );

      try{

        const data=await bridge.progress.chart(
          metric.value,
          range.value,
          user.id
        );

        if(!panel.isConnected)return;

        const points=asRows(data)
          .filter(r=>
            r.value!==null&&
            r.value!==undefined&&
            Number.isFinite(Number(r.value))
          )
          .map(r=>({
            date:r.recorded_on,
            value:Number(r.value),
            unit:r.unit||''
          }))
          .sort((a,b)=>
            String(a.date).localeCompare(String(b.date))
          )
          .slice(-60);

        output.replaceChildren();

        if(!points.length){

          output.append(el(
            'p',
            'Nessuna misurazione disponibile.',
            'muted'
          ));

          return;
        }

        const svg=svgNode('svg',{
          viewBox:'0 0 600 250',
          class:'chart'
        });

        const values=points.map(p=>p.value);

        const low=Math.min(...values);
        const high=Math.max(...values);

        const padding=Math.max(
          (high-low)*0.15,0.5
        );

        const minimum=low-padding;
        const maximum=high+padding;

        const x=i=>points.length===1?
          300:55+i*500/(points.length-1);

        const y=v=>
          210-(v-minimum)/
          (maximum-minimum)*170;

        for(let i=0;i<=4;i++){

          const yy=40+i*42.5;

          svg.append(svgNode('line',{
            x1:55,x2:555,
            y1:yy,y2:yy,
            stroke:'#48413a',
            'stroke-dasharray':'4 5'
          }));

          svg.append(svgNode('text',{
            x:48,
            y:yy+4,
            fill:'#aaa',
            'font-size':11,
            'text-anchor':'end'
          },fmt(
            maximum-i*(maximum-minimum)/4,1
          )));
        }

        if(points.length>1){

          svg.append(svgNode('polyline',{
            points:points.map(
              (p,i)=>x(i)+','+y(p.value)
            ).join(' '),
            fill:'none',
            stroke:'#e9c675',
            'stroke-width':3
          }));
        }

        const tip=el(
          'p',
          'Tocca un punto per vedere il valore.',
          'small'
        );

        points.forEach((p,i)=>{

          const dot=svgNode('circle',{
            cx:x(i),
            cy:y(p.value),
            r:6,
            fill:'#e9c675'
          });

          dot.addEventListener('click',()=>{

            tip.textContent=
              p.date+' • '+
              fmt(p.value,2)+' '+p.unit;
          });

          svg.append(dot);
        });

        const latest=points[points.length-1];

        add(
          output,
          el(
            'div',
            fmt(latest.value,2)+' '+latest.unit,
            'price'
          ),
          el('p','Ultima misurazione','small'),
          svg,
          tip
        );

        for(const point of points.slice(-10).reverse()){

          output.append(el(
            'div',
            point.date+' • '+
            fmt(point.value,2)+' '+point.unit,
            'history-item'
          ));
        }

      }catch(e){

        if(panel.isConnected){
          notice(output,friendly(e),true);
        }

      }finally{
        load.disabled=false;
      }
    }
  );

  add(
    panel,
    el('h3','Grafico progressi personale'),
    metric,
    range,
    load,
    output
  );

  root.append(panel);
}

  if(!root||!user)return;

  const request=serial;
  const account=user.id;
  const admin=role==='admin';
  const generation=++ordersRequestV4;

  function current(){

    return visibleV4(root,request,account)&&
      generation===ordersRequestV4;
  }

  root.replaceChildren(
    el('h3',admin?
      'Ordini e incassi':
      'I miei acquisti'),
    el('p','Caricamento ordini...','muted')
  );

  try{

    const orders=[];

    const pageSize=100;

    for(let offset=0;;offset+=pageSize){

      let q=db.from('forge_shop_orders')
        .select(
          'id,client_id,package_title,'+
          'total_sessions,price_eur,'+
          'payment_method,payment_status,'+
          'created_at,confirmed_at,'+
          'activated_package_id,product_type,'+
          'duration_value,duration_unit,'+
          'coaching_starts_on,coaching_expires_on,'+
          'archived_at,archive_reason'

        .order('created_at',{ascending:false})

        .range(offset,offset+pageSize-1);

      }

      const {data,error}=await q;

      if(error)throw error;

      if(!current())return;

      orders.push(...(data||[]));

      if(!data||data.length<pageSize)break;
    }

    root.replaceChildren(
      el('h3',admin?
        'Ordini e incassi':
        'I miei acquisti')
    );

      });

async function coachingV4(root){

  const request=serial;
  const account=user?.id;
  const admin=role==='admin';

  root.replaceChildren(
    el('h3',admin?
      'Percorsi coaching clienti':
      'Il mio coaching')
  );

  try{

    let q=db
      .from('forge_coaching_dashboard_v2')
      .select('*')
      .order('expires_on',{ascending:true})
      .limit(100);

    if(!admin){

      q=q.eq('client_id',account);
    }

    const {data,error}=await q;

    if(error)throw error;

    if(!visibleV4(
      root,request,account
    ))return;

    const rows=data||[];

    const filter=selectV4({
      all:'Tutti i percorsi',
      active:'Attivi',
      scheduled:'Programmati',
      expired:'Scaduti',
      paused:'Sospesi',
      cancelled:'Annullati'
    },'all');

    const output=el('div');

    add(root,filter,output);

    function draw(){

      output.replaceChildren();

      const selected=rows.filter(r=>
        filter.value==='all'||
        r.current_status===filter.value
      );

      if(!selected.length){

        output.append(el(
          'p',
          'Nessun percorso coaching.',
          'muted'
        ));
      }

      for(const r of selected){

        const card=el('div','','item');

        add(
          card,
          el('h3',r.title||'Coaching'),
          el(
            'div',
            Math.max(
              0,Number(r.days_remaining)||0
            )+' giorni rimanenti',
            'price'
          ),
          el('p','Inizio: '+(r.starts_on||'—')),
          el('p','Scadenza: '+(r.expires_on||'—')),
          el(
            'p',
            'Stato: '+
            (labelsV4[r.current_status]||
              r.current_status)
          )
        );

        if(admin){

          card.append(el(
            'p',
            'Cliente: '+r.client_id,
            'small'
          ));
        }

        const start=Date.parse(r.starts_on);
        const end=Date.parse(r.expires_on);

        const duration=
          (end-start)/86400000;

        if(
          Number.isFinite(duration)&&
          duration>0&&
          r.days_remaining!=null&&
          Number.isFinite(Number(r.days_remaining))
        ){

          const elapsed=100*(
            1-Number(r.days_remaining)/duration
          );

          progressV4(card,elapsed);

          card.append(el(
            'p',
            Math.round(Math.max(
              0,Math.min(100,elapsed)
            ))+'% del periodo trascorso',
            'small'
          ));
        }

        if(r.renewal_alert){

          card.append(el(
            'div',
            String(r.renewal_alert),
            'calendar-warning'
          ));
        }

        if(!admin){

          card.append(button(
            'Rinnova coaching',
            ()=>section('Forge Shop'),
            'secondary'
          ));
        }

        output.append(card);
      }
    }

    filter.onchange=draw;

    draw();

  }catch(e){

    if(root.isConnected){

      notice(root,friendly(e),true);
    }
  }
}

function nutritionConverterV4(root){

  const panel=el('details','','item');

  panel.append(el(
    'summary',
    'Calcolatore equivalenze alimentari'
  ));

  const mode=selectV4({
    kcal:'Calorie',
    protein:'Proteine',
    carbs:'Carboidrati',
    fat:'Grassi'
  },'kcal');

  const foodA=input(
    'text','Alimento di partenza'
  );

  const grams=input(
    'number','Quantità alimento A (g)'
  );

  grams.value='100';
  grams.min='0.01';
  grams.step='0.01';

  const valueA=input(
    'number','Valore alimento A per 100 g'
  );

  const foodB=input(
    'text','Alimento sostitutivo'
  );

  const valueB=input(
    'number','Valore alimento B per 100 g'
  );

  for(const control of [valueA,valueB]){

    control.min='0';
    control.step='0.01';
  }

  const output=el(
    'div','','status hidden'
  );

  const calculate=button(
    'Calcola equivalenza',
    ()=>{

      const q=Number(grams.value);
      const a=Number(valueA.value);
      const b=Number(valueB.value);

      if(
        !grams.value||
        !valueA.value||
        !valueB.value||
        ![q,a,b].every(Number.isFinite)||
        q<=0||a<=0||b<=0
      ){

        statusV4(
          output,
          'Inserisci quantità e valori nutrizionali positivi.',
          true
        );

        return;
      }

      const result=q*a/b;

      const unit=mode.value==='kcal'?
        'kcal':'g';

      statusV4(
        output,
        fmt(q,1)+' g di '+
        (foodA.value||'alimento A')+
        '\nEquivalgono a '+fmt(result,1)+
        ' g di '+
        (foodB.value||'alimento B')+
        '\nValore equivalente: '+
        fmt(q*a/100,1)+' '+unit
      );
    }
  );

  add(
    panel,
    el('h3','Conversione alimenti'),
    el('label','Parametro da mantenere'),
    mode,
    foodA,
    grams,
    el('label','Valore per 100 g alimento A'),
    valueA,
    foodB,
    el('label','Valore per 100 g alimento B'),
    valueB,
    calculate,
    output,
    el(
      'p',
      'Usa valori riferiti allo stesso stato degli alimenti: crudo, cotto o sgocciolato. La conversione mantiene solo il parametro selezionato.',
      'small'
    )
  );

  root.append(panel);
}

async function refreshMetricGoalV4(kind){

  const output=$('forgeV4GoalOutput');

  if(!output||!user)return;

  const request=serial;
  const account=user.id;

  const expected=kind==='water'?
    'Forge Hydration':'Forge Weight';

  if(active!==expected)return;

  try{

    if(kind==='water'){

      const goal=Number(
        localStorage.getItem(
          'forge_water_goal_'+account
        )
      );

      if(!goal||goal<=0){

        output.replaceChildren(el(
          'p',
          'Imposta il tuo obiettivo giornaliero.',
          'muted'
        ));

        return;
      }

      const today=todayRome();

      const since=new Date(
        Date.now()-48*3600000
      ).toISOString();

      const {data,error}=await db
        .from('forge_water_entries')
        .select('amount_ml,recorded_at')
        .eq('user_id',account)
        .gte('recorded_at',since);

      if(error)throw error;

      if(!visibleV4(
        output,request,account
      ))return;

      const total=(data||[])
        .filter(r=>{

          const parts=new Intl.DateTimeFormat(
            'en-GB',{
              timeZone:'Europe/Rome',
              year:'numeric',
              month:'2-digit',
              day:'2-digit'
            }
          ).formatToParts(
            new Date(r.recorded_at)
          );

          const get=t=>parts.find(
            p=>p.type===t
          )?.value;

          return get('year')+'-'+
            get('month')+'-'+get('day')===today;
        })
        .reduce(
          (sum,r)=>sum+Number(r.amount_ml),0
        );

      const percent=total/goal*100;

      output.replaceChildren(
        el(
          'div',
          fmt(total,0)+' / '+fmt(goal,0)+' ml',
          'price'
        )
      );

      progressV4(output,percent);

      output.append(el(
        'p',
        total>=goal?
          'Obiettivo giornaliero raggiunto.':
          'Mancano '+fmt(goal-total,0)+' ml',
        total>=goal?'success':'small'
      ));

    }else{

      const goal=Number(
        localStorage.getItem(
          'forge_goal_'+account
        )
      );

      if(!goal||goal<=0){

        output.replaceChildren(el(
          'p',
          'Imposta il tuo peso obiettivo.',
          'muted'
        ));

        return;
      }

      const {data,error}=await db
        .from('forge_weight_entries')
        .select('weight_kg')
        .eq('user_id',account)
        .order('recorded_at',{
          ascending:false
        })
        .limit(1);

      if(error)throw error;

      if(!visibleV4(
        output,request,account
      ))return;

      if(!data?.length){

        output.replaceChildren(el(
          'p',
          'Registra il tuo peso.',
          'muted'
        ));

        return;
      }

      const weight=Number(data[0].weight_kg);

      const difference=weight-goal;

      output.replaceChildren();

      const stats=el('div','','stats');

      statV4(
        stats,'Peso attuale',fmt(weight,1)+' kg'
      );

      statV4(
        stats,'Obiettivo',fmt(goal,1)+' kg'
      );

      output.append(stats);

      output.append(el(
        'div',
        Math.abs(difference)<0.05?
          'Obiettivo raggiunto':
          fmt(Math.abs(difference),2)+
          ' kg '+(
            difference>0?
              'sopra':'sotto'
          )+' l’obiettivo',
        'price'
      ));
    }

  }catch(e){

    if(visibleV4(
      output,request,account
    )){

      statusV4(output,friendly(e),true);
    }
  }
}

function italianName(name){

  const original=String(name||'Alimento');

  const key=original.trim().toLowerCase();

  if(dictionary[key]){
    return dictionary[key];
  }

  const states={
    raw:'crudo',
    cooked:'cotto',
    drained:'sgocciolato'
  };

  for(const [state,label] of
    Object.entries(states)){

    const suffix=', '+state;

    if(key.endsWith(suffix)){

      const base=key.slice(
        0,-suffix.length
      ).trim();

      if(dictionary[base]){
        return dictionary[base]+' ('+label+')';
      }
    }
  }

  return original;
}

  control.value=value;

  root.textContent=text;
}

function numberN10(value){

  if(value===null||
    value===undefined||
    value==='')return null;

  const n=Number(value);

  return Number.isFinite(n)&&n>=0?
    n:null;
}

function macroN10(root,label,value){

  const box=el(
    'div','','forge-n10-macro'
  );

  const n=numberN10(value);

  add(
    box,
    el('span',label),
    el(
      'strong',
      n===null?'—':fmt(n,1)+' g'
    )
  );

  root.append(box);
}

function parseQuantityN10(text){

  const match=text.match(
    /^(\d+(?:[.,]\d+)?)\s*(chilogrammi|grammi|grammo|millilitri|kg|mg|ml|cl|dl|g|l)(?:\s+|$)/i
  );

  if(!match){
    return {amount:100,unit:'g'};
  }

  const units={
    grammi:'g',
    grammo:'g',
    chilogrammi:'kg',
    millilitri:'ml'
  };

  const raw=match[2].toLowerCase();

  return {
    amount:Number(
      match[1].replace(',','.')
    ),
    unit:units[raw]||raw
  };
}

    );

    const unit=selectN10({

    },portion.unit);

    const meal=selectN10({

    const controls=el(
      'div','','forge-n10-row'

    add(controls,quantity,unit);

    const status=el(
      'div','','status hidden'

    let pendingRequest=null;
    let pendingSignature=null;

    const save=button(
      'Aggiungi al diario',
      async()=>{

        if(!current())return;

        const amount=Number(
          quantity.value
        );

        if(!Number.isFinite(amount)||

          !date.value||
          date.value>todayRome()){

          statusN10(
            status,
            'Controlla quantità e data.',
            true
          );

          return;
        }

        save.disabled=true;

        try{

          const signature=JSON.stringify([
            food.source,
            food.food_key,
            amount,
            unit.value,
            meal.value,
            date.value
          ]);

          if(
            !pendingRequest||
            pendingSignature!==signature
          ){

            pendingRequest=
              crypto.randomUUID();

            pendingSignature=signature;
          }

          const {data,error}=await db.rpc(
            'forge_nutrition_v7_add_food',{
              p_source:food.source,
              p_food_key:String(food.food_key),
              p_quantity:amount,
              p_unit:unit.value,
              p_meal:meal.value,
              p_date:date.value,
              p_extra:meal.value==='Extra',
              p_request_id:pendingRequest,
              p_density:null
            }
          );

          if(error)throw error;

          if(data?.success!==true){

            throw Error(
              data?.message||

          pendingRequest=null;
          pendingSignature=null;

      el('label','Quantità'),

      save,

  }

        if(error)throw error;

        if(!current()||

        const response=

        const rows=[
          ...(response.internal_foods||[]),
          ...(response.custom_foods||[]),
          ...(catalog.value==='online'?
            [
              ...(response.cached_foods||[]),
              ...(response.openfoodfacts?.foods||[]),
              ...(response.usda?.foods||[])
            ]:[]
          )
        ];

        const seen=new Set();

        const foods=rows.filter(food=>{

          const key=food.source+':'+
            food.food_key;

          if(seen.has(key))return false;

          seen.add(key);

          return true;
        });

        result.replaceChildren();

        if(!foods.length){

          result.append(el(
            'p',
            'Nessun alimento trovato. Prova un nome più semplice o il catalogo internazionale.',
            'small'
          ));

          return;
        }

        result.append(el(
          'p',
          foods.length+' alimenti trovati',
          'small'
        ));

        const portion=parseQuantityN10(term);

        for(const food of foods){

          result.append(
            foodCard(food,portion)
          );
        }

      }catch(e){

        if(current()){

          result.replaceChildren(
            el(
              'div',
              friendly(e),
              'status error'
            )
          );
        }

      }finally{

        find.disabled=false;
      }
    }
  );

    'keydown',

  );

    search,
    catalog,
    find,
    feedback,
    result,
    diary
  );

  root.prepend(panel);

  loadDiary();
}

async function rpcT12(name,params={}){

  const {data,error}=await db.rpc(name,params);

  if(error)throw error;

  if(data?.success===false){
    throw Error(data.message||'Operazione non riuscita.');
  }

  return data;
}

function fieldT12(root,label,control){

  add(root,el('label',label),control);

  return control;
}

function statusT12(root,text,error=false){

  root.className='status '+(
    error?'error':'success'
  );

  root.textContent=text;
}

function numberT12(value,min,max,integer=false){

  const n=Number(value);

  if(
    value===''||
    !Number.isFinite(n)||
    n<min||
    n>max||
    (integer&&!Number.isInteger(n))
  ){
    throw Error('Controlla i valori numerici.');
  }

  return n;
}

function selectT12(options){

  const control=el('select');

  for(const [value,label] of options){

    const option=el('option',label);

    option.value=value;

    control.append(option);
  }

  return control;
}

function uuidT12(value){

  return typeof value==='string'&&
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
    .test(value);
}

            rawItem;

          );

          add(
            exercise,
            el(
              'strong',
              item.exercise_name||
              item.name||
              'Esercizio'
            ),
            el(
              'p',
              (item.sets??'—')+
              ' serie × '+
              (item.repetitions??'—')+
              ' ripetizioni'
            ),
            el(
              'p',
              'Carico: '+(item.load_kg??'—')+
              ' kg • Recupero: '+
              (item.rest_seconds??'—')+' sec',
              'small'
            )
          );

          if(item.instructions){

            exercise.append(el(
              'p',item.instructions
            ));
          }

          card.append(exercise);
        }
      }

      if(admin&&uuidT12(day.id)){

        exerciseEditorT12(
          card,day.id,
          Array.isArray(items)?items:[]
        );
      }

      editor.append(card);
    }

    if(admin){

      const start=input('date');

      start.value=todayRome();

      const activation=el(
        'div','','item'
      );

      add(
        activation,
        el('h3','Attivazione programma'),
        el('label','Data di inizio'),
        start,
        button(
          'Attiva scheda per il cliente',
          ()=>execute(async()=>{

            if(!start.value){

              throw Error(
                'Seleziona la data di inizio.'
              );
            }

            if(!confirm(
              'Attivare questa scheda per il cliente selezionato?'
            ))return;

            const result=await rpcT12(
              'forge_training_v7_activate_program',{
                p_program_id:programId,
                p_start_date:start.value
              }
            );

            if(result!==true){

              throw Error(
                'Attivazione non confermata.'
              );
            }

            statusT12(
              feedback,
              'Programma attivato.'
            );

            await loadPrograms();
            await openProgram();
          })
        )
      );

      editor.append(activation);
    }
  }

  function exerciseEditorT12(root,dayId,items){

    const details=el('details','','item');

    details.append(el(
      'summary','+ Aggiungi esercizio'
    ));

    const search=input(
      'search','Cerca nel catalogo Forge'

      'text','Nome esercizio'
    );

    const sets=input(
      'number','Serie'
    );

    sets.value='3';
    sets.min='1';

    const reps=input(
      'text','Es. 8-12'
    );

    reps.value='10';

    const rest=input(
      'number','Recupero in secondi'
    );

    rest.value='90';
    rest.min='0';

    const load=input(
      'number','Carico in kg'
    );

    load.min='0';
    load.step='0.1';

    const rir=input(
      'number','RIR'
    );

    rir.min='0';
    rir.max='10';
    rir.step='0.5';

    const instructions=el('textarea');

    instructions.placeholder=
      'Note tecniche ed esecuzione';

    const searchButton=button(
      'Cerca esercizio',

        const data=await rpcT12(
          'forge_training_v8_search_exercises',{
            p_search:search.value.trim(),
            p_muscle_group:null,
            p_limit:30
          }
        );

        if(!current()||
          !details.isConnected)return;

        results.replaceChildren();

        const rows=Array.isArray(data)?
          data:
          data?.exercises||
          data?.items||[];

        if(!rows.length){

          results.append(el(
            'p',
            'Nessun risultato. Puoi inserire il nome manualmente.',
            'small'
          ));
        }

        for(const exercise of rows){

          const title=
            exercise.name||
            exercise.exercise_name||
            exercise.title;

          if(!title)continue;

          results.append(button(
            title,
            ()=>{

              name.value=title;

              results.replaceChildren(
                el(
                  'p',
                  'Selezionato: '+title,
                  'success'
                )
              );
            },
            'secondary'
          ));
        }
      }),
      'secondary'
    );

    add(
      details,
      search,
      searchButton,
      results
    );

    fieldT12(details,'Esercizio',name);
    fieldT12(details,'Serie',sets);
    fieldT12(details,'Ripetizioni',reps);
    fieldT12(details,'Recupero (sec)',rest);
    fieldT12(details,'Carico (kg)',load);
    fieldT12(details,'RIR',rir);
    fieldT12(details,'Note tecniche',instructions);

    details.append(button(
      'Salva esercizio nella scheda',
      ()=>execute(async()=>{

        if(!name.value.trim()||
          !reps.value.trim()){

          throw Error(
            'Inserisci esercizio e ripetizioni.'
          );
        }

        const order=Math.max(
          0,...items.map(i=>
            Number(
              i.exercise_order||
              i.workout_item?.exercise_order
            )||0
          )
        )+1;

        await rpcT12(
          'forge_v4_add_workout_item',{
            p_workout_day_id:dayId,
            p_exercise_name:name.value.trim(),
            p_exercise_order:order,
            p_sets:numberT12(
              sets.value,1,100,true
            ),
            p_repetitions:reps.value.trim(),
            p_rest_seconds:numberT12(
              rest.value,0,3600,true
            ),
            p_load_kg:load.value===''?
              null:numberT12(
                load.value,0,2000
              ),
            p_rir:rir.value===''?
              null:numberT12(
                rir.value,0,10
              ),
            p_instructions:
              instructions.value.trim()||null
          }
        );

        statusT12(
          feedback,'Esercizio salvato.'
        );

        await openProgram();
      })
    ));

    root.append(details);
  }

  if(admin){

    const createPanel=el(
      'details','','item'
    );

    createPanel.append(el(
      'summary','+ Crea nuova scheda'
    ));

    const title=input(
      'text','Nome programma'
    );

    const description=el('textarea');

    description.placeholder=
      'Descrizione del programma';

    const goal=input(
      'text','Es. Ipertrofia'
    );

    const difficulty=selectT12([
      ['','Non specificata'],
      ['beginner','Principiante'],
      ['intermediate','Intermedio'],
      ['advanced','Avanzato']
    ]);

    const weeks=input(
      'number','Durata in settimane'
    );

    weeks.value='8';
    weeks.min='1';

    fieldT12(
      createPanel,'Nome scheda',title
    );

    fieldT12(
      createPanel,'Descrizione',description
    );

    fieldT12(
      createPanel,'Obiettivo',goal
    );

    fieldT12(
      createPanel,'Livello',difficulty
    );

    fieldT12(
      createPanel,'Durata settimane',weeks
    );

    createPanel.append(button(
      'Crea programma per il cliente',
      ()=>execute(async()=>{

        if(!uuidT12(client.value)){

          throw Error(
            'Seleziona prima un cliente.'
          );
        }

        if(!title.value.trim()){

          throw Error(
            'Inserisci il nome del programma.'
          );
        }

        const target=client.value;

        const id=await rpcT12(
          'forge_v4_create_program',{
            p_client_id:target,
            p_title:title.value.trim(),
            p_description:
              description.value.trim()||null,
            p_goal:goal.value.trim()||null,
            p_difficulty:
              difficulty.value||null,
            p_duration_weeks:numberT12(
              weeks.value,1,104,true
            )
          }
        );

        if(!uuidT12(id)){

          throw Error(
            'Identificativo programma non restituito. Controlla i programmi prima di riprovare.'
          );
        }

        selectedProgram=id;
        selectedClient=target;

        statusT12(
          feedback,
          'Programma creato correttamente.'
        );

        title.value='';
        createPanel.open=false;

        await loadPrograms();
        await openProgram();
      })
    ));

    client.onchange=()=>{

      selectedProgram=null;
      selectedClient=null;

      editor.replaceChildren();

      execute(loadPrograms);
    };

    add(
      panel,
      el('label','Seleziona cliente'),
      client,
      button(
        'Aggiorna elenco clienti',
        ()=>execute(loadClients),
        'secondary'
      ),
      createPanel
    );
  }

  add(
    panel,
    feedback,
    button(
      'Aggiorna programmi',
      ()=>execute(loadPrograms),
      'secondary'
    ),
    programs,
    editor
  );

  try{

    if(admin){

      await execute(loadClients);

    }else{

      await execute(loadPrograms);
    }

  }catch(e){

    if(current()){

      statusT12(
        feedback,friendly(e),true
      );
    }
  }
}

      notice(root,friendly(e),true);
    }
  });
};

console.info(
  'FORGE TRAINING V12 ATTIVO'
);

})();

/* END FORGE TRAINING V12 */

<script>
/* FORGE TRAINING V13 - PERFORMANCE */
(function(){
"use strict";

const F13 = {
client: null,
session: null,
data: null
};

function db(){
if(F13.client) return F13.client;
throw new Error("Client Supabase non collegato");
}

async function rpc(name,args={}){
const {data,error}=await db().rpc(name,args);
if(error) throw new Error(error.message);
return data;
}

function el(tag,text){
const e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
return e;
}

function number(v){
return Number(v)||0;
}

function fmt(v){
return number(v).toLocaleString("it-IT",{
maximumFractionDigits:2
});
}

function status(message){
const e=document.getElementById("f13-status");
if(e)e.textContent=message;
}

function button(text,action){
const b=el("button",text);
b.type="button";
b.className="f13-btn";
b.onclick=async()=>{
b.disabled=true;
try{
await action();
}catch(e){
status(e.message);
}finally{
b.disabled=false;
}
};
return b;
}

function input(label,type="number"){
const wrap=el("label",label);
const i=el("input");
i.type=type;
if(type==="number"){
i.min="0";
i.step="any";
}
wrap.appendChild(i);
return {wrap,i};
}

function renderData(data){
const target=document.getElementById("f13-results");
if(!target)return;
target.replaceChildren();

function walk(value,parent,key){
if(value===null||value===undefined)return;

if(typeof value==="object"){
if(key){
parent.appendChild(el("h4",
key.replaceAll("_"," ")));
}
Object.entries(value).forEach(([k,v])=>{
walk(v,parent,k);
});
}else{
const row=el("div");
row.className="f13-row";
row.appendChild(el("span",
String(key).replaceAll("_"," ")));
row.appendChild(el("strong",
typeof value==="number"?fmt(value):String(value)));
parent.appendChild(row);
}
}

walk(data,target,"");
}

async function dashboard(clientId=null){
status("Caricamento statistiche...");
const data=await rpc(
"forge_training_v8_dashboard",
{p_client_id:clientId}
);
F13.data=data;
renderData(data);
status("Statistiche aggiornate");
return data;
}

async function report(clientId){
const data=await rpc(
"forge_training_v7_client_report",
{p_client_id:clientId}
);
renderData(data);
return data;
}

async function session(id){
const data=await rpc(
"forge_training_v6_get_session",
{p_session_id:id}
);
F13.session=id;
renderData(data);
return data;
}

async function saveSet(s){
if(!s.sessionId||!s.itemId){
throw new Error("Sessione o esercizio mancante");
}

if(!Number.isInteger(Number(s.setNumber))||
Number(s.setNumber)<1){
throw new Error("Numero serie non valido");
}

if(!Number.isInteger(Number(s.reps))||
Number(s.reps)<1||
Number(s.kg)<0){
throw new Error("Ripetizioni o carico non validi");
}

return rpc("forge_training_v6_save_set",{
p_session_id:s.sessionId,
p_workout_item_id:s.itemId,
p_set_number:Number(s.setNumber),
p_repetitions:Number(s.reps),
p_load_kg:Number(s.kg),
p_rir:s.rir==null?null:Number(s.rir),
p_rpe:s.rpe==null?null:Number(s.rpe),
p_rest_seconds:s.rest==null?null:Number(s.rest),
p_set_type:s.type||"working",
p_notes:s.notes||null,
p_duration_seconds:null
});
}

function mount(){
if(document.getElementById("forge-v13"))return;

const style=el("style");
style.textContent=`
#forge-v13{
background:#191a1f;
color:#f5f5f5;
border:1px solid #59492f;
border-radius:16px;
padding:16px;
margin:16px 0;
}
#forge-v13 h2,#forge-v13 h3,
#forge-v13 h4{
color:#e9c675;
}
#forge-v13 input{
width:100%;
padding:12px;
margin:6px 0 12px;
background:#08090b;
color:white;
border:1px solid #59492f;
border-radius:8px;
font-size:16px;
}
.f13-btn{
background:#e9c675;
color:#08090b;
border:0;
border-radius:10px;
padding:12px;
margin:5px 0;
width:100%;
font-weight:700;
}
.f13-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 0;
border-bottom:1px solid #333;
overflow-wrap:anywhere;
}
#f13-status{
font-size:13px;
color:#e9c675;
margin:12px 0;
}
#f13-total{
font-size:32px;
color:#e9c675;
font-weight:800;
}
`;
document.head.appendChild(style);

const panel=el("section");
panel.id="forge-v13";

panel.appendChild(el("h2",
"FORGE PERFORMANCE"));

panel.appendChild(el("p",
"Volume, tonnellaggio e progressione"));

const details=el("details");
details.appendChild(el("summary",
"Calcolatore tonnellaggio"));

const sets=input("Numero serie");
const reps=input("Ripetizioni");
const kg=input("Carico in kg");

sets.i.value="3";
reps.i.value="12";
kg.i.value="70";

details.append(sets.wrap,reps.wrap,kg.wrap);

const total=el("div");
total.id="f13-total";
details.appendChild(total);

function calculate(){
const value=
Math.max(0,number(sets.i.value))*
Math.max(0,number(reps.i.value))*
Math.max(0,number(kg.i.value));
total.textContent=fmt(value)+" kg";
}

[sets.i,reps.i,kg.i].forEach(i=>{
i.addEventListener("input",calculate);
});

calculate();
panel.appendChild(details);

panel.appendChild(button(
"Aggiorna statistiche allenamento",
()=>dashboard()
));

const st=el("div");
st.id="f13-status";
panel.appendChild(st);

const results=el("div");
results.id="f13-results";
panel.appendChild(results);

document.getElementById("app").appendChild(panel);
}

window.ForgePerformanceV13={
connect(client){
F13.client=client;
},
mount,
dashboard,
report,
session,
saveSet,
tonnage(sets){
return sets.reduce((sum,s)=>{
return sum+
number(s.repetitions)*
number(s.load_kg);
},0);
}
};

function start(){
try{
if(typeof sb!=="undefined"&&
typeof sb.rpc==="function"){
F13.client=sb;
}else if(typeof supabaseClient!=="undefined"&&
typeof supabaseClient.rpc==="function"){
F13.client=supabaseClient;
}else if(typeof supabase!=="undefined"&&
typeof supabase.rpc==="function"){
F13.client=supabase;
}
}catch(e){
console.warn("Forge V13:",e.message);
}
mount();
}

if(document.readyState==="loading"){
document.addEventListener(
"DOMContentLoaded",start,{once:true});
}else{
start();
}

})();
/* END FORGE PERFORMANCE V13 */
</script>
<script>
(function(){
"use strict";

let client, session, workout;
let busy = false;

const root = document.createElement("section");
root.id = "forge-training-v14";

root.innerHTML = `
<style>
#forge-training-v14{
background:#191a1f;
border:1px solid #59492f;
border-radius:16px;
padding:15px;
margin:15px;
color:#fff;
}

#forge-training-v14 h3{
color:#e9c675;
}
#forge-training-v14 button{
background:#e9c675;
color:#08090b;
border:0;
border-radius:9px;
padding:12px;
margin:5px 0;
font-weight:700;
}
#forge-training-v14 input{
width:100%;
min-width:0;
background:#08090b;
color:white;
border:1px solid #59492f;
border-radius:8px;
padding:10px 5px;
font-size:16px;
}
#forge-training-v14 .f14-row{
display:grid;
grid-template-columns:30px 1fr 1fr 80px;
gap:6px;
align-items:center;
margin:8px 0;
}
#forge-training-v14 .f14-exercise{
border:1px solid #59492f;
border-radius:12px;
padding:12px;
margin:12px 0;
}
#forge-training-v14 .f14-total{
color:#e9c675;
font-size:24px;
font-weight:bold;
padding:12px 0;
}
#forge-training-v14 .f14-muted{
color:#a4a5ab;
font-size:13px;
}
</style>
<h2>FORGE TRAINING</h2>
<div class="f14-muted">
Allenamento e performance integrati
</div>
<button id="f14-open">Apri i miei allenamenti</button>
<div id="f14-status"></div>
<div id="f14-content"></div>
`;

document.getElementById("app").appendChild(root);

const content = root.querySelector("#f14-content");
const status = root.querySelector("#f14-status");

function node(tag,text,parent){
const e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
if(parent)parent.appendChild(e);
return e;
}

function message(t){
status.textContent=t;
}

function format(n){
return Number(n||0).toLocaleString("it-IT",{
maximumFractionDigits:2
});
}

function button(parent,label,action){
const b=node("button",label,parent);
b.type="button";
b.onclick=async()=>{
if(busy)return;
busy=true;
b.disabled=true;
try{
message("");
await action();
}catch(e){
message(e.message||String(e));
}finally{
busy=false;
b.disabled=false;
}
};
return b;
}

function connect(){
const candidates=[
typeof sb!=="undefined"?sb:null,
typeof supabaseClient!=="undefined"?supabaseClient:null,
typeof supabase!=="undefined"?supabase:null,
window.forgeSupabase,
window.sb,
window.supabaseClient
];

client=candidates.find(x=>
x && typeof x.rpc==="function"
&& typeof x.from==="function"
);

if(!client){
throw new Error("Client Supabase non collegato");
}
}

async function rpc(name,args={}){
const {data,error}=await client.rpc(name,args);
if(error)throw new Error(error.message);
return data;
}

async function home(){
connect();

const {data,error}=await client.auth.getUser();

if(error||!data.user){
throw new Error("Accedi al tuo account Forge");
}

const uid=data.user.id;

const current=await rpc("forge_v511_current");

if(current && current.length){
session=current[0].session_id;
await loadSession();
return;
}

const {data:programs,error:pe}=
await client.from("forge_v4_programs")
.select("id,title,status")
.eq("client_id",uid);

if(pe)throw new Error(pe.message);

content.replaceChildren();

if(!programs||!programs.length){
node("p","Nessun programma assegnato.",content);
return;
}

for(const p of programs){

const panel=node("div",undefined,content);
panel.className="f14-exercise";

node("h3",p.title,panel);
node("p","Stato: "+p.status,panel);

const {data:days,error:de}=
await client.from("forge_v4_workout_days")
.select("id,title,day_number")
.eq("program_id",p.id)
.order("day_number");

if(de)throw new Error(de.message);

for(const day of days||[]){
button(panel,day.title+" - Inizia",async()=>{
session=await rpc("forge_v511_start",{
p_program_id:p.id,
p_workout_day_id:day.id
});
await loadSession();
});
}
}
}

async function loadSession(){
workout=await rpc("forge_training_v6_get_session",{
p_session_id:session
});
renderWorkout();
}

function renderWorkout(){

content.replaceChildren();

node("h3","Allenamento in corso",content);

const paused=workout.session.status==="paused";

button(content,paused?"Riprendi":"Pausa",async()=>{
await rpc(
paused?"forge_v511_resume":"forge_v511_pause",
{p_session_id:session}
);
await loadSession();
});

const rows=[];

const total=node("div","",content);
total.className="f14-total";

function calculate(){
let sum=0;
let saved=0;

for(const r of rows){
const volume=(Number(r.kg.value)||0)*
(Number(r.reps.value)||0);

r.volume.textContent=format(volume)+" kg";

if(r.saved){
sum+=r.savedVolume;
saved++;
}
}

total.textContent=
"Tonnellaggio registrato: "+format(sum)+" kg";

total.title=saved+" serie salvate";
}

for(const entry of workout.exercises||[]){

const ex=entry.exercise;
const logs=entry.sets||[];

const panel=node("div",undefined,content);
panel.className="f14-exercise";

node("h3",ex.exercise_name,panel);

const prescription=node("p",
(ex.sets||0)+" serie × "+
(ex.repetitions||"—")+" ripetizioni",
panel);

prescription.className="f14-muted";

if(ex.instructions){
node("p",ex.instructions,panel);
}

const header=node("div",undefined,panel);
header.className="f14-row";

["N.","Kg","Rip.","Salva"].forEach(t=>
node("span",t,header)
);

let count=0;

function addSet(n){

count=Math.max(count,n);

const old=logs.find(l=>
Number(l.set_number)===n
);

const row=node("div",undefined,panel);
row.className="f14-row";

node("span",String(n),row);

const kg=node("input",undefined,row);
kg.type="number";
kg.min="0";
kg.step="0.25";
kg.inputMode="decimal";
kg.placeholder="Kg";
kg.value=old?.load_kg??ex.load_kg??"";

const reps=node("input",undefined,row);
reps.type="number";
reps.min="1";
reps.step="1";
reps.inputMode="numeric";
reps.placeholder="Rip.";
reps.value=old?.repetitions??"";

const r={
kg,reps,
saved:!!old,
savedVolume:old?
Number(old.load_kg)*Number(old.repetitions):0,
volume:null
};

const save=button(row,old?"✓":"Salva",async()=>{

if(paused){
throw new Error("Riprendi prima l'allenamento");
}

if(kg.value===""||reps.value===""){
throw new Error("Inserisci peso e ripetizioni");
}

const k=Number(kg.value);
const v=Number(reps.value);

if(!Number.isFinite(k)||k<0||
!Number.isInteger(v)||v<1){
throw new Error("Controlla peso e ripetizioni");
}

await rpc("forge_training_v6_save_set",{
p_session_id:session,
p_workout_item_id:ex.id,
p_set_number:n,
p_repetitions:v,
p_load_kg:k
});

r.saved=true;
r.savedVolume=k*v;
save.textContent="✓";
calculate();

message("Serie registrata");
});

r.volume=node("div","",panel);
r.volume.className="f14-muted";

rows.push(r);

kg.oninput=reps.oninput=()=>{
save.textContent="Salva";
calculate();
};

}

const planned=Math.max(
1,
Number(ex.sets)||0,
...logs.map(l=>Number(l.set_number)||0)
);

for(let n=1;n<=planned;n++){
addSet(n);
}

button(panel,"+ Aggiungi serie",()=>{
addSet(count+1);
calculate();
});

}

calculate();

button(content,"Completa allenamento",async()=>{

throw new Error("Registra almeno una serie");
}

const unsaved=rows.some(r=>
r.reps.value!==""&&
(!r.saved||
r.savedVolume!==Number(r.kg.value)*Number(r.reps.value))
);

if(unsaved){

}

if(!confirm("Terminare l'allenamento?"))return;

await rpc("forge_v511_finish",{

});

session=null;
workout=null;

content.replaceChildren();

node("h3","Allenamento completato ✓",content);

node("p","Tonnellaggio totale: "+

a+(r.saved?r.savedVolume:0),0
))+" kg",content);

message("Allenamento salvato nello storico");

button(content,"Torna ai programmi",home);
});

}

<script>
(function(){
"use strict";

const panel=document.createElement("div");
panel.className="card";
panel.id="forgeMuscleVolume";

let mode="session";
let request=0;

const fmt=n=>Number(n||0).toLocaleString("it-IT",{
maximumFractionDigits:1
});

function make(tag,text){
const e=document.createElement(tag);
e.textContent=text||"";
return e;
}

const heading=make("h3","Forge Muscle Volume");
panel.append(heading);

panel.append(make("p",
"Volume di lavoro per gruppo muscolare"));

const filters=make("div");
filters.className="filters";
panel.append(filters);

const output=make("div");
panel.append(output);

async function load(){

const token=++request;
output.textContent="Caricamento...";

try{

const client=window.forgeSupabase;

if(!client)throw Error("Supabase non collegato");

const {data:auth,error:authError}=
await client.auth.getUser();

if(authError||!auth.user)
throw Error("Accedi al tuo account");

const uid=auth.user.id;

let query=client
.from("forge_muscle_volume_v1")
.select("session_id,muscle_group,volume_kg,repetitions,recorded_at")
.eq("client_id",uid);

if(mode==="session"){

const {data:sessions,error}=
await client.from("forge_workout_sessions")
.select("id")
.eq("client_id",uid)
.order("started_at",{ascending:false})
.limit(1);

if(error)throw error;

if(!sessions.length){
output.textContent="Nessun allenamento registrato.";
return;
}

query=query.eq("session_id",sessions[0].id);

}else{

const now=new Date();

now.setHours(0,0,0,0);

if(mode==="week"){
now.setDate(now.getDate()-
(now.getDay()+6)%7);
}else{
now.setDate(1);
}

query=query.gte("recorded_at",now.toISOString());
}

let rows=[];
let offset=0;

while(true){

const {data,error}=await query
.order("recorded_at")
.order("set_id")
.range(offset,offset+499);

if(error)throw error;

rows.push(...data);

if(data.length<500)break;

offset+=500;
}

if(token!==request)return;

const groups={};

for(const row of rows){

const name=row.muscle_group||"Da classificare";

if(!groups[name]){
groups[name]={kg:0,sets:0,reps:0};
}

groups[name].kg+=Number(row.volume_kg)||0;
groups[name].sets++;
groups[name].reps+=Number(row.repetitions)||0;
}

const list=Object.entries(groups)
.sort((a,b)=>b[1].kg-a[1].kg);

output.replaceChildren();

if(!list.length){
output.textContent="Nessuna serie registrata.";
return;
}

const max=Math.max(1,...list.map(x=>x[1].kg));

for(const [name,value] of list){

const box=make("div");
box.className="item";

box.append(make("h3",name));

const kg=make("div",fmt(value.kg)+" kg");
kg.className="price";
box.append(kg);

const track=make("div");
track.style.cssText=
"height:10px;background:#292a2e;border-radius:8px;overflow:hidden;margin:12px 0";

const bar=make("div");

bar.style.cssText=
"height:100%;background:linear-gradient(90deg,#96702f,#e9c675);border-radius:8px";

bar.style.width=(value.kg/max*100)+"%";

track.append(bar);
box.append(track);

box.append(make("p",
value.sets+" serie • "+
value.reps+" ripetizioni"));

output.append(box);
}

}catch(e){

if(token===request)
output.textContent="Errore: "+e.message;

}
}

for(const [key,label] of [
["session","Ultima sessione"],
["week","Settimana"],
["month","Mese"]
]){

const b=make("button",label);

b.onclick=()=>{
mode=key;

filters.querySelectorAll("button")
.forEach(x=>x.classList.toggle("active",x===b));

load();
};

if(key===mode)b.classList.add("active");

filters.append(b);
}

const refresh=make("button","Aggiorna volume");
refresh.className="secondary";
refresh.onclick=load;
panel.append(refresh);

function mount(){

const root=document.getElementById("sectionContent");
const title=document.getElementById("sectionTitle");
const card=document.getElementById("sectionCard");

const opened=root&&title&&card&&
title.textContent.trim()==="Allenamento"&&
!card.classList.contains("hidden");

if(opened){

if(panel.parentElement!==root){
root.append(panel);
load();
}

}else if(panel.isConnected){

request++;
panel.remove();

}
}

new MutationObserver(mount).observe(document.body,{
childList:true,
subtree:true,
attributes:true,
attributeFilter:["class"]
});

mount();

})();

"use strict";

if(window.forgePerformanceReportV2)return;
window.forgePerformanceReportV2=true;

const style=document.createElement("style");
style.textContent=`
.fpReport{
background:#191a1f;
border:1px solid #59492f;
border-radius:16px;
padding:14px;
margin:12px 0;
color:#fff;
}
.fpReport h3,.fpReport h4{
color:#e9c675;
}

display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));

}

background:#101114;

overflow:hidden;

}
.fpBar span{

background:#e9c675;
border-radius:8px;
}
.fpMuscle{
padding:12px 0;

}

}

}

}
.fpEmoji button{
min-width:0;
padding:9px 2px;

}
.fpEmoji button[aria-pressed="true"]{

background:#42351d!important;
