<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
'use strict';

const SUPABASE_URL=
'https://ctcbhysolhcjdsekoxkg.supabase.co';

const SUPABASE_KEY=
'sb_publishable_iTsNSEjOrS2mT8JhRBCvig_OONdjU5F';

const SITE_URL=
'https://h7yhp65r8k-collab.github.io/forge-coaching/';

const $=id=>document.getElementById(id);

const db=window.supabase.createClient(
SUPABASE_URL,SUPABASE_KEY
);

let user=null;
let role='client';
let active='';
let period='day';

let resetting=false;
let resetReady=false;
let serial=0;

let selectedDay='';
let calendarWeek='';
let calendarSerial=0;

const screens=[
'loading','auth','forgot','reset','pending','app'
];

const descriptions={
'Allenamento':'Programmi ed esercizi assegnati dal coach.',
'Forge Nutrition':'Monitoraggio calorie e macronutrienti.',
'Forge Hydration':'Acqua assunta e andamento nel tempo.',
'Forge Weight':'Peso corporeo, obiettivi e grafici.',
'Progress Evolution':'Foto, misure e progressi.',
'Prenotazioni':'Calendario e appuntamenti.',
'Video esercizi':'Libreria degli esercizi.',
'Forge Premium':'Contenuti esclusivi.',
'Forge Studio':'Personalizzazione del profilo.',
'Feedback':'Feedback delle sessioni.',
'Pacchetti lezioni':'Lezioni acquistate e residue.',
'Forge Shop':'Acquisti, rinnovi e pagamenti.',
'Profilo':'Informazioni account.'
};

/* FUNZIONI GENERALI */

function show(id){
screens.forEach(x=>
$(x).classList.toggle('hidden',x!==id)
);
}

function msg(id,text,error=false){
const e=$(id);
if(!e)return;
e.textContent=text;
e.className='status '+(error?'error':'success');
}

function friendly(e){
return e?.message||String(e);
}

function el(tag,text='',cls=''){
const e=document.createElement(tag);
e.textContent=text;
e.className=cls;
return e;
}

function add(parent,...children){
children.forEach(x=>parent.append(x));
return parent;
}

function money(n){
return Number(n).toLocaleString('it-IT',{
style:'currency',
currency:'EUR'
});
}

function fmt(n,d=1){
return Number(n).toLocaleString('it-IT',{
maximumFractionDigits:d
});
}

function iso(d){
return d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');
}

function parseDay(s){
return new Date(s+'T12:00:00');
}

function plusDays(s,n){
const d=parseDay(s);
d.setDate(d.getDate()+n);
return iso(d);
}

function monday(s){
const d=parseDay(s);
d.setDate(d.getDate()-(d.getDay()+6)%7);
return iso(d);
}

function timeLabel(t){
return String(t||'').slice(0,5);
}

function dateLabel(s){
return parseDay(s).toLocaleDateString('it-IT',{
weekday:'short',
day:'numeric',
month:'short'
});
}

function dt(s){
return s?new Date(s).toLocaleString('it-IT'):'—';
}

function input(type='text',placeholder=''){
const e=el('input');
e.type=type;
e.placeholder=placeholder;
return e;
}

function button(label,fn,cls=''){
const b=el('button',label,cls);
b.onclick=fn;
return b;
}

function notice(root,text,error=false){
root.append(
el('div',text,'status '+(error?'error':'success'))
);
}

function cleanUrl(){
history.replaceState(
{},document.title,location.pathname
);
}

function recoveryLink(){
const q=new URLSearchParams(location.search);
const h=new URLSearchParams(location.hash.slice(1));
return q.get('type')==='recovery'||
h.get('type')==='recovery';
}

function todayRome(){
const parts=new Intl.DateTimeFormat('en-GB',{
timeZone:'Europe/Rome',
year:'numeric',
month:'2-digit',
day:'2-digit'
}).formatToParts(new Date());

const get=t=>parts.find(p=>p.type===t)?.value;

return get('year')+'-'+get('month')+'-'+get('day');
}

/* AUTENTICAZIONE */

async function userState(){

if(resetting)return;

const {data:{session},error}=
await db.auth.getSession();

if(error||!session){
user=null;
role='client';
show('auth');
return;
}

user=session.user;

const [r,a]=await Promise.all([
db.from('user_roles')
.select('role')
.eq('user_id',user.id),

db.from('account_access')
.select('status')
.eq('user_id',user.id)
]);

if(r.error||a.error){
show('pending');
return;
}

if(a.data?.[0]?.status!=='approved'){
show('pending');
return;
}

role=r.data?.some(x=>x.role==='admin')?'admin':
r.data?.some(x=>x.role==='trainer')?'trainer':
r.data?.some(x=>x.role==='premium')?'premium':
'client';

$('welcome').textContent=
role==='admin'?
'Amministratore riconosciuto':
'Benvenuto in Forge Coaching';

$('roleInfo').textContent=user.email+' • '+role;

show('app');
}

async function logout(){
serial++;
calendarSerial++;

await db.auth.signOut();

user=null;
role='client';
active='';
resetting=false;
resetReady=false;

cleanUrl();

$('sectionCard').classList.add('hidden');

show('auth');
}

$('loginBtn').onclick=async()=>{

const b=$('loginBtn');
b.disabled=true;

try{
const {error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(error)throw error;

await userState();

}catch(e){
msg('authStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('signupBtn').onclick=async()=>{

const b=$('signupBtn');
b.disabled=true;

try{
const email=$('email').value.trim();
const password=$('password').value;

if(!email||password.length<8){
throw Error(
'Email e password di almeno 8 caratteri richieste.'
);
}

const {error}=await db.auth.signUp({
email,
password,
options:{emailRedirectTo:SITE_URL}
});

if(error)throw error;

msg(
'authStatus',
'Registrazione inviata. Attendi approvazione.'
);

}catch(e){
msg('authStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('forgotBtn').onclick=()=>{
$('recoveryEmail').value=$('email').value;
show('forgot');
};

$('backLoginBtn').onclick=()=>show('auth');

$('sendRecoveryBtn').onclick=async()=>{

const b=$('sendRecoveryBtn');
b.disabled=true;

try{
const {error}=await db.auth.resetPasswordForEmail(
$('recoveryEmail').value.trim(),
{redirectTo:SITE_URL}
);

if(error)throw error;

msg(
'forgotStatus',
'Se la mail è registrata, riceverai il link di recupero.'
);

}catch(e){
msg('forgotStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('savePasswordBtn').onclick=async()=>{

const b=$('savePasswordBtn');
b.disabled=true;

try{
if(!resetting||!resetReady){
throw Error('Link non verificato.');
}

const p=$('newPassword').value;

if(p.length<8||
p!==$('confirmPassword').value){
throw Error('Password non valide o differenti.');
}

const {error}=await db.auth.updateUser({
password:p
});

if(error)throw error;

await db.auth.signOut();

resetting=false;
resetReady=false;

cleanUrl();
show('auth');

msg(
'authStatus',
'Password aggiornata. Accedi nuovamente.'
);

}catch(e){
msg('resetStatus',friendly(e),true);
}finally{
b.disabled=false;
}
};

$('logoutBtn').onclick=logout;
$('pendingLogoutBtn').onclick=logout;

/* NAVIGAZIONE */

function section(name){

serial++;
calendarSerial++;
active=name;

$('sectionTitle').textContent=name;
$('sectionText').textContent=
descriptions[name]||'';

const root=$('sectionContent');
root.replaceChildren();

$('sectionCard').classList.remove('hidden');

document.querySelectorAll('[data-section]')
.forEach(b=>
b.classList.toggle(
'active',
b.dataset.section===name
)
);

if(name==='Prenotazioni'){
renderCalendar();
}else if(name==='Forge Shop'){
renderShop();
}else if(name==='Pacchetti lezioni'){
renderPackages();
}else if(name==='Forge Weight'){
renderMetric('weight');
}else if(name==='Forge Hydration'){
renderMetric('water');
}else if(name==='Forge Nutrition'){
renderNutrition();
}else if(name==='Profilo'){
renderProfile();
}else{
root.append(el(
'p',
'Questa sezione richiede ancora il collegamento operativo a Supabase.',
'muted'
));
}

$('sectionCard').scrollIntoView({
behavior:'smooth',
block:'start'
});
}

document.querySelectorAll('[data-section]')
.forEach(b=>
b.onclick=()=>section(b.dataset.section)
);

$('closeSectionBtn').onclick=()=>{
serial++;
calendarSerial++;
active='';

$('sectionCard').classList.add('hidden');

document.querySelectorAll('[data-section]')
.forEach(b=>b.classList.remove('active'));
};

/* PESO E IDRATAZIONE */

const metrics={
weight:{
table:'forge_weight_entries',
field:'weight_kg',
unit:'kg',
title:'Peso corporeo'
},
water:{
table:'forge_water_entries',
field:'amount_ml',
unit:'ml',
title:'Idratazione'
}
};

function renderMetric(kind){

const c=metrics[kind];
const root=$('sectionContent');

period=kind==='weight'?'entry':'day';

root.replaceChildren();

const value=input(
'number',
kind==='weight'?'Es. 82.5':'Es. 250'
);

value.step=kind==='weight'?'0.1':'1';
value.min='1';
value.max=kind==='weight'?'500':'10000';

const feedback=el('div','','status hidden');

const save=button('Salva registrazione',async()=>{

const n=Number(value.value);

if(!value.value||
!Number.isFinite(n)||
n<=0||
n>Number(value.max)||
(kind==='water'&&!Number.isInteger(n))){
feedback.textContent='Inserisci un valore valido.';
feedback.className='status error';
return;
}

save.disabled=true;

try{
const {error}=await db.from(c.table).insert({
user_id:user.id,
[c.field]:n,
recorded_at:new Date().toISOString()
});

if(error)throw error;

value.value='';
feedback.textContent='Registrazione salvata.';
feedback.className='status success';

await loadMetric(kind);

}catch(e){
feedback.textContent=friendly(e);
feedback.className='status error';
}finally{
save.disabled=false;
}
});

add(
root,
el('h3',c.title),
value,
save,
feedback
);

if(kind==='weight'){

const goal=input('number','Obiettivo peso (kg)');
goal.step='0.1';

goal.value=
localStorage.getItem('forge_goal_'+user.id)||'';

root.append(el('label','Obiettivo personale'));
root.append(goal);

root.append(button(
'Salva obiettivo',
()=>{
const n=Number(goal.value);

if(!goal.value||n<=0||n>500){
return alert('Obiettivo non valido.');
}

localStorage.setItem(
'forge_goal_'+user.id,
String(n)
);

alert('Obiettivo salvato sul dispositivo.');
},
'secondary'
));
}

const filters=el('div','','filters');

for(const [k,t] of [
['entry','Singole'],
['day','Giorni'],
['week','Settimane'],
['month','Mesi']
]){
const b=button(t,()=>{
period=k;
loadMetric(kind);
});

b.dataset.period=k;
filters.append(b);
}

root.append(filters);

const summary=el('div','','stats');
summary.id='metricSummary';

const svg=document.createElementNS(
'http://www.w3.org/2000/svg',
'svg'
);

svg.setAttribute('viewBox','0 0 600 260');
svg.classList.add('chart');
svg.id='forgeMetricSvg';

const tip=el('p','','small');
tip.id='metricTip';

const history=el('div');
history.id='metricHistory';

add(root,summary,svg,tip,history);

loadMetric(kind);
}

function groupMetric(rows,kind,p){

const c=metrics[kind];
const sorted=rows.slice().reverse();

if(p==='entry'){
return sorted.slice(-30).map(r=>({
key:r.recorded_at,
value:Number(r[c.field])
}));
}

const groups=new Map();

for(const r of sorted){

const d=new Date(r.recorded_at);

const parts=new Intl.DateTimeFormat('en-GB',{
timeZone:'Europe/Rome',
year:'numeric',
month:'2-digit',
day:'2-digit'
}).formatToParts(d);

const get=t=>parts.find(x=>x.type===t)?.value;

const day=
get('year')+'-'+get('month')+'-'+get('day');

const key=
p==='day'?day:
p==='week'?monday(day):
day.slice(0,7);

if(!groups.has(key)){
groups.set(key,[]);
}

groups.get(key).push(Number(r[c.field]));
}

return [...groups]
.sort((a,b)=>a[0].localeCompare(b[0]))
.slice(-30)
.map(([key,v])=>({
key,
value:kind==='water'?
v.reduce((a,b)=>a+b,0):
v.reduce((a,b)=>a+b,0)/v.length
}));
}

function svgNode(tag,attrs={},text){

const n=document.createElementNS(
'http://www.w3.org/2000/svg',
tag
);

Object.entries(attrs).forEach(([k,v])=>
n.setAttribute(k,v)
);

if(text!==undefined){
n.textContent=text;
}

return n;
}

function drawMetric(points,unit){

const svg=$('forgeMetricSvg');
if(!svg)return;

svg.replaceChildren();

if(!points.length){
svg.append(svgNode('text',{
x:300,
y:130,
fill:'#aaa',
'text-anchor':'middle'
},'Nessun dato'));
return;
}

const vals=points.map(p=>p.value);

const lo=Math.min(...vals);
const hi=Math.max(...vals);

const pad=Math.max(
(hi-lo)*.2,
unit==='kg'?.5:hi*.1,
1
);

const min=
unit==='kg'?lo-pad:Math.max(0,lo-pad);

const max=hi+pad;

const x=i=>points.length===1?
300:
55+i*500/(points.length-1);

const y=v=>
210-(v-min)/(max-min||1)*170;

for(let j=0;j<=4;j++){

const yy=40+j*42.5;

svg.append(svgNode('line',{
x1:55,
x2:555,
y1:yy,
y2:yy,
stroke:'#48413a',
'stroke-dasharray':'4 5'
}));

svg.append(svgNode('text',{
x:48,
y:yy+4,
fill:'#aaa',
'text-anchor':'end',
'font-size':11
},
fmt(
max-j*(max-min)/4,
unit==='kg'?1:0
)));
}

if(points.length>1){

svg.append(svgNode('polyline',{
points:points.map((p,i)=>
x(i)+','+y(p.value)
).join(' '),
fill:'none',
stroke:'#f0cd76',
'stroke-width':3
}));
}

points.forEach((p,i)=>{

const dot=svgNode('circle',{
cx:x(i),
cy:y(p.value),
r:5,
fill:'#f0cd76'
});

dot.addEventListener('click',()=>{
$('metricTip').textContent=
p.key+' • '+fmt(p.value,2)+' '+unit;
});

svg.append(dot);
});

$('metricTip').textContent=
points.length===1?
'Una sola registrazione.':
'Tocca i punti del grafico.';
}

function calendarDayOfWeek(date){
return parseDay(date).getDay();
}

function calendarTimeOptions(){

const result=[];

for(let hour=9;hour<=18;hour++){

for(const minute of [0,15,30,45]){

const value=
String(hour).padStart(2,'0')+':'+
String(minute).padStart(2,'0');

result.push(value);
}
}

result.push('19:00');

return result;
}

function calendarTimeSelect(){

const select=el('select');

for(const value of calendarTimeOptions()){

if(value==='19:00')continue;

const option=el('option',value);
option.value=value;

select.append(option);
}

return select;
}

function calendarAdminOnly(){
return role==='admin';
}

function calendarValidTime(value){

if(!/^\d{2}:\d{2}$/.test(value)){
return false;
}

const [h,m]=value.split(':').map(Number);

return h>=9&&h<=18&&
[0,15,30,45].includes(m)&&
(h<18||m===0);
}

function calendarSlotEnd(start){

const [h,m]=start.split(':').map(Number);

return String(h+1).padStart(2,'0')+':'+
String(m).padStart(2,'0');
}

function calendarIsVisible(request,sectionRequest){

return (
request===calendarSerial&&
sectionRequest===serial&&
active==='Prenotazioni'
);

/* PANNELLO AMMINISTRATORE */

function renderCalendarAdminPanel(day){

const root=$('calendarAdminPanel');
if(!root)return;

root.replaceChildren();

const panel=el('div','','calendar-admin');

panel.append(el(
'h3',
'Gestione orari del coach'
));

panel.append(el(
'p',
'Blocca le ore occupate e imposta appuntamenti fissi settimanali.',
'small'
));

const form=el('div','','calendar-admin-grid');

const dateBox=el('div');
dateBox.append(el('label','Data del blocco'));

const dateInput=input('date');
dateInput.value=day;
dateInput.min=todayRome();

dateBox.append(dateInput);

const timeBox=el('div');
timeBox.append(el('label','Ora di inizio'));

const timeSelect=calendarTimeSelect();
timeSelect.value='10:00';

timeBox.append(timeSelect);

add(form,dateBox,timeBox);

panel.append(form);

const preview=el(
'p',
'Durata del blocco: 60 minuti.',
'small'
);

panel.append(preview);

function updatePreview(){

preview.textContent=
'Orario occupato: '+
timeSelect.value+' – '+
calendarSlotEnd(timeSelect.value)+
' (60 minuti)';
}

timeSelect.onchange=updatePreview;
updatePreview();

const feedback=el(
'div',
'',
'status hidden'
);

const blockOnce=button(
'Blocca 1 ora nella data scelta',
async()=>{

if(!calendarValidTime(timeSelect.value)){
alert('Orario non valido.');
return;
}

if(dateInput.value<todayRome()){
alert('Non puoi bloccare una data passata.');
return;
}

if(!confirm(
'Bloccare il '+dateLabel(dateInput.value)+
' dalle '+timeSelect.value+
' alle '+calendarSlotEnd(timeSelect.value)+'?'
))return;

blockOnce.disabled=true;

try{

const {error}=await db.rpc(
'forge_calendar_block_once',
{
p_date:dateInput.value,
p_start:timeSelect.value,
p_notes:'Blocco inserito da Forge Calendar'
}
);

if(error)throw error;

feedback.className='status success';
feedback.textContent='Ora bloccata correttamente.';

await loadCalendar();

}catch(e){

feedback.className='status error';
feedback.textContent=friendly(e);

}finally{

blockOnce.disabled=false;
}
});

panel.append(blockOnce);

panel.append(el(
'h3',
'Blocchi fissi settimanali'
));

panel.append(el(
'p',
'Seleziona uno o più giorni. L’orario sarà occupato ogni settimana.',
'small'
));

const weekdayGrid=el('div','','weekday-grid');

const weekdayChecks=[];

for(const index of [1,2,3,4,5,6,0]){

const label=el('label','','weekday-choice');

const check=input('checkbox');
check.value=String(index);

check.checked=
index===calendarDayOfWeek(day);

weekdayChecks.push(check);

add(
label,
check,
document.createTextNode(calendarDaysNames[index])
);

weekdayGrid.append(label);
}

panel.append(weekdayGrid);

const blockWeekly=button(
'Blocca ogni settimana nei giorni selezionati',
async()=>{

const selected=weekdayChecks
.filter(x=>x.checked)
.map(x=>Number(x.value));

if(!selected.length){

alert('Seleziona almeno un giorno.');
return;
}

const start=timeSelect.value;

if(!calendarValidTime(start)){

alert('Orario non valido.');
return;
}

const names=selected
.map(x=>calendarDaysNames[x])
.join(', ');

if(!confirm(
'Creare blocchi settimanali '+names+
' dalle '+start+' alle '+
calendarSlotEnd(start)+'?'
))return;

blockWeekly.disabled=true;

const errors=[];
let created=0;

try{

for(const dow of selected){

const {error}=await db.rpc(
'forge_calendar_block_weekly',
{
p_day_of_week:dow,
p_start:start,
p_notes:'Impegno fisso settimanale'
}
);

if(error){

errors.push(
calendarDaysNames[dow]+': '+friendly(error)
);

}else{

created++;
}
}

if(errors.length){

feedback.className='status error';

feedback.textContent=
created+' blocchi creati.\n'+
errors.join('\n');

}else{

feedback.className='status success';

feedback.textContent=
'Blocchi settimanali creati: '+created;
}

await loadCalendar();

}catch(e){

feedback.className='status error';
feedback.textContent=friendly(e);

}finally{

blockWeekly.disabled=false;
}
});

panel.append(blockWeekly);
panel.append(feedback);

root.append(panel);

const manage=el('div','','calendar-admin');

manage.append(el(
'h3',
'Blocchi attivi'
));

manage.append(el(
'p',
'Da qui puoi eliminare un blocco singolo oppure una ripetizione settimanale.',
'small'
));

const onceRoot=el('div');
onceRoot.id='calendarOnceBlocks';

const weeklyRoot=el('div');
weeklyRoot.id='calendarWeeklyBlocks';

add(
manage,
el('h3','Blocchi della data selezionata'),
onceRoot,
el('h3','Blocchi settimanali'),
weeklyRoot
);

root.append(manage);

loadCalendarBlocks(day);
}

/* LETTURA BLOCCHI */

async function loadCalendarBlocks(day){

if(!calendarAdminOnly())return;

const onceRoot=$('calendarOnceBlocks');
const weeklyRoot=$('calendarWeeklyBlocks');

if(!onceRoot||!weeklyRoot)return;

onceRoot.replaceChildren(
el('p','Caricamento...','muted')
);

weeklyRoot.replaceChildren(
el('p','Caricamento...','muted')
);

const expectedDay=day;
const expectedSerial=calendarSerial;

try{

const results=await Promise.all([

db.from('forge_calendar_exceptions')
.select(
'id,exception_date,start_time,end_time,kind,notes'
)
.eq('trainer_id',user.id)
.eq('exception_date',day)
.eq('kind','blocked')
.order('start_time',{ascending:true}),

db.from('forge_calendar_weekly_blocks')
.select(
'id,day_of_week,start_time,end_time,notes'
)
.eq('trainer_id',user.id)
.order('day_of_week',{ascending:true})
.order('start_time',{ascending:true})

]);

if(
active!=='Prenotazioni'||
selectedDay!==expectedDay||
calendarSerial!==expectedSerial
){
return;
}

const onceResult=results[0];
const weeklyResult=results[1];

if(onceResult.error){
throw onceResult.error;
}

if(weeklyResult.error){
throw weeklyResult.error;
}

onceRoot.replaceChildren();
weeklyRoot.replaceChildren();

const once=onceResult.data||[];
const weekly=weeklyResult.data||[];

if(!once.length){

onceRoot.append(el(
'p',
'Nessun blocco singolo in questa data.',
'muted'
));
}

for(const block of once){

const card=el('div','','block-item');

add(
card,
el(
'strong',
timeLabel(block.start_time)+' – '+
timeLabel(block.end_time)
),
el('p','Blocco singolo','small')
);

const remove=button(
'Sblocca questa ora',
async()=>{

if(!confirm(
'Liberare l’orario '+
timeLabel(block.start_time)+' – '+
timeLabel(block.end_time)+'?'
))return;

remove.disabled=true;

try{

const {data,error}=await db.rpc(
'forge_calendar_unblock_once',
{p_block_id:block.id}
);

if(error)throw error;

if(data!==true){
throw Error('Blocco non trovato.');
}

await loadCalendar();

}catch(e){

alert('Sblocco non riuscito: '+friendly(e));
remove.disabled=false;
}
},
'secondary'
);

card.append(remove);
onceRoot.append(card);
}

if(!weekly.length){

weeklyRoot.append(el(
'p',
'Nessun blocco settimanale.',
'muted'
));
}

for(const block of weekly){

const card=el('div','','block-item');

add(
card,
el(
'strong',
calendarDaysNames[block.day_of_week]+
' • '+timeLabel(block.start_time)+
' – '+timeLabel(block.end_time)
),
el(
'p',
'Si ripete ogni settimana.',
'small'
)
);

const remove=button(
'Elimina ripetizione settimanale',
async()=>{

if(!confirm(
'Eliminare il blocco fisso del '+
calendarDaysNames[block.day_of_week]+
' alle '+timeLabel(block.start_time)+'?'
))return;

remove.disabled=true;

try{

const {data,error}=await db.rpc(
'forge_calendar_unblock_weekly',
{p_block_id:block.id}
);

if(error)throw error;

if(data!==true){
throw Error('Blocco non trovato.');
}

await loadCalendar();

}catch(e){

alert('Sblocco non riuscito: '+friendly(e));
remove.disabled=false;
}
},
'secondary'
);

card.append(remove);
weeklyRoot.append(card);
}

}catch(e){

onceRoot.replaceChildren(
el(
'div',
'Errore caricamento blocchi: '+friendly(e),
'status error'
)
);

weeklyRoot.replaceChildren();
}
}

/* VISUALIZZAZIONE SLOT */

function renderCalendarSlots(
root,
slots,
day,
request,
bookings
){

root.append(el(
'h3',
calendarAdminOnly()?
'Disponibilità della giornata':
'Orari prenotabili',
'calendar-section-title'
));

const mode=el('select');

for(const [v,t] of [
['in_person','In presenza'],
['online','Online']
]){

const o=el('option',t);
o.value=v;
mode.append(o);
}

if(!calendarAdminOnly()){

root.append(el(
'label',
'Modalità della lezione'
));

root.append(mode);

root.append(el(
'p',
'Scegli un orario verde. La prenotazione richiede approvazione del coach.',
'muted'
));
}

if(!slots.length){

root.append(el(
'p',
'Nessuno slot visualizzabile per questa data.',
'muted'
));

return;
}

const available=slots.filter(s=>
s.slot_status==='available'
).length;

root.append(el(
'p',
available+' orari disponibili su '+
slots.length+' fasce visualizzate.',
'small'
));

for(const slot of slots){

const status=slot.slot_status;

const start=timeLabel(slot.slot_start);
const end=timeLabel(slot.slot_end);

const overlapping=bookings.filter(b=>
['pending','confirmed','approved'].includes(
b.status
)&&
timeLabel(b.start_time)<end&&
timeLabel(b.end_time)>start
);

const hasPending=overlapping.some(b=>
b.status==='pending'
);

const displayStatus=
status==='occupied'&&hasPending?
'pending':
status;

const css=
displayStatus==='available'?'available':
displayStatus==='pending'?'pending':
displayStatus==='occupied'?'occupied':
displayStatus==='blocked'?'blocked':
'closed';

const card=el('div','','slot '+css);

const label={
available:'Disponibile',
pending:'Richiesta in attesa',
occupied:'Occupato',
blocked:'Bloccato',
closed:'Non disponibile'
}[displayStatus]||displayStatus;

add(
card,
el('strong',start+' – '+end),
el('p',label,'small')
);

/* PRENOTAZIONE SOLO CLIENTI */

if(
status==='available'&&
!calendarAdminOnly()
){

const book=button(
'Richiedi '+start,
async()=>{

if(!confirm(
'Richiedere una lezione il '+
dateLabel(day)+' alle '+start+'?'
))return;

book.disabled=true;

try{

const {error}=await db.rpc(
'forge_request_booking',
{
p_date:day,
p_start:start,
p_duration:60,
p_mode:mode.value
}
);

if(error)throw error;

alert(
'Richiesta inviata. Attendi approvazione del coach.'
);

if(request===calendarSerial){
await loadCalendar();
}

}catch(e){

alert(
'Prenotazione non riuscita: '+
friendly(e)
);

await loadCalendar();

}finally{

book.disabled=false;
}
}
);

card.append(book);
}

/* BLOCCO RAPIDO SOLO ADMIN */

if(
calendarAdminOnly()&&
status==='available'
){

const quickBlock=button(
'Blocca questa ora',
async()=>{

if(!confirm(
'Bloccare il '+dateLabel(day)+
' dalle '+start+' alle '+end+'?'
))return;

quickBlock.disabled=true;

try{

const {error}=await db.rpc(
'forge_calendar_block_once',
{
p_date:day,
p_start:start,
p_notes:'Blocco rapido dal calendario'
}
);

if(error)throw error;

await loadCalendar();

}catch(e){

alert(
'Blocco non riuscito: '+friendly(e)
);

quickBlock.disabled=false;
}
},
'secondary'
);

card.append(quickBlock);
}

root.append(card);
}
}

/* INIZIALIZZAZIONE */

async function initialize(){

try{

db.auth.onAuthStateChange(event=>{

if(event==='PASSWORD_RECOVERY'){

resetting=true;
resetReady=true;

show('reset');
return;
}

if(resetting)return;

if(event==='SIGNED_OUT'){

user=null;
role='client';

show('auth');
}
});

if(recoveryLink()){

resetting=true;

const {data:{session},error}=
await db.auth.getSession();

if(error||!session){

show('reset');

msg(
'resetStatus',
'Link scaduto o non valido.',
true
);

return;
}

resetReady=true;

show('reset');
return;
}

await userState();

}catch(e){

show('auth');

msg(
'authStatus',
friendly(e),
true
);
}
}

initialize();
