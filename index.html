`;
document.head.append(style);

function node(tag,text,cls){
const e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
if(cls)e.className=cls;
return e;
}

function fmt(n){
return n===null||n===undefined
?"—"
:Number(n).toLocaleString("it-IT",{
maximumFractionDigits:2
});
}

function duration(n){
if(n===null||n===undefined)return "—";
n=Math.max(0,Number(n)||0);
return [
Math.floor(n/3600),
Math.floor(n%3600/60),
Math.floor(n%60)
].map(x=>String(x).padStart(2,"0")).join(":");
}

function stat(grid,label,value){
const box=node("div",undefined,"fpStat");
box.append(
node("div",label,"fpLabel"),
node("strong",value)
);
grid.append(box);
}

function btn(label,action){
const b=node("button",label);
b.type="button";
b.onclick=action;
return b;
}

function getClient(){
if(typeof db!=="undefined"&&db.rpc)return db;
if(typeof sb!=="undefined"&&sb.rpc)return sb;
if(typeof supabaseClient!=="undefined"
&&supabaseClient.rpc)return supabaseClient;
throw Error("Connessione Supabase non disponibile.");
}

async function rpc(name,args={}){
const {data,error}=await getClient().rpc(name,args);
if(error)throw error;
return typeof data==="string"?JSON.parse(data):data;
}

function drawReport(root,r){

root.replaceChildren();

const s=r.summary||{};
const a=r.set_analysis||{};

root.append(node("h3","FORGE PERFORMANCE"));

const grid=node("div",undefined,"fpGrid");

stat(grid,"Tonnellaggio",fmt(s.tonnage_kg)+" kg");
stat(grid,"Durata",duration(r.duration_seconds));
stat(grid,"Serie totali",fmt(s.total_sets));
stat(grid,"Serie allenanti",fmt(a.working_sets));
stat(grid,"Riscaldamento",fmt(a.warmup_sets));
stat(grid,"Ripetizioni",fmt(s.total_repetitions));
stat(grid,"Esercizi",fmt(s.total_exercises));
stat(grid,"Serie a RIR 0",
Number(s.rir_recorded_sets)>0
?fmt(s.failure_sets):"Non rilevato");
stat(grid,"Rip. in serie a RIR 0",
Number(s.rir_recorded_sets)>0
?fmt(s.repetitions_in_failure_sets):"—");
stat(grid,"RIR medio",fmt(s.average_rir));
stat(grid,"RPE medio",fmt(s.average_rpe));
stat(grid,"Carico massimo",
fmt(s.maximum_load_kg)+" kg");
stat(grid,"Cedimento su serie con RIR",
s.failure_percentage==null?"—":
fmt(s.failure_percentage)+"%");
stat(grid,"Serie con RIR registrato",
fmt(s.rir_recorded_sets)+"/"+fmt(s.total_sets));

root.append(grid);

root.append(node("h3","Distribuzione muscolare"));

for(const m of r.muscle_distribution||[]){

const box=node("div",undefined,"fpMuscle");

box.append(
node("h4",m.muscle_group),
node("strong",fmt(m.tonnage_kg)+" kg")
);

const bar=node("div",undefined,"fpBar");
const fill=node("span");
fill.style.width=Math.max(0,Math.min(
100,Number(m.tonnage_percentage)||0
))+"%";
bar.append(fill);

box.append(
bar,
node("p",fmt(m.tonnage_percentage)+"% del tonnellaggio"),
node("p",fmt(m.working_sets)+" serie allenanti"),
node("p",fmt(m.warmup_sets)+" serie riscaldamento"),
node("p",fmt(m.total_repetitions)+" ripetizioni"),
node("p","Serie a cedimento: "+
(Number(m.rir_recorded_sets)>0
?fmt(m.failure_sets):"Non rilevato")),
node("p","Tonnellaggio allenante: "+
fmt(m.working_tonnage_kg)+" kg"),
node("p","RIR medio: "+fmt(m.average_rir)),
node("p","RPE medio: "+fmt(m.average_rpe))
);

root.append(box);
}

root.append(node("h3","Dettaglio esercizi"));

for(const e of r.exercises||[]){

const d=node("details");

d.append(node("summary",
e.exercise_name+" • "+fmt(e.tonnage_kg)+" kg"
));

d.append(node("p",
fmt(e.total_sets)+" serie • "+
fmt(e.repetitions)+" ripetizioni"
));

for(const set of e.sets||[]){

const row=node("div",undefined,"fpSet");

row.append(
node("strong","Serie "+set.set_number),
node("p",fmt(set.repetitions)+" rip. × "+
fmt(set.load_kg)+" kg"),
node("p","RIR "+fmt(set.rir)+
" • RPE "+fmt(set.rpe)),
node("p","Volume: "+
fmt(set.tonnage_kg)+" kg"),
node("p","Tipo: "+(set.set_type||"—"))
);

if(Number(set.rir)===0&&set.rir!=null){
row.append(node("strong","🔥 Cedimento — RIR 0"));
}

if(set.notes)row.append(node("p",set.notes));

d.append(row);
}

root.append(d);
}

root.append(node("h3","Feedback allenamento"));

root.append(node("p",
r.perceived_effort==null
?"Valutazione non registrata"
:"Valutazione: "+fmt(r.perceived_effort)+"/10"
));

if(r.feedback)root.append(node("p",r.feedback));

}

async function openHistory(root){

root.replaceChildren(
node("h3","Storico e performance"),
node("p","Caricamento...")
);

try{

const client=getClient();
const auth=await client.auth.getUser();
if(auth.error||!auth.data.user)
throw Error("Accedi nuovamente.");

const account=auth.data.user.id;

const data=await rpc("forge_v511_history");

const sessions=(Array.isArray(data)?data:[])
.filter(s=>s.status==="completed"&&
s.client_id===account)
.sort((a,b)=>new Date(b.finished_at)-
new Date(a.finished_at));

if(!root.isConnected)return;

root.replaceChildren(
node("h3","FORGE PERFORMANCE HISTORY")
);

if(!sessions.length){
root.append(node("p","Nessun allenamento concluso."));
return;
}

const chart=node("div",undefined,"fpReport");
chart.append(node("h3","Progressione tonnellaggio"));

const graph=node("div");
chart.append(graph);
root.append(chart);

const loadGraph=btn("Visualizza ultimi 10 allenamenti",
async()=>{

loadGraph.disabled=true;
graph.replaceChildren(node("p","Caricamento..."));

try{

const reports=[];

for(const s of sessions.slice(0,10).reverse()){
const r=await rpc(
"forge_performance_v2_session_report",
{p_session_id:s.id}
);
reports.push(r);
}

graph.replaceChildren();

const max=Math.max(1,...reports.map(
r=>Number(r.summary?.tonnage_kg)||0
));

for(const r of reports){

const value=Number(r.summary?.tonnage_kg)||0;

graph.append(node("p",
new Date(r.started_at).toLocaleString("it-IT")+
" • "+fmt(value)+" kg"
));

const bar=node("div",undefined,"fpBar");
const fill=node("span");
fill.style.width=(100*value/max)+"%";
bar.append(fill);
graph.append(bar);
}

}catch(e){
graph.replaceChildren(node("p",e.message));
}finally{
loadGraph.disabled=false;
}

});

chart.append(loadGraph);

for(const s of sessions){

const card=node("div",undefined,"fpReport");

card.append(
node("h3","✓ Allenamento completato"),
node("p",new Date(s.started_at)
.toLocaleString("it-IT")),
node("p","Durata: "+duration(s.duration_seconds))
);

const report=node("div");
report.hidden=true;

const open=btn("Apri report completo",async()=>{

if(!report.hidden){
report.hidden=true;
open.textContent="Apri report completo";
return;
}

open.disabled=true;
report.hidden=false;
report.replaceChildren(node("p","Caricamento..."));

try{

const r=await rpc(
"forge_performance_v2_session_report",
{p_session_id:s.id}
);

drawReport(report,r);
open.textContent="Chiudi report";

}catch(e){
report.replaceChildren(node("p",e.message));
open.textContent="Chiudi report";
}finally{
open.disabled=false;
}

});

card.append(open,report);
root.append(card);
}

}catch(e){
root.replaceChildren(node("p",e.message));
}
}

function enhance(){

const panel=document.getElementById("ftPanel");
if(!panel)return;

const select=document.getElementById("ftEffort");

if(select&&!select.dataset.fpEnhanced){

select.dataset.fpEnhanced="1";

const choices=[
["😄","Facile","2"],
["🙂","Moderato","4"],
["😅","Intenso","6"],
["🥵","Difficile","8"],
["😤","Estremo","10"]
];

select.replaceChildren(new Option(
"Seleziona intensità",""
));

const group=node("div",undefined,"fpEmoji");

for(const [emoji,label,value] of choices){

select.append(new Option(label,value));

const b=btn(emoji,()=>{

select.value=value;

for(const other of group.children){
other.setAttribute("aria-pressed",
String(other===b));
}

select.dispatchEvent(new Event("change",{
bubbles:true
}));

});

b.append(node("small",label));
b.setAttribute("aria-pressed","false");
group.append(b);
}

select.style.display="none";
select.before(group);

const feedback=document.getElementById("ftFeedback");
if(feedback){
feedback.placeholder="Note, sensazioni e qualità dell'allenamento";
}

}

for(const heading of panel.querySelectorAll("h3")){

if(heading.textContent.trim()!=="Storico allenamenti")
continue;

if(heading.dataset.fpEnhanced)continue;
heading.dataset.fpEnhanced="1";

const parent=heading.parentElement;

for(const old of parent.querySelectorAll(".ftCard")){
old.remove();
}

heading.textContent="Storico allenamenti e report";

const root=node("div");
parent.append(root);

openHistory(root);

}

}

let queued=false;

const observer=new MutationObserver(()=>{

if(queued)return;
queued=true;

requestAnimationFrame(()=>{
queued=false;
enhance();
});

});

observer.observe(document.body,{
childList:true,
subtree:true
});

enhance();

})();
</script>

<script>
(function(){
"use strict";

if(window.forgeTrainingUnifiedV1)return;
window.forgeTrainingUnifiedV1=true;

const style=document.createElement("style");

style.textContent=`
#ftLaunch{
display:none!important;
}
#ftPanel{
position:static!important;
inset:auto!important;
z-index:auto!important;
overflow:visible!important;
padding:10px 0!important;
background:transparent!important;
}
#ftPanel[hidden]{
display:none!important;
}
#forgeTrainingEntry{
margin:12px 0;
}
#forgeTrainingEntry button{
min-height:48px;
}
`;

document.head.append(style);

const entry=document.createElement("div");
entry.id="forgeTrainingEntry";

const open=document.createElement("button");
open.textContent="ALLENATI • STORICO E PERFORMANCE";

entry.append(open);

open.onclick=()=>{
const launch=document.getElementById("ftLaunch");
const panel=document.getElementById("ftPanel");

if(!launch||!panel)return;

launch.click();
panel.scrollIntoView({
behavior:"smooth",
block:"start"
});
};

function sync(){

const nav=document.querySelector(
'[data-section="Allenamento"]'
);

if(nav&&nav.textContent!=="Forge Training"){
nav.textContent="Forge Training";
}

const title=document.getElementById("sectionTitle");
const card=document.getElementById("sectionCard");
const content=document.getElementById("sectionContent");
const live=document.getElementById("forgeTrainingLive");
const panel=document.getElementById("ftPanel");

if(!title||!card||!content||!live)return;

const opened=
title.textContent.trim()==="Allenamento"&&
!card.classList.contains("hidden")&&
!document.getElementById("app").classList.contains("hidden");

if(opened){

if(entry.parentElement!==content){
content.prepend(entry);
}

if(live.parentElement!==entry){
entry.append(live);
}

const description=document.getElementById("sectionText");

const text="Allenamenti, programmi, storico e performance.";

if(description&&description.textContent!==text){
description.textContent=text;
}

}else{

if(panel)panel.hidden=true;

if(live.parentElement!==document.body){
document.body.append(live);
}

if(entry.isConnected)entry.remove();

}

}

let queued=false;

new MutationObserver(()=>{

if(queued)return;
queued=true;

requestAnimationFrame(()=>{
queued=false;
sync();
});

}).observe(document.body,{
childList:true,
subtree:true,
attributes:true,
attributeFilter:["class"]
});

sync();

})();
</script>

<style>

<script>
(function(){
"use strict";

if(window.ForgeTrainingV16)return;
window.ForgeTrainingV16=true;

const $=id=>document.getElementById(id);
const clean=s=>String(s||"").trim();
const fmt=n=>Number(n||0).toLocaleString("it-IT",{
maximumFractionDigits:1
});

function make(tag,text,cls){
const e=document.createElement(tag);
if(text)e.textContent=text;
if(cls)e.className=cls;
return e;
}

function client(){
if(window.forgeSupabase)return window.forgeSupabase;
if(typeof sb!=="undefined"&&sb.auth)return sb;
throw Error("Connessione non disponibile");
}

async function account(){
const c=client();
const {data,error}=await c.auth.getUser();
if(error||!data.user)throw Error("Accedi al tuo account");
return {c,uid:data.user.id};
}

async function rows(query){
let result=[];
let offset=0;

while(true){
const {data,error}=await query.range(offset,offset+499);
if(error)throw error;
result.push(...(data||[]));
if(!data||data.length<500)break;
offset+=500;
}
return result;
}

const history=make("details","","forge16-group");
history.id="forge16-history";

history.append(make("summary","Storico allenamenti"));

const refresh=make("button","Aggiorna storico");
refresh.type="button";
history.append(refresh);

const output=make("div");
history.append(output);

let loading=false;

async function loadHistory(){
if(loading)return;
loading=true;
refresh.disabled=true;
output.textContent="Caricamento...";

try{
const {c,uid}=await account();

const sessions=await rows(
c.from("forge_workout_sessions")
.select("id,started_at,session_status")
.eq("client_id",uid)
.order("started_at",{ascending:false})
.order("id")
);

const logs=await rows(
c.from("forge_training_v6_set_logs")
.select("id,session_id,repetitions,load_kg,set_type")
.eq("client_id",uid)
.order("id")
);

const completed=sessions.filter(s=>
["completed","finished"].includes(
String(s.session_status).toLowerCase()
));

const grouped=new Map();

logs.forEach(l=>{
if(!grouped.has(l.session_id)){
grouped.set(l.session_id,[]);
}
grouped.get(l.session_id).push(l);
});

output.replaceChildren();

let total=0;

completed.forEach(s=>{
const sets=grouped.get(s.id)||[];
total+=sets.reduce((a,l)=>
a+Number(l.repetitions||0)*
Number(l.load_kg||0),0);
});

output.append(make(
"div",
fmt(total)+" kg",
"forge16-total"
));

output.append(make(
"p",
"Tonnellaggio totale degli allenamenti conclusi"
));

if(!completed.length){
output.append(make(
"p","Nessun allenamento concluso."
));
}

completed.forEach(s=>{

const sets=grouped.get(s.id)||[];

const volume=sets.reduce((a,l)=>
a+Number(l.repetitions||0)*
Number(l.load_kg||0),0);

const card=make("div","","forge16-row");

const date=new Date(s.started_at);

card.append(make(
"h3",
date.toLocaleDateString("it-IT")
));

card.append(make(
"p",
date.toLocaleTimeString("it-IT",{
hour:"2-digit",
minute:"2-digit"
})
));

card.append(make(
"p","Serie registrate: "+sets.length
));

card.append(make(
"strong",fmt(volume)+" kg"
));

const del=make(
"button",
"Elimina allenamento",
"forge16-delete"
);

del.type="button";

del.onclick=async()=>{

if(!confirm(
"Eliminare definitivamente questo allenamento e il relativo tonnellaggio?"
))return;

del.disabled=true;

try{

const auth=await account();

if(auth.uid!==uid){
throw Error("Account cambiato");
}

const {data,error}=await auth.c
.from("forge_workout_sessions")
.delete()
.eq("id",s.id)
.eq("client_id",uid)
.eq("session_status",s.session_status)
.select("id");

if(error)throw error;

if(!data||data.length!==1){
throw Error(
"Eliminazione non autorizzata dal database"
);
}

const check=await auth.c
.from("forge_training_v6_set_logs")
.select("id")
.eq("client_id",uid)
.eq("session_id",s.id)
.limit(1);

if(check.error)throw check.error;

if(check.data&&check.data.length){
alert(
"Sessione eliminata, ma alcune serie risultano ancora presenti. Verificare il database."
);
}

await loadHistory();

if(window.ForgePerformanceV13){
try{
await window.ForgePerformanceV13.dashboard();
}catch(e){
console.warn(e);
}
}

const muscle=$("forgeMuscleVolume");

if(muscle){
const b=Array.from(
muscle.querySelectorAll("button")
).find(x=>/aggiorna volume/i.test(x.textContent));

if(b)b.click();
}

}catch(e){
alert("Eliminazione: "+e.message);
}finally{
del.disabled=false;
}

};

card.append(del);
output.append(card);

});

}catch(e){
output.textContent="Storico: "+e.message;
}finally{
loading=false;
refresh.disabled=false;
}

}

refresh.onclick=loadHistory;

history.addEventListener("toggle",()=>{
if(history.open)loadHistory();
});

const translations={
"Goal":"Obiettivo",
"Difficulty":"Difficoltà",
"Duration weeks":"Durata in settimane",
"Start date":"Data di inizio",
"End date":"Data di fine",
"active":"Attivo",
"completed":"Completato",
"finished":"Concluso",
"archived":"Archiviato",
"Muscle volume":"Volume muscolare",
"Forge Muscle Volume":"Volume muscolare",
"FORGE PERFORMANCE":"Performance"
};

function translate(root){

const walker=document.createTreeWalker(
root,NodeFilter.SHOW_TEXT
);

let node;

while(node=walker.nextNode()){

const value=clean(node.nodeValue);

if(Object.prototype.hasOwnProperty.call(
translations,value
)){
node.nodeValue=translations[value];
}

}

}

function wrapPanel(panel,label){

if(!panel)return;

if(panel.parentElement&&
panel.parentElement.classList.contains(
"forge16-group"
))return;

const wrapper=make(
"details","","forge16-group"
);

wrapper.append(make("summary",label));

panel.before(wrapper);
wrapper.append(panel);

}

function update(){

const root=$("sectionContent");
const title=$("sectionTitle");
const card=$("sectionCard");

if(!root||!title||!card)return;

const opened=
!card.classList.contains("hidden")&&
["Allenamento","Forge Training"].includes(
clean(title.textContent)
);

if(!opened)return;

root.querySelectorAll("h2,h3,h4").forEach(h=>{

const name=clean(h.textContent);

if(name==="Programmi di allenamento"){

const panel=h.parentElement;

if(panel&&panel!==root&&
!panel.querySelector(
"#forge-training-v14,#forge-v13,#forgeMuscleVolume"
)){
panel.style.display="none";
}

}

if(name==="Forge Training"&&
h.parentElement===root){
h.style.display="none";
}

});

root.querySelectorAll("p").forEach(p=>{
if(clean(p.textContent)===
"Programmi e documenti di allenamento."){
p.style.display="none";
}
});

root.querySelectorAll("h3").forEach(h=>{
if(clean(h.textContent)==="Schede allenamento PDF"){
const panel=h.parentElement;
if(panel&&panel!==root){
wrapPanel(panel,"Schede PDF");
}
}
});

if(history.parentElement!==root){
root.append(history);
}

translate(root);

}

const observer=new MutationObserver(update);

observer.observe(document.body,{
childList:true,
subtree:true,
attributes:true,
attributeFilter:["class"]
});

update();

})();
</script>

<script>
(function(){
"use strict";

if(window.ForgeMasterV17)return;
window.ForgeMasterV17=true;

const $=id=>document.getElementById(id);
const c=window.forgeSupabase||db;

let uid=null;
let accountRole=null;
let days=[];
let draftId=null;
let source="blank";
let filename=null;
let linkedDocument=null;

function E(tag,text,parent,cls){
const n=document.createElement(tag);
if(text!==undefined)n.textContent=text;
if(cls)n.className=cls;
if(parent)parent.append(n);
return n;
}

function fmt(n){
return Number(n||0).toLocaleString("it-IT",{
maximumFractionDigits:2
});
}

async function rpc(name,args={}){
const r=await c.rpc(name,args);
if(r.error)throw r.error;
return r.data;
}

async function rows(query){
let out=[];
for(let i=0;;i+=500){
const r=await query.range(i,i+499);
if(r.error)throw r.error;
out.push(...(r.data||[]));
if((r.data||[]).length<500)return out;
}
}

async function account(){
const r=await c.auth.getUser();
if(r.error||!r.data.user)
throw Error("Accedi nuovamente.");
const id=r.data.user.id;
if(uid!==id){
days=[];
draftId=null;
linkedDocument=null;
}
uid=id;
const roles=await c.from("user_roles")
.select("role").eq("user_id",uid);
if(roles.error)throw roles.error;
accountRole=(roles.data||[]).some(
x=>x.role==="admin"
)?"admin":"client";
}

function B(parent,label,fn,cls){
const b=E("button",label,parent,cls);
b.type="button";
b.onclick=async()=>{
b.disabled=true;
try{
await fn();
}catch(e){
alert(e.message||String(e));
}finally{
b.disabled=false;
}
};
return b;
}

function field(parent,label,type,value,change){
E("label",label,parent);
const n=E("input",undefined,parent);
n.type=type;
n.value=value??"";
if(type==="number")n.step="any";
n.oninput=()=>change(
type==="number"?
(n.value===""?null:Number(n.value)):
n.value
);
return n;
}

function group(parent,title){
const d=E("details",undefined,parent);
E("summary",title,d);
return d;
}

function blank(){
return {
exercise_name:"",
sets:3,
repetitions:"10",
load_kg:null,
rir:null,
rest_seconds:90,
instructions:"",
muscle_group:"",
measurement_type:"reps_load"
};
}

const panel=E("div");
panel.id="forge17";

const editor=group(panel,"Crea scheda • Foglio bianco");
const programs=group(panel,"Le mie schede e programmi");
const performance=group(panel,"Performance e storico");
const videos=group(panel,"Video esercizi");

const title=field(
editor,"Titolo scheda","text",
"Nuova scheda",()=>{}
);

const description=field(
editor,"Descrizione","text","",()=>{}
);

const target=E("select",undefined,editor);
const weeks=field(
editor,"Durata in settimane","number",
8,()=>{}
);

const activate=E("input",undefined,editor);
activate.type="checkbox";
activate.checked=true;
activate.style.width="20px";
E("span"," Attiva dopo la pubblicazione",editor);

const editorBody=E("div",undefined,editor);
const draftList=E("div",undefined,editor);

function cleanDays(){
return days.map((d,i)=>({
title:d.title||"Giorno "+(i+1),
description:d.description||"",
exercises:d.exercises.filter(
x=>String(x.exercise_name||"").trim()
)
})).filter(d=>d.exercises.length);
}

function validated(){
const data=cleanDays();
if(!title.value.trim())
throw Error("Inserisci il titolo.");
if(!data.length)
throw Error("Inserisci almeno un esercizio.");

for(const d of data){
for(const x of d.exercises){
if(!Number.isInteger(Number(x.sets))||
Number(x.sets)<1||Number(x.sets)>100)
throw Error("Controlla le serie di "+x.exercise_name);

if(x.load_kg!==null&&
(Number(x.load_kg)<0||Number(x.load_kg)>2000))
throw Error("Carico non valido.");

if(x.rir!==null&&
(Number(x.rir)<0||Number(x.rir)>20))
throw Error("RIR non valido.");

if(x.rest_seconds!==null&&
(!Number.isInteger(Number(x.rest_seconds))||
Number(x.rest_seconds)<0||
Number(x.rest_seconds)>3600))
throw Error("Recupero non valido.");
}
}
return data;
}

function renderEditor(){
editorBody.replaceChildren();

days.forEach((d,di)=>{
const box=group(
editorBody,d.title||"Giorno "+(di+1)
);
box.open=true;

field(box,"Nome giornata","text",d.title,
v=>d.title=v);

field(box,"Note giornata","text",
d.description,v=>d.description=v);

d.exercises.forEach((x,xi)=>{
const row=E("div",undefined,box,"f17-row");

const name=field(
row,"Esercizio libero o da catalogo",
"text",x.exercise_name,v=>{
x.exercise_name=v;
delete x.exercise_id;
delete x.custom_exercise_id;
}
);

const results=E("div",undefined,row);

B(row,"Cerca nel catalogo",async()=>{
const data=await rpc(
"forge_training_v8_search_exercises",{
p_search:name.value,
p_limit:15
});
results.replaceChildren();

if(!data.length)
E("p","Nessun risultato. Usa il nome libero.",results);

data.forEach(a=>{
const label=a.exercise_name||a.name||a.title;
if(!label)return;

B(results,label,()=>{
x.exercise_name=label;
name.value=label;
if(a.id)x.exercise_id=a.id;
x.muscle_group=a.muscle_group||"";
renderEditor();
},"secondary");
});
},"secondary");

field(row,"Gruppo muscolare","text",
x.muscle_group,v=>x.muscle_group=v);

field(row,"Variante","text",
x.variant,v=>x.variant=v);

const grid=E("div",undefined,row,"f17-grid");
const total=E("div");

function updateTotal(){
const rep=String(x.repetitions||"").trim();

total.textContent=/^\d+$/.test(rep)?
"Tonnellaggio previsto: "+
fmt(Number(x.sets||0)*
Number(rep)*Number(x.load_kg||0))+" kg":
"Tonnellaggio effettivo calcolato durante l'allenamento";
}

field(grid,"Serie","number",x.sets,v=>{
x.sets=v;updateTotal();
});

field(grid,"Ripetizioni","text",x.repetitions,v=>{
x.repetitions=v;updateTotal();
});

field(grid,"Carico kg","number",x.load_kg,v=>{
x.load_kg=v;updateTotal();
});

field(grid,"Recupero sec","number",
x.rest_seconds,v=>x.rest_seconds=v);

field(grid,"RIR (0 = cedimento)","number",
x.rir,v=>x.rir=v);

field(row,"Tempo di esecuzione","text",
x.tempo,v=>x.tempo=v);

field(row,"Metodo di allenamento","text",
x.training_method,v=>x.training_method=v);

field(row,"Progressione","text",
x.progression_rule,v=>x.progression_rule=v);

field(row,"Istruzioni del coach","text",
x.instructions,v=>x.instructions=v);

row.append(total);
updateTotal();

B(row,"Elimina esercizio",()=>{
if(!confirm("Rimuovere questo esercizio?"))return;
d.exercises.splice(xi,1);
renderEditor();
},"f17-danger");
});

B(box,"+ Aggiungi esercizio",()=>{
d.exercises.push(blank());
renderEditor();
});

B(box,"Elimina giornata",()=>{
if(!confirm("Rimuovere questa giornata dalla bozza?"))
return;
days.splice(di,1);
renderEditor();
},"f17-danger");
});
}

B(editor,"+ Aggiungi giornata",()=>{
if(days.length>=31)
throw Error("Massimo 31 giornate.");

days.push({
title:"Giorno "+(days.length+1),
exercises:[blank()]
});
renderEditor();
});

B(editor,"Nuova scheda da zero",async()=>{
if(days.length&&!confirm("Iniziare una nuova bozza?"))
return;

const model=await rpc(
"forge_blank_workout_template_v2",{
p_days:1,p_rows:1
});

days=model.days;
draftId=null;
source="blank";
filename=null;
linkedDocument=null;
title.value="Nuova scheda";
description.value="";
renderEditor();
});

async function saveDraft(){
await account();

draftId=await rpc(
"forge_save_workout_draft_v2",{
p_title:title.value,
p_content:validated(),
p_client_id:target.value||null,
p_source_type:source,
p_description:description.value||null,
p_filename:filename,
p_draft_id:draftId
});
return draftId;
}

B(editor,"Salva bozza",async()=>{
await saveDraft();
alert("Bozza salvata.");
await loadDrafts();
});

B(editor,"Pubblica scheda interattiva",async()=>{
if(!confirm("Pubblicare questa scheda?"))return;

const id=await saveDraft();

const program=await rpc(
"forge_publish_workout_draft_v2",{
p_draft_id:id,
p_activate:activate.checked,
p_duration_weeks:Number(weeks.value)||null
});

if(linkedDocument){
await rpc("forge_link_pdf_program_v2",{
p_document_id:linkedDocument,
p_program_id:program,
p_source_type:"pdf_import"
});
}

draftId=null;
days=[];
linkedDocument=null;
renderEditor();
alert("Scheda pubblicata.");
await loadPrograms();
await loadDrafts();
});

async function loadDrafts(){
draftList.replaceChildren();

const data=await rows(
c.from("forge_workout_drafts_v2")
.select("*")
.eq("owner_id",uid)
.eq("status","draft")
.order("created_at",{ascending:false})
);

E("h3","Bozze salvate",draftList);

data.forEach(d=>{
B(draftList,d.title,()=>{
draftId=d.id;
title.value=d.title;
description.value=d.description||"";
target.value=d.client_id||"";
source=d.source_type||"blank";
filename=d.source_filename||null;
linkedDocument=null;
days=JSON.parse(JSON.stringify(d.content));
renderEditor();
},"secondary");
});
}

async function loadClients(){
target.replaceChildren();

const personal=E("option","Allenamento personale",target);
personal.value="";

const access=await rows(
c.from("account_access")
.select("user_id")
.eq("status","approved")
.order("user_id")
);

const profiles=await rows(
c.from("profiles").select("*").order("id")
);

access.filter(a=>a.user_id!==uid).forEach(a=>{
const p=profiles.find(x=>
x.id===a.user_id||x.user_id===a.user_id
);

const label=p&&(
p.full_name||p.name||
[p.first_name,p.last_name].filter(Boolean).join(" ")||
p.email
);

if(!label)return;

const o=E("option",label,target);
o.value=a.user_id;
});
}

/* ESPORTAZIONE PDF */

let pdfLoading=null;

async function pdfLibrary(){
if(window.jspdf)return window.jspdf.jsPDF;

if(!pdfLoading){
pdfLoading=new Promise((resolve,reject)=>{
const s=document.createElement("script");
s.src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js";
s.onload=()=>resolve(window.jspdf.jsPDF);
s.onerror=()=>{
pdfLoading=null;
reject(Error("Libreria PDF non disponibile."));
};
document.head.append(s);
});
}
return pdfLoading;
}

async function exportPDF(name,data,notes,share){
const PDF=await pdfLibrary();
const doc=new PDF();
let y=22;

function line(text,size=10,bold=false){
doc.setFontSize(size);
doc.setFont("helvetica",bold?"bold":"normal");

const parts=doc.splitTextToSize(
String(text||""),180
);

parts.forEach(t=>{
if(y>278){
doc.addPage();
y=20;
}
doc.text(t,15,y);
y+=size*.43+2;
});
}

doc.setTextColor(150,112,42);
line("FORGE COACHING",23,true);
doc.setTextColor(30,30,30);
line("Alessandro Nicelli",12,true);
line(name,18,true);
if(notes)line(notes);

data.forEach((d,i)=>{
y+=5;
doc.setTextColor(150,112,42);
line(d.title||"Giorno "+(i+1),15,true);
doc.setTextColor(30,30,30);
if(d.description)line(d.description);

(d.exercises||[]).forEach((x,j)=>{
line((j+1)+". "+
(x.exercise_name||"________________"),12,true);

line(
"Serie: "+(x.sets??"____")+
" | Rip.: "+(x.repetitions||"____")+
" | Kg: "+(x.load_kg??"____")+
" | Rec.: "+(x.rest_seconds??"____")+" s"+
" | RIR: "+(x.rir??"____")
);

if(x.variant)line("Variante: "+x.variant);
if(x.training_method)line("Metodo: "+x.training_method);
if(x.tempo)line("Tempo: "+x.tempo);
if(x.instructions)line(x.instructions);
if(x.progression_rule)line(x.progression_rule);
y+=3;
});
});

const fileName=(name||"Forge Coaching")
.replace(/[^\wÀ-ÿ -]/g,"_")+".pdf";

const file=new File(
[doc.output("blob")],fileName,
{type:"application/pdf"}
);

if(share&&navigator.canShare&&
navigator.canShare({files:[file]})){
try{
await navigator.share({files:[file]});
return;
}catch(e){
if(e.name==="AbortError")return;
}
}
doc.save(fileName);
}

B(editor,"Esporta scheda PDF",()=>{
return exportPDF(
title.value,days,description.value,false
);
},"secondary");

B(editor,"Condividi scheda PDF",()=>{
return exportPDF(
title.value,days,description.value,true
);
},"secondary");

B(editor,"Esporta modello bianco",async()=>{
const model=await rpc(
"forge_blank_workout_template_v2",{
p_days:4,p_rows:8
});
await exportPDF(
"Modello scheda Forge",
model.days,"",true
);
},"secondary");

/* SMART IMPORT PDF TESTUALE */

const importBox=group(editor,"Forge Smart Import");

E("p",
"Importa un PDF testuale, controlla gli esercizi riconosciuti e pubblica la scheda.",
importBox);

const fileInput=E("input",undefined,importBox);
fileInput.type="file";
fileInput.accept="application/pdf";

const extracted=E("textarea",undefined,importBox);
extracted.rows=8;
extracted.placeholder=
"Testo della scheda da verificare";

let pdfReader=null;

async function reader(){
if(pdfReader)return pdfReader;

pdfReader=await import(
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs"
);

pdfReader.GlobalWorkerOptions.workerSrc=
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

return pdfReader;
}

B(importBox,"Leggi PDF",async()=>{
const file=fileInput.files[0];
if(!file)throw Error("Seleziona un PDF.");

const lib=await reader();
const pdf=await lib.getDocument({
data:new Uint8Array(await file.arrayBuffer())
}).promise;

let text="";

for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const content=await page.getTextContent();
let previousY=null;

for(const item of content.items){
if(!item.str)continue;
const y=item.transform[5];

if(previousY!==null&&
Math.abs(y-previousY)>3)text+="\n";

text+=item.str+(item.hasEOL?"\n":" ");
previousY=y;
}
text+="\n";
}

if(!text.trim())
throw Error("PDF senza testo leggibile. Inserisci manualmente gli esercizi.");

extracted.value=text;
filename=file.name;
});

B(importBox,"Converti in bozza modificabile",()=>{
if(!extracted.value.trim())
throw Error("Inserisci o importa il testo.");

if(days.length&&!confirm("Sostituire la bozza aperta?"))
return;

const result=[];
let day={title:"Giorno 1",exercises:[]};

for(const raw of extracted.value.split("\n")){
const line=raw.trim();
if(!line)continue;

if(/^(giorno|day|allenamento|seduta)\s+[a-z0-9]+/i.test(line)){
if(day.exercises.length)result.push(day);
day={title:line,exercises:[]};
continue;
}

const match=line.match(
/^(.+?)\s+(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?)(.*)$/i
);

if(match){
day.exercises.push({
...blank(),
exercise_name:match[1].replace(/^\d+[.)]\s*/,""),
sets:Number(match[2]),
repetitions:match[3],
instructions:match[4].trim()
});
}
}

if(day.exercises.length)result.push(day);

if(!result.length)
throw Error("Nessuna serie riconosciuta. Usa il formato: Panca piana 4x10.");

days=result;
source="pdf_import";
draftId=null;
linkedDocument=null;
renderEditor();

alert("Bozza importata. Verifica esercizi, serie e carichi prima di pubblicare.");
});

/* PROGRAMMI ED ESPORTAZIONE */

d.program.title,d.days,

B(box,"Attiva programma",async()=>{

B(box,"Archivia programma",async()=>{
if(!confirm("Archiviare questa scheda?"))return;
await rpc(
"forge_training_v7_archive_program",{
p_program_id:p.id
});
await loadPrograms();

}
});
}

B(programs,"Aggiorna programmi",loadPrograms);

/* PERFORMANCE MASTER V2 */

const performanceTarget=E(
"select",undefined,performance
);

const filter=E("select",undefined,performance);

[
["all","Tutto lo storico"],
["week","Settimana corrente"],
["month","Mese corrente"]
].forEach(([v,t])=>{
const o=E("option",t,filter);
o.value=v;
});

const stats=E("div",undefined,performance);

function localDay(date){
return new Intl.DateTimeFormat("en-CA",{
timeZone:"Europe/Rome",
year:"numeric",
month:"2-digit",
day:"2-digit"
}).format(new Date(date));
}

function periodStart(){
const now=new Date();

if(filter.value==="month")
return localDay(now).slice(0,7)+"-01";

if(filter.value==="week"){
now.setDate(now.getDate()-
(now.getDay()+6)%7);
return localDay(now);
}
return "1900-01-01";
}

async function loadPerformance(){
await account();

const person=accountRole==="admin"?
(performanceTarget.value||uid):uid;

const start=periodStart();

stats.textContent="Aggiornamento...";

const [daily,muscles,progress,sessions]=
await Promise.all([

rows(c.from("forge_training_master_daily_v2")
.select("*")
.eq("client_id",person)
.gte("training_date",start)
.order("training_date",{ascending:false})),

rows(c.from("forge_training_master_muscles_v2")
.select("*")
.eq("client_id",person)
.gte("training_date",start)
.order("training_date")),

rows(c.from("forge_training_master_progression_v2")
.select("*")
.eq("client_id",person)
.gte("training_date",start)
.order("training_date")),

rows(c.from("forge_workout_sessions")
.select("id,started_at,finished_at,forge_excluded_from_stats")
.eq("client_id",person)
.not("finished_at","is",null)
.order("started_at",{ascending:false})
.order("id"))

]);

stats.replaceChildren();

const sum=(a,k)=>a.reduce(
(n,x)=>n+Number(x[k]||0),0
);

E("div",fmt(sum(daily,"total_tonnage_kg"))+
" kg",stats,"f17-total");

E("p","Tonnellaggio totale",stats);
E("p","Serie allenanti: "+
fmt(sum(daily,"working_sets")),stats);

E("p","Ripetizioni: "+
fmt(sum(daily,"total_repetitions")),stats);

E("p","Allenamenti: "+
fmt(sum(daily,"total_sessions")),stats);

const graph=group(stats,"Andamento tonnellaggio");
const max=Math.max(
1,...daily.map(x=>Number(x.total_tonnage_kg||0))
);

daily.slice().reverse().forEach(x=>{
E("p",x.training_date+" • "+
fmt(x.total_tonnage_kg)+" kg",graph);

const bar=E("div",undefined,graph,"f17-bar");
bar.style.width=
(100*Number(x.total_tonnage_kg||0)/max)+"%";
});

const muscleBox=group(stats,"Volume per gruppo muscolare");
const grouped={};

muscles.forEach(x=>{
const key=x.muscle_group||"Da classificare";
if(!grouped[key])grouped[key]={kg:0,sets:0};
grouped[key].kg+=Number(x.total_tonnage_kg||0);
grouped[key].sets+=Number(x.working_sets||0);
});

const maxMuscle=Math.max(
1,...Object.values(grouped).map(x=>x.kg)
);

Object.entries(grouped)
.sort((a,b)=>b[1].kg-a[1].kg)
.forEach(([name,x])=>{
E("p",name+" • "+x.sets+
" serie • "+fmt(x.kg)+" kg",muscleBox);

const bar=E("div",undefined,muscleBox,"f17-bar");
bar.style.width=(100*x.kg/maxMuscle)+"%";
});

const progression=group(stats,"Progressione esercizi");
const exercises=new Map();

progress.forEach(x=>{
if(!exercises.has(x.exercise_name))
exercises.set(x.exercise_name,[]);
exercises.get(x.exercise_name).push(x);
});

exercises.forEach((list,name)=>{
const box=group(progression,name);
const maxLoad=Math.max(
1,...list.map(x=>Number(x.maximum_load_kg||0))
);

list.forEach(x=>{
E("p",x.training_date+
" • Carico max "+fmt(x.maximum_load_kg)+
" kg • Volume "+fmt(x.total_tonnage_kg)+
" kg",box);

const bar=E("div",undefined,box,"f17-bar");
bar.style.width=
(100*Number(x.maximum_load_kg||0)/maxLoad)+"%";
});
});

const history=group(stats,"Storico e gestione giornate");
history.open=true;

const groupedDays=new Map();

sessions.filter(s=>
localDay(s.started_at)>=start
).forEach(s=>{
const date=localDay(s.started_at);
if(!groupedDays.has(date))groupedDays.set(date,[]);
groupedDays.get(date).push(s);
});

async function exclude(s,flag){
await rpc("forge_exclude_session_v2",{
p_session_id:s.id,
p_exclude:flag
});
}

groupedDays.forEach((list,date)=>{
const box=group(history,date);

const included=list.filter(
s=>!s.forge_excluded_from_stats
);

if(included.length){
B(box,"Escludi intera giornata",async()=>{
if(!confirm("Escludere la giornata dalle statistiche?"))
return;

try{
for(const s of included)
await exclude(s,true);
}finally{
await loadPerformance();
}
},"f17-danger");
}

list.forEach(s=>{
const row=E("div",undefined,box,"f17-row");

E("p",new Date(s.started_at)
.toLocaleTimeString("it-IT",{
hour:"2-digit",minute:"2-digit"
}),row);

E("p",s.forge_excluded_from_stats?
"Escluso dalle statistiche":"Allenamento concluso",row);

B(row,"Dettaglio allenamento",async()=>{
const data=await rows(
c.from("forge_training_v6_set_logs")
.select("exercise_name,set_number,repetitions,load_kg,rir,set_type")
.eq("session_id",s.id)
.eq("client_id",person)
.order("exercise_name")
.order("set_number")
);

const detail=group(row,"Serie registrate");
detail.open=true;

let total=0;

data.forEach(x=>{
const kg=Number(x.repetitions||0)*
Number(x.load_kg||0);
total+=kg;

E("p",x.exercise_name+
" • Serie "+x.set_number+
" • "+x.repetitions+" rip. × "+
fmt(x.load_kg)+" kg"+
(x.rir===null?"":" • RIR "+x.rir),
detail);
});

E("strong",fmt(total)+" kg",detail);
});

B(row,s.forge_excluded_from_stats?
"Ripristina allenamento":
"Escludi allenamento",async()=>{

if(!confirm("Confermare la modifica allo storico?"))
return;

await exclude(
s,!s.forge_excluded_from_stats
);
await loadPerformance();
},s.forge_excluded_from_stats?
"secondary":"f17-danger");
});
});
}

<script>
(function(){
"use strict";

if(window.ForgeCleanV18)return;
window.ForgeCleanV18=true;

const $=id=>document.getElementById(id);

let running=false;
let queued=false;
let currentMenu=null;

function text(n){
return String(n?.textContent||"")
.replace(/\s+/g," ")
.trim();
}

function norm(s){
return String(s||"")
.toLowerCase()
.replace(/\s+/g," ")
.trim();
}

function make(tag,value,cls){
const n=document.createElement(tag);
if(value)n.textContent=value;
if(cls)n.className=cls;
return n;
}

function hide(n){
if(n&&!n.classList.contains("f18-hidden"))
n.classList.add("f18-hidden");
}

function reveal(n){
if(n)n.classList.remove("f18-hidden");
}

function findSummary(root,label){
return Array.from(
root.querySelectorAll("summary")
).find(n=>norm(text(n))===norm(label));
}

function findHeading(root,label){
return Array.from(
root.querySelectorAll("h2,h3,h4")
).find(n=>norm(text(n))===norm(label));
}

function findBlock(root,label){
const h=findHeading(root,label);
return h?h.parentElement:null;
}

function findButton(root,label){
return Array.from(
root.querySelectorAll("button")
).find(n=>norm(text(n))===norm(label));
}

function createGroup(menu,id,title,description){
const d=make("details");
d.id=id;

const summary=make("summary",title);
summary.append(
make("span",description,"f18-subtitle")
);

const content=make("div","","f18-content");

d.append(summary,content);
menu.append(d);

d.addEventListener("toggle",()=>{
if(!d.open)return;

Array.from(menu.children).forEach(other=>{
if(other!==d&&other.tagName==="DETAILS")
other.open=false;
});
});

return content;
}

function move(node,target){
if(!node||!target)return;
if(node===target||node.contains(target))return;

if(node.parentElement!==target)
target.append(node);

reveal(node);
}

function createMenu(root){
const menu=make("div");
menu.id="forge18-menu";

const train=createGroup(
menu,
"f18-train",
"Allenati",
"Scheda attiva, timer, serie e carichi"
);

const editor=createGroup(
menu,
"f18-editor",
"Crea scheda",
"Allenamento personale o per un cliente"
);

const programs=createGroup(
menu,
"f18-programs",
"Gestione programmi",
"Bozze, schede attive e archivio"
);

const pdf=createGroup(
menu,
"f18-pdf",
"Forge PDF & Smart Import",
"Importa, consulta, esporta e condividi"
);

const performance=createGroup(
menu,
"f18-performance",
"Performance e storico",
"Volume, tonnellaggio e progressione"
);

const video=createGroup(
menu,
"f18-video",
"Video esercizi",
"Libreria degli esercizi"
);

root.prepend(menu);

return {
menu,train,editor,programs,
pdf,performance,video
};
}

function openInner(group){
if(group.tagName==="DETAILS")
group.open=true;
}

function moveDetails(node,target){
if(!node)return;

move(node,target);

if(node.tagName==="DETAILS"){
const summary=node.querySelector(":scope > summary");

if(summary)
summary.style.display="none";

openInner(node);

if(!node.dataset.f18KeepOpen){
node.dataset.f18KeepOpen="1";

node.addEventListener("toggle",()=>{
if(!node.open)node.open=true;
});
}
}
}

function cleanProgramButtons(root){
root.querySelectorAll("button").forEach(b=>{

if(text(b)==="Attiva programma"){
const card=b.closest(".f17-row");

if(card){
const active=Array.from(
card.querySelectorAll("p")
).some(p=>norm(text(p))==="attiva");

if(active)hide(b);
else reveal(b);
}
}

});
}

function translate(root){
const translations={
"Stato: active":"Stato: attivo",
"Stato: draft":"Stato: bozza",
"Stato: archived":"Stato: archiviato",
"Stato: completed":"Stato: completato",
"Stato: paused":"Stato: in pausa",
"Stato: in_progress":"Stato: in corso"
};

root.querySelectorAll("p,span").forEach(n=>{
if(n.children.length)return;

const value=translations[text(n)];

if(value&&n.textContent!==value)
n.textContent=value;
});
}

function organize(){
if(running)return;
running=true;

try{

const root=$("sectionContent");
const card=$("sectionCard");
const heading=$("sectionTitle");

const nav=document.querySelector(
'#mainNav [data-section="Allenamento"]'
);

if(nav&&text(nav)!=="Forge Training")
nav.textContent="Forge Training";

if(!root||!card||!heading)return;

if(card.classList.contains("hidden"))return;

if(!["Allenamento","Forge Training"]
.includes(text(heading)))return;

const v17=$("forge17");
if(!v17)return;

if(text(heading)!=="Forge Training")
heading.textContent="Forge Training";

const description=$("sectionText");

if(description&&text(description)!==
"Allenamento, programmazione e performance.")
description.textContent=
"Allenamento, programmazione e performance.";

if(!currentMenu||
!currentMenu.menu.isConnected){

currentMenu=createMenu(root);
}

const m=currentMenu;

/* Recupero delle interfacce originali */

const editorSummary=findSummary(
v17,"Crea scheda • Foglio bianco"
);

const programsSummary=findSummary(
v17,"Le mie schede e programmi"
);

const performanceSummary=findSummary(
v17,"Performance e storico"
);

const videoSummary=findSummary(
v17,"Video esercizi"
);

const smartSummary=findSummary(
v17,"Forge Smart Import"
);

const editorBlock=editorSummary?.parentElement;
const programsBlock=programsSummary?.parentElement;
const performanceBlock=performanceSummary?.parentElement;
const videoBlock=videoSummary?.parentElement;
const smartBlock=smartSummary?.parentElement;

/* Conserva i nodi V17 nel contenitore originale */

if(v17.parentElement!==m.editor)
move(v17,m.editor);

if(editorBlock)
moveDetails(editorBlock,v17);

if(programsBlock){
moveDetails(programsBlock,m.programs);
}

if(performanceBlock){
moveDetails(performanceBlock,m.performance);
}

if(videoBlock){
moveDetails(videoBlock,m.video);
}

if(smartBlock){
moveDetails(smartBlock,m.pdf);
}

/* Recupera il motore di allenamento esistente */

const trainingHeading=findHeading(
root,"FORGE TRAINING"
);

if(trainingHeading){
const block=trainingHeading.parentElement;

if(block!==root&&
block!==card&&
!block.contains(m.menu)){

move(block,m.train);
hide(trainingHeading);

Array.from(block.children).forEach(n=>{
if(text(n)==="Allenamento e performance integrati")
hide(n);
});
}
}

/* Coach Studio: conserva gestione clienti */

const coach=findBlock(
root,"Forge Training • Coach Studio"
);

if(coach&&coach!==root&&
!coach.contains(m.menu)){

move(coach,m.programs);

const oldCreate=Array.from(
coach.querySelectorAll("summary")
).find(n=>text(n).includes("Crea nuova scheda"));

if(oldCreate)
hide(oldCreate.parentElement);

const coachTitle=findHeading(
coach,"Forge Training • Coach Studio"
);

if(coachTitle)
coachTitle.textContent="Gestione clienti";
}

/* Unifica consultazione PDF */

const pdfConsult=findBlock(
root,"Consulta schede PDF"
);

if(pdfConsult&&
pdfConsult!==root&&
!pdfConsult.contains(m.menu)){

move(pdfConsult,m.pdf);
}

const pdfSummary=findSummary(
root,"Schede PDF"
);

if(pdfSummary){
const oldPDF=pdfSummary.parentElement;

if(!oldPDF.contains(m.menu)){
move(oldPDF,m.pdf);
oldPDF.open=false;
}
}

/* Mantieni il catalogo come supporto all'editor */

const catalog=findBlock(
root,"Catalogo esercizi Forge"
);

if(catalog&&catalog!==root&&
!catalog.contains(m.menu)){

let catalogDetails=$("f18-catalog");

if(!catalogDetails){
catalogDetails=make("details");
catalogDetails.id="f18-catalog";

catalogDetails.append(
make("summary","Catalogo esercizi")
);

m.editor.append(catalogDetails);
}

move(catalog,catalogDetails);

const h=findHeading(
catalog,"Catalogo esercizi Forge"
);

hide(h);
}

/* Rimuovi intestazioni e pulsanti superflui */

cleanProgramButtons(root);
translate(root);

root.querySelectorAll("pre").forEach(n=>{
hide(n);
});

const emptyMessage=Array.from(
root.querySelectorAll("p")
).find(n=>text(n)===
"Questa sezione richiede ancora il collegamento operativo a Supabase.");

hide(emptyMessage);

}finally{
running=false;
}
}

function schedule(){
if(queued)return;
queued=true;

requestAnimationFrame(()=>{
queued=false;

try{
organize();
}catch(e){
console.warn("Forge V18:",e);
}
});
}

const observer=new MutationObserver(schedule);

observer.observe(document.body,{
childList:true,
subtree:true,
attributes:true,
attributeFilter:["class"]
});

document.addEventListener("click",()=>{
schedule();
});

schedule();

})();
</script>

<script>
(function(){
"use strict";

if(window.ForgeCompactV19)return;
window.ForgeCompactV19=true;

const advancedFields=new Set([
  "Variante",
  "Tempo di esecuzione",
  "Metodo di allenamento",
  "Progressione",
  "Istruzioni del coach"
]);

function compactEditor(){

  document.querySelectorAll(
    "#forge17 .f17-row"
  ).forEach(row=>{

    if(row.dataset.f19Compact)return;

    const labels=Array.from(
      row.children
    ).filter(n=>
      n.tagName==="LABEL" &&
      advancedFields.has(n.textContent.trim())
    );

    if(!labels.length)return;

    const details=document.createElement("details");
    details.className="f19-advanced";

    const summary=document.createElement("summary");
    summary.textContent="Opzioni avanzate";
    details.append(summary);

    labels[0].before(details);

    labels.forEach(label=>{
      const field=label.nextElementSibling;

      if(field &&
        ["INPUT","TEXTAREA","SELECT"].includes(
          field.tagName
        )
      ){
        details.append(label,field);
      }
    });

    row.dataset.f19Compact="1";
  });
}

function emojiFeedback(){

  const select=document.getElementById("ftEffort");

  if(!select || select.dataset.f19Emoji)return;

  const previous=select.value;

  select.dataset.f19Emoji="1";
  select.dataset.fpEnhanced="1";

  const parent=select.parentElement;

  parent.querySelectorAll(
    ".fpEmoji,.f19-emoji"
  ).forEach(n=>n.remove());

  const choices=[
    ["😃","Facile","2"],
    ["😅","Impegnativo","6"],
    ["😡","Difficilissimo","10"]
  ];

  select.replaceChildren(
    new Option("Seleziona difficoltà","")
  );

  const group=document.createElement("div");
  group.className="f19-emoji";

  choices.forEach(([emoji,label,value])=>{

    select.append(new Option(label,value));

    const b=document.createElement("button");
    b.type="button";

    const face=document.createElement("span");
    face.textContent=emoji;

    const name=document.createElement("small");
    name.textContent=label;

    b.append(face,name);

    b.setAttribute(
      "aria-pressed",
      String(previous===value)
    );

    b.onclick=()=>{

      select.value=value;

      group.querySelectorAll("button")
      .forEach(other=>{
        other.setAttribute(
          "aria-pressed",
          String(other===b)
        );
      });

      select.dispatchEvent(
        new Event("change",{bubbles:true})
      );
    };

    group.append(b);
  });

  if(choices.some(x=>x[2]===previous)){
    select.value=previous;
  }

  select.style.display="none";
  select.before(group);

  const feedback=document.getElementById(
    "ftFeedback"
  );

  if(feedback){
    feedback.placeholder=
      "Note sull'allenamento (facoltative)";
  }
}

let queued=false;

function schedule(){

  if(queued)return;
  queued=true;

  requestAnimationFrame(()=>{
    queued=false;

    try{
      compactEditor();
      emojiFeedback();
    }catch(e){
      console.warn("Forge V19:",e);
    }
  });
}

const observer=new MutationObserver(schedule);

observer.observe(document.body,{
  childList:true,
  subtree:true
});

schedule();

})();
</script>

<script>
(function(){
"use strict";

if(window.ForgeTrainingV20)return;
window.ForgeTrainingV20=true;

const $=id=>document.getElementById(id);

const normalize=s=>String(s||"")
.trim().replace(/\s+/g," ");

const number=n=>Number(n)
.toLocaleString("it-IT",{
maximumFractionDigits:2
});

function field(row,label){
const labels=Array.from(
row.querySelectorAll("label")
);

const found=labels.find(n=>
normalize(n.textContent)===label
);

if(!found)return null;

if(found.htmlFor){
const target=$(found.htmlFor);
if(target)return target;
}

const next=found.nextElementSibling;

if(next&&next.matches(
"input,select,textarea"
))return next;

return found.querySelector(
"input,select,textarea"
);
}

function write(node,value){
if(node.textContent!==value)
node.textContent=value;
}

function exerciseVolume(row){

const sets=field(row,"Serie");
const reps=field(row,"Ripetizioni");
const load=field(row,"Carico kg");

if(!sets||!reps||!load)return null;

const s=Number(sets.value);
const r=String(reps.value).trim();
const k=Number(load.value);

if(!sets.value||!load.value||
!Number.isInteger(s)||s<1||
!Number.isFinite(k)||k<0)
return null;

if(/^\d+$/.test(r)){
const volume=s*Number(r)*k;
return [volume,volume];
}

const range=r.match(
/^(\d+)\s*[-–]\s*(\d+)$/
);

if(range&&Number(range[1])<=Number(range[2])){
return [
s*Number(range[1])*k,
s*Number(range[2])*k
];
}

return null;
}

function dailyVolume(){

const editor=$("f18-editor");

if(!editor)return;

const groups=Array.from(
editor.querySelectorAll("details")
);

groups.forEach(group=>{

const rows=Array.from(group.children)
.filter(n=>n.classList.contains("f17-row"));

if(!rows.length)return;

let min=0;
let max=0;
let count=0;

rows.forEach(row=>{

const volume=exerciseVolume(row);

if(!volume)return;

min+=volume[0];
max+=volume[1];
count++;

});

let output=Array.from(group.children)
.find(n=>n.classList.contains("f20-volume"));

if(!output){
output=document.createElement("div");
output.className="f20-volume";
group.append(output);
}

let label="Volume previsto giornata: ";

if(!count){
label+="inserisci serie, ripetizioni e carico";
}else{
label+=number(min);

if(max!==min)
label+=" – "+number(max);

label+=" kg";

if(count<rows.length)
label+=" • calcolo parziale";
}

write(output,label);

});

}

function improveHistory(){

const root=$("f18-performance");
if(!root)return;

root.querySelectorAll("button")
.forEach(b=>{

const text=normalize(b.textContent);

if(text==="Escludi intera giornata"){
write(b,"Escludi giornata dal volume");
b.classList.add("f20-danger");
b.title="Mantiene lo storico e consente il ripristino";
}

if(text==="Escludi allenamento"){
b.classList.add("f20-danger");
}

if(text==="Ripristina allenamento"){
b.title="Reinserisce l'allenamento nelle statistiche";
}

});

}

const feedbackLabels={
"2":"😃 Facile",
"6":"😅 Impegnativo",
"10":"😡 Difficilissimo"
};

function prepareFeedback(event){

const target=event.target.closest("button");
if(!target)return;

if(normalize(target.textContent)
.toUpperCase()!=="CONCLUDI ALLENAMENTO")
return;

const effort=$("ftEffort");
const notes=$("ftFeedback");

if(!effort||!notes)return;

const label=feedbackLabels[effort.value];

if(!label){
event.preventDefault();
event.stopImmediatePropagation();
alert("Seleziona come è andato l'allenamento.");
return;
}

const original=notes.value.replace(
/^Difficoltà:.*(?:\n|$)/,
""
).trim();

notes.value="Difficoltà: "+label+
(original?"\n"+original:"");

}

document.addEventListener(
"click",prepareFeedback,true
);

function compact(){

const nav=document.querySelector(
'#mainNav [data-section="Allenamento"]'
);

if(nav)write(nav,"Forge Training");

const root=$("forge18-menu");
if(!root)return;

root.querySelectorAll(".f17-row button")
.forEach(b=>{

const t=normalize(b.textContent);

if(t==="Elimina esercizio"||
t==="Elimina giornata"||
t==="Archivia programma"){
b.classList.add("f20-danger");
}

});

const labels={
"f18-train":"Allenati",
"f18-editor":"Crea scheda",
"f18-programs":"Gestione programmi",
"f18-pdf":"Schede PDF",
"f18-performance":"Performance e storico",
"f18-video":"Video esercizi"
};

Object.entries(labels).forEach(([id,label])=>{

const group=$(id);
if(!group)return;

const summary=group.querySelector("summary");
if(!summary)return;

const first=summary.firstChild;

if(first&&first.nodeType===3&&
normalize(first.nodeValue)!==label){
first.nodeValue=label;
}

});

}

let queued=false;

function schedule(){

if(queued)return;
queued=true;

requestAnimationFrame(()=>{

queued=false;

try{
compact();
dailyVolume();
improveHistory();
}catch(error){
console.warn("Forge Training V20:",error);
}

});

}

const observer=new MutationObserver(schedule);

observer.observe(document.body,{
childList:true,
subtree:true
});

document.addEventListener("input",schedule);
document.addEventListener("change",schedule);
document.addEventListener("click",schedule);

schedule();

console.info("Forge Training V20 caricato");

})();
</script>
<!-- END FORGE TRAINING V20 -->

<script>
(function(){
"use strict";

if(window.ForgeTrainingV21)return;
window.ForgeTrainingV21=true;

const $=id=>document.getElementById(id);
const bucket="forge-exercise-videos";

function E(tag,text,parent,cls){
 const n=document.createElement(tag);
 if(text)n.textContent=text;
 if(cls)n.className=cls;
 if(parent)parent.append(n);
 return n;
}

function B(parent,label,fn,cls){
 const b=E("button",label,parent,cls);
 b.type="button";
 b.onclick=async()=>{
 b.disabled=true;
 try{
 await fn();
 }catch(e){
 alert(e.message||String(e));
 }finally{
 b.disabled=false;
 }
 };
 return b;
}

async function auth(){
 const r=await db.auth.getUser();
 if(r.error)throw r.error;
 if(!r.data.user)
 throw Error("Accedi a Forge Coaching.");
 return r.data.user;
}

function mountTraining(){

 const group=$("f18-train");
 if(!group)return;

 const target=group.querySelector(
 ":scope > .f18-content"
 );
 if(!target)return;

 let box=$("forge21-train");

 if(!box){
 box=E("div","",target);
 box.id="forge21-train";

 E("p",
 "Apri la tua scheda e registra l'allenamento.",
 box,"small");

 B(box,"Apri scheda e timer",()=>{
 const launch=$("ftLaunch");

 if(!launch)
 throw Error("Motore allenamento non disponibile.");

 launch.click();
 });

 if(!group.dataset.f21){
 group.dataset.f21="1";

 group.addEventListener("toggle",()=>{
 if(group.open){
 const launch=$("ftLaunch");
 const panel=$("ftPanel");

 if(launch&&panel&&panel.hidden)
 launch.click();
 }
 });
 }
 }

 const live=$("forgeTrainingLive");

 if(live&&live.parentElement!==box){
 box.append(live);
 }

 const panel=$("ftPanel");

 if(panel)
 panel.classList.remove("f18-hidden");

 const content=$("ftContent");

 if(content){
 content.querySelectorAll("p").forEach(p=>{
 if(p.textContent.trim()===
 "Nessun programma disponibile."){
 p.textContent=
 "Non hai ancora una scheda disponibile. "+
 "Crea una scheda oppure attendi "+
 "l'assegnazione del coach.";
 }
 });
 }
}

async function videoPanel(root){

 if(root.dataset.loaded)return;
 root.dataset.loaded="1";

 const me=await auth();

 const admin=role==="admin";

 root.replaceChildren();

 E("h3","Galleria video Forge",root);

 E("p",
 admin?
 "Registra, carica e pubblica le tue esecuzioni.":
 "Guarda le esecuzioni registrate dal coach.",
 root,"small");

 const search=E("input","",root);
 search.placeholder="Cerca esercizio...";
 search.type="search";

 const results=E("div","",root);
 const gallery=E("div","",root);

 let selected=null;
 let uploadBox=null;
 let chosen=null;

 if(admin){

 uploadBox=E("div","",root,"item");

 E("h3","Carica video personale",uploadBox);

 chosen=E("p",
 "Cerca e seleziona un esercizio.",
 uploadBox,"small");

 const title=E("input","",uploadBox);
 title.placeholder="Titolo video";

 const notes=E("textarea","",uploadBox);
 notes.placeholder="Indicazioni tecniche facoltative";

 E("label","Registra con iPhone",uploadBox);

 const camera=E("input","",uploadBox);
 camera.type="file";
 camera.accept="video/*";
 camera.setAttribute("capture","environment");

 E("label","Oppure scegli dalla galleria",uploadBox);

 const file=E("input","",uploadBox);
 file.type="file";
 file.accept="video/*";

 const preview=E("video","",uploadBox);
 preview.controls=true;
 preview.playsInline=true;
 preview.hidden=true;

 let selectedFile=null;
 let previewURL=null;

 const status=E("p","",uploadBox,"small");

 function choose(f){

 if(!f)return;

 if(f.size>52428800){
 selectedFile=null;
 preview.hidden=true;
 status.textContent=
 "Video troppo grande: massimo 50 MB.";
 return;
 }

 if(previewURL)
 URL.revokeObjectURL(previewURL);

 selectedFile=f;
 previewURL=URL.createObjectURL(f);
 preview.src=previewURL;
 preview.hidden=false;

 status.textContent=
 "Video selezionato: "+
 (f.size/1048576).toFixed(1)+" MB";
 }

 camera.onchange=()=>{
 file.value="";
 choose(camera.files[0]);
 };

 file.onchange=()=>{
 camera.value="";
 choose(file.files[0]);
 };

 const publish=E("select","",uploadBox);

 [
 ["false","Salva come bozza"],
 ["true","Pubblica per i clienti"]
 ].forEach(([v,t])=>{
 const o=E("option",t,publish);
 o.value=v;
 });

 B(uploadBox,"Carica video",async()=>{

 if(!selected?.id)
 throw Error("Seleziona prima un esercizio.");

 if(!selectedFile)
 throw Error("Seleziona o registra un video.");

 const name=title.value.trim();

 if(!name)
 throw Error("Inserisci il titolo.");

 const f=selectedFile;

 const types={
 "video/mp4":"mp4",
 "video/quicktime":"mov",
 "video/webm":"webm"
 };

 let mime=f.type;

 if(!mime){
 const ext=f.name.split(".").pop()
 .toLowerCase();

 mime={
 mp4:"video/mp4",
 mov:"video/quicktime",
 webm:"video/webm"
 }[ext];
 }

 if(!types[mime])
 throw Error("Usa un video MP4, MOV o WebM.");

 const id=crypto.randomUUID();

 const path=
 me.id+"/"+selected.id+"/"+
 id+"."+types[mime];

 status.textContent=
 "Caricamento in corso. Non chiudere l'app.";

 const record={
 id:id,
 exercise_id:selected.id,
 title:name,
 description:notes.value.trim()||null,
 source_type:"upload",
 storage_bucket:bucket,
 storage_path:path,
 original_filename:f.name,
 file_size_bytes:f.size,
 mime_type:mime,
 uploaded_by:me.id,
 published:false,
 language_code:"it"
 };

 const insert=await db
 .from("exercise_videos")
 .insert(record);

 if(insert.error){
 status.textContent="Registrazione non riuscita.";
 throw insert.error;
 }

 const uploaded=await db.storage
 .from(bucket)
 .upload(path,f,{
 contentType:mime,
 upsert:false
 });

 if(uploaded.error){

 await db.from("exercise_videos")
 .update({
 archived_at:new Date().toISOString()
 })
 .eq("id",id);

 status.textContent=
 "Caricamento non riuscito.";
 throw uploaded.error;
 }

 if(publish.value==="true"){

 const p=await db
 .from("exercise_videos")
 .update({
 published:true,
 published_at:new Date().toISOString()
 })
 .eq("id",id)
 .select("id");

 if(p.error||!p.data?.length){
 status.textContent=
 "Video caricato come bozza. "+
 "Pubblicazione non riuscita.";
 await loadGallery();
 return;
 }
 }

 status.textContent=
 publish.value==="true"?
 "Video caricato e pubblicato!":
 "Video salvato come bozza!";

 selectedFile=null;
 camera.value="";
 file.value="";
 preview.pause();
 preview.removeAttribute("src");
 preview.load();
 preview.hidden=true;

 if(previewURL){
 URL.revokeObjectURL(previewURL);
 previewURL=null;
 }

 await loadGallery();

 });

 uploadBox.selectExercise=a=>{
 selected=a;

 const name=
 a.exercise_name||a.name||a.title;

 chosen.textContent=
 "Esercizio selezionato: "+name;

 title.value=name;

 uploadBox.scrollIntoView({
 behavior:"smooth",
 block:"start"
 });
 };

 }

 async function loadGallery(){

 gallery.replaceChildren(
 E("h3","Video disponibili")
 );

 let q=db.from("exercise_videos")
 .select(
 "id,exercise_id,title,description,"+
 "storage_path,storage_bucket,"+
 "published,external_url"
 )
 .is("archived_at",null)
 .order("created_at",{ascending:false})
 .limit(500);

 if(!admin)
 q=q.eq("published",true);

 const r=await q;

 if(r.error)throw r.error;

 const term=search.value.trim().toLowerCase();

 const rows=(r.data||[]).filter(v=>
 (!term||v.title.toLowerCase().includes(term))
 &&(v.storage_path||v.external_url)
 );

 if(!rows.length){
 E("p",
 "Nessun video disponibile per questa ricerca.",
 gallery,"small");
 }

 for(const v of rows){

 const card=E("div","",gallery,"item");

 E("strong",v.title,card);

 if(v.description)
 E("p",v.description,card,"small");

 if(admin)
 E("p",
 v.published?"Pubblicato":"Bozza",
 card,"small");

 B(card,"▶ Guarda video",async()=>{

 let url;

 if(v.storage_path&&
 v.storage_bucket===bucket){

 const signed=await db.storage
 .from(bucket)
 .createSignedUrl(v.storage_path,300);

 if(signed.error)throw signed.error;

 url=signed.data.signedUrl;

 }else if(v.external_url){

 const external=new URL(v.external_url);

 if(external.protocol!=="https:")
 throw Error("Link video non valido.");

 window.open(
 external.href,
 "_blank",
 "noopener,noreferrer"
 );

 return;

 }else{
 throw Error("Video non ancora caricato.");
 }

 let player=card.querySelector("video");

 if(!player){
 player=E("video","",card);
 player.controls=true;
 player.playsInline=true;
 player.preload="metadata";
 }

 player.src=url;

 });

 if(admin){

 B(card,
 v.published?
 "Ritira pubblicazione":
 "Pubblica video",
 async()=>{

 const r=await db
 .from("exercise_videos")
 .update({
 published:!v.published,
 published_at:!v.published?
 new Date().toISOString():null
 })
 .eq("id",v.id)
 .select("id");

 if(r.error)throw r.error;

 if(!r.data?.length)
 throw Error("Modifica non autorizzata.");

 await loadGallery();

 },"secondary");

 B(card,"Archivia video",async()=>{

 if(!confirm("Archiviare questo video?"))
 return;

 const r=await db
 .from("exercise_videos")
 .update({
 published:false,
 archived_at:new Date().toISOString()
 })
 .eq("id",v.id)
 .select("id");

 if(r.error)throw r.error;

 if(!r.data?.length)
 throw Error("Archiviazione non autorizzata.");

 await loadGallery();

 },"danger");

 }

 }

 }

 let request=0;

 async function searchExercises(){

 const n=++request;

 results.replaceChildren();

 if(!admin)return;

 const term=search.value.trim();

 if(term.length<2)return;

 const r=await db.rpc(
 "forge_training_v8_search_exercises",{
 p_search:term,
 p_limit:25
 });

 if(n!==request)return;

 if(r.error)throw r.error;

 for(const a of r.data||[]){

 const label=
 a.exercise_name||a.name||a.title;

 if(!a.id||!label)continue;

 B(results,label,()=>{

 uploadBox.selectExercise(a);
 results.replaceChildren();

 },"secondary");

 }

 if(!results.children.length)
 E("p","Nessun esercizio trovato.",
 results,"small");

 }

 B(root,"Cerca e aggiorna",async()=>{

 await searchExercises();
 await loadGallery();

 },"secondary");

 search.onkeydown=e=>{
 if(e.key==="Enter"){
 e.preventDefault();
 Promise.all([
 searchExercises(),
 loadGallery()
 ]).catch(e=>alert(e.message));
 }
 };

 await loadGallery();

}

function mountVideo(){

 const group=$("f18-video");
 const heading=$("sectionTitle");
 const section=$("sectionContent");

 let target=null;

 if(group){

 target=group.querySelector(
 ":scope > .f18-content"
 );

 }else if(heading?.textContent.trim()
 ==="Video esercizi"){

 target=section;

 }

 if(!target)return;

 let box=target.querySelector(
 "#forge21-video"
 );

 if(!box){

 box=E("div","",target);
 box.id="forge21-video";

 B(box,"Apri galleria video",async()=>{
 try{
 await videoPanel(box);
 }catch(e){
 delete box.dataset.loaded;
 throw e;
 }
 });

 }

 Array.from(target.children).forEach(n=>{
 if(n!==box&&!n.hidden)
 n.hidden=true;
 });

}

let queued=false;

function schedule(){

 if(queued)return;
 queued=true;

 requestAnimationFrame(()=>{

 queued=false;

 try{
 mountTraining();
 mountVideo();
 }catch(e){
 console.warn("Forge V21",e);
 }

 });

}

new MutationObserver(schedule)
.observe(document.body,{
 childList:true,
 subtree:true
});

document.addEventListener("click",schedule);

schedule();

console.info("FORGE TRAINING V21 caricato");

})();
</script>

 },

 },

 "f18-pdf":{

 },

 "f18-performance":{

  icon:'<path d="M3 3v18h18M6 16l5-6 4 3 6-8M16 5h5v5"/>'
 },

 "f18-video":{
  description:"Galleria delle esecuzioni",
  icon:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>'
 }

};

const style=document.createElement("style");

style.textContent=Object.entries(items)
.map(([id,item])=>{

 const svg=
 '<svg xmlns="http://www.w3.org/2000/svg" '+
 'viewBox="0 0 24 24" fill="none" '+
 'stroke="#e9c675" stroke-width="1.7" '+
 'stroke-linecap="round" '+
 'stroke-linejoin="round">'+
 item.icon+'</svg>';

 return "#"+id+
 " > summary::before{background-image:url(\""+
 "data:image/svg+xml,"+
 encodeURIComponent(svg)+
 "\")!important;}";

}).join("\n");

document.head.append(style);

function refresh(){

 const menu=document.getElementById(
 "forge18-menu"
 );

 const card=document.getElementById(
 "sectionCard"
 );

 const content=document.getElementById(
 "sectionContent"
 );

 const visible=Boolean(
 menu&&content&&content.contains(menu)
 );

 if(card){
 card.classList.toggle(
 "forge22-active",visible
 );
 }

 if(!visible)return;

 let header=document.getElementById(
 "forge22-header"
 );

 if(!header){

 header=document.createElement("div");
 header.id="forge22-header";

 menu.before(header);

 Object.entries(items).forEach(([id,item])=>{

 ":scope > summary > .f18-subtitle"
 );

 if(subtitle&&
 subtitle.textContent!==item.description){

 subtitle.textContent=item.description;

 }

 });

}

let queued=false;

function schedule(){

 if(queued)return;

 queued=true;

 requestAnimationFrame(()=>{

 queued=false;

 try{

 refresh();

 }catch(error){

 console.warn(
 "Forge Training V22",error
 );

 }

 });

}

new MutationObserver(schedule)
.observe(document.body,{
 childList:true,
 subtree:true
});

document.addEventListener(
 "click",schedule
);

schedule();

console.info(
 "FORGE TRAINING V22 PREMIUM INTERFACE"
);

})();

<script>
(function(){
"use strict";

if(window.forgeV23Installed)return;
window.forgeV23Installed=true;

const previous=section;
const names=[
 "Forge Hydration",
 "Forge Weight",
 "Forge Studio"
];

const dayOf=value=>
 new Intl.DateTimeFormat("en-CA",{
 timeZone:"Europe/Rome",
 year:"numeric",
 month:"2-digit",
 day:"2-digit"
 }).format(new Date(value));

function panel(){
 return el("div","","f23-panel");
}

function details(title){
 const d=el("details");
 d.append(el("summary",title));
 return d;
}

function stat(root,label,value){
 const box=el("div","","stat");
 box.append(
 el("span",label),
 el("strong",value)
 );
 root.append(box);
}

function signed(n){
 return (n>0?"+":"")+fmt(n,2);
}

async function metric(root,kind){

 const water=kind==="water";
 const table=water?
 "forge_water_entries":
 "forge_weight_entries";

 const field=water?
 "amount_ml":"weight_kg";

 const account=user.id;
 const key=(water?
 "forge_water_goal_":
 "forge_goal_")+account;

 const request=serial;

 const alive=()=>
 root.isConnected&&
 serial===request&&
 user?.id===account;

 const main=panel();
 const heading=el("div","MONITORAGGIO PERSONALE","f23-label");
 const hero=el("div","","f23-center");
 const status=el("div","","small");
 const settings=details("⚙ Imposta obiettivo");
 const goal=input("number");

 goal.min=water?"100":"1";
 goal.max=water?"10000":"500";
 goal.step=water?"50":"0.1";
 goal.value=localStorage.getItem(key)||"";

 const stats=el("div","","stats");
 const chartPanel=details("Andamento e statistiche");
 chartPanel.open=true;

 const filters=el("div","","filters");

 const svg=svgNode("svg",{
 viewBox:"0 0 600 260",
 id:"forgeMetricSvg"
 });
 svg.classList.add("chart");

 const tip=el("p","","small");
 tip.id="metricTip";

 const history=details("Storico registrazioni");
 const historyBody=el("div");
 history.append(historyBody);

 let rows=[];
 let currentPeriod="day";
 let busy=false;

 const value=input(
 "number",
 water?"Quantità in ml":"Peso in kg"
 );

 value.min="1";
 value.max=water?"10000":"500";
 value.step=water?"1":"0.1";

 async function action(fn){
 if(busy||!alive())return;
 busy=true;
 status.textContent="Salvataggio...";
 try{
 await fn();
 if(!alive())return;
 await refresh();
 if(alive()){
 status.textContent="Aggiornato correttamente.";
 }
 }catch(e){
 if(alive())status.textContent=friendly(e);
 }finally{
 busy=false;
 }
 }

 async function save(n){
 if(!Number.isFinite(n)||n<=0||
 n>Number(value.max)||
 (water&&!Number.isInteger(n))){
 status.textContent="Inserisci un valore valido.";
 return;
 }
 await action(async()=>{
 const {error}=await db.from(table).insert({
 user_id:account,
 [field]:n,
 recorded_at:new Date().toISOString()
 });
 if(error)throw error;
 value.value="";
 });
 }

 settings.append(
 goal,
 button("Salva obiettivo",()=>{
 const n=Number(goal.value);
 if(!Number.isFinite(n)||
 n<Number(goal.min)||
 n>Number(goal.max)){
 status.textContent="Obiettivo non valido.";
 return;
 }
 localStorage.setItem(key,String(n));
 paint();
 status.textContent="Obiettivo salvato sul dispositivo.";
 }),
 el("p","Obiettivo personale su questo dispositivo.","small")
 );

 main.append(heading,hero,settings);

 if(water){
 const quick=el("div","","f23-quick");
 [250,500,750,1000].forEach(n=>{
 quick.append(button("+"+n+" ml",()=>save(n)));
 });
 main.append(quick);
 }

 const entry=el("div","","f23-row");
 entry.append(
 value,
 button(water?"+":"Registra",()=>{
 save(Number(value.value));
 })
 );

 main.append(entry,status,stats);

 for(const [p,label] of [
 ["entry","Singole"],
 ["day","Giorni"],
 ["week","Settimane"],
 ["month","Mesi"]
 ]){
 const b=button(label,()=>{
 currentPeriod=p;
 paintChart();
 },"secondary");
 b.dataset.f23period=p;
 filters.append(b);
 }

 chartPanel.append(filters,svg,tip);
 main.append(chartPanel,history);

 root.append(main);

 function paintChart(){
 if(!alive())return;
 filters.querySelectorAll("button").forEach(b=>{
 b.classList.toggle(
 "active",
 b.dataset.f23period===currentPeriod
 );
 });
 drawMetric(
 groupMetric(rows,kind,currentPeriod),
 water?"ml":"kg"
 );
 }

 function paint(){
 if(!alive())return;

 hero.replaceChildren();
 stats.replaceChildren();
 historyBody.replaceChildren();

 const target=Number(localStorage.getItem(key)||0);

 if(water){

 const today=dayOf(new Date());

 const total=rows.filter(r=>
 dayOf(r.recorded_at)===today
 ).reduce((s,r)=>s+Number(r[field]),0);

 const percent=target?
 Math.round(total/target*100):0;

 const ring=el("div","","f23-ring");
 ring.style.setProperty(
 "--progress",
 Math.min(100,percent)+"%"
 );

 const inner=el("div","","f23-ring-inner");

 inner.append(
 el("div",fmt(total/1000,2)+" L","f23-number"),
 el("div",target?percent+"%":"Imposta obiettivo","small")
 );

 ring.append(inner);

 hero.append(
 ring,
 el("p",target?
 total>=target?
 "Obiettivo raggiunto!":
 "Mancano "+fmt((target-total)/1000,2)+" L":
 "Imposta il tuo obiettivo giornaliero.")
 );

 stat(stats,"Oggi",fmt(total/1000,2)+" L");
 stat(stats,"Obiettivo",target?fmt(target/1000,2)+" L":"—");

 const days=new Map();

 rows.forEach(r=>{
 const d=dayOf(r.recorded_at);
 days.set(d,(days.get(d)||0)+Number(r[field]));
 });

 const sum=[...days.values()].reduce((a,b)=>a+b,0);

 stat(stats,"Media giorni registrati",
 days.size?fmt(sum/days.size/1000,2)+" L":"—");

 stat(stats,"Giorni al target attuale",
 target?String([...days.values()].filter(n=>n>=target).length):"—");

 }else{

 const latest=rows.length?Number(rows[0][field]):null;

 const first=rows.length?
 Number(rows[rows.length-1][field]):null;

 hero.append(
 el("p","PESO ATTUALE","f23-label"),
 el("div",latest===null?"—":fmt(latest,1)+" kg","f23-number"),
 el("p",latest!==null&&target?
 "Distanza dall'obiettivo: "+
 fmt(Math.abs(latest-target),2)+" kg":
 "Monitora la tua evoluzione.","small")
 );

 stat(stats,"Peso iniziale",first===null?"—":fmt(first,1)+" kg");
 stat(stats,"Obiettivo",target?fmt(target,1)+" kg":"—");
 stat(stats,"Variazione",latest===null?"—":signed(latest-first)+" kg");

 const recent=rows.filter(r=>
 new Date(r.recorded_at).getTime()>=Date.now()-7*86400000
 );

 stat(stats,"Media ultimi 7 giorni",recent.length?
 fmt(recent.reduce((s,r)=>s+Number(r[field]),0)/recent.length,2)+" kg":"—");

 }

 paintChart();

 if(!rows.length){
 historyBody.append(el("p","Nessuna registrazione.","muted"));
 }

 rows.slice(0,50).forEach(r=>{

 const line=el("div","","f23-history");
 const text=el("div");

 text.append(
 el("strong",fmt(r[field],2)+(water?" ml":" kg")),
 el("div",dt(r.recorded_at),"small")
 );

 const edit=button("✎",async()=>{

 const answer=prompt(
 water?"Quantità in ml":"Peso in kg",
 String(r[field])
 );

 if(answer===null)return;

 const n=Number(answer.replace(",","."));

 if(!Number.isFinite(n)||n<=0||
 n>Number(value.max)||
 (water&&!Number.isInteger(n))){
 status.textContent="Valore non valido.";
 return;
 }

 await action(async()=>{
 const {data,error}=await db.from(table)
 .update({[field]:n})
 .eq("id",r.id)
 .eq("user_id",account)
 .select("id");

 if(error)throw error;
 if(!data?.length)throw Error("Modifica non autorizzata.");
 });

 },"secondary");

 const remove=button("×",async()=>{

 if(!confirm("Eliminare questa registrazione?"))return;

 await action(async()=>{
 const {data,error}=await db.from(table)
 .delete()
 .eq("id",r.id)
 .eq("user_id",account)
 .select("id");

 if(error)throw error;
 if(!data?.length)throw Error("Eliminazione non autorizzata.");
 });

 },"secondary");

 line.append(text,edit,remove);
 historyBody.append(line);

 });

 }

 async function refresh(){

 const {data,error}=await db.from(table)
 .select("id,user_id,recorded_at,"+field)
 .eq("user_id",account)
 .order("recorded_at",{ascending:false})
 .limit(1000);

 if(error)throw error;
 if(!alive())return;

 rows=data||[];
 paint();

 }

 try{
 await refresh();
 }catch(e){
 if(alive())status.textContent=friendly(e);
 }

}

async function studio(root){

 const request=serial;
 const account=user.id;
 const box=panel();

 box.append(
 el("div","IL TUO SPAZIO PERSONALE","f23-label"),
 el("h2","Forge Studio"),
 el("p","Gestisci il tuo profilo e accedi ai tuoi strumenti.","muted")
 );

 const profile=panel();

 profile.append(
 el("h3","Il mio account"),
 el("p",user.email||""),
 el("p",role==="admin"?"Coach • Amministratore":"Area personale","small"),
 button("Apri profilo",()=>section("Profilo"),"secondary")
 );

 box.append(profile);

 const tools=panel();
 tools.append(el("h3","I tuoi strumenti"));

 [
 ["Forge Training","Allenamento"],
 ["Forge Nutrition","Forge Nutrition"],
 ["Forge Hydration","Forge Hydration"],
 ["Forge Weight","Forge Weight"],
 ["Progress Evolution","Progress Evolution"],
 ["Forge Premium","Forge Premium"]
 ].forEach(([label,name])=>{
 tools.append(button(label,()=>section(name),"secondary"));
 });

 box.append(tools);

 const config=details("Configurazione Studio");
 const output=el("div");

 config.append(output);
 box.append(config);
 root.append(box);

 output.textContent="Caricamento...";

 try{

 const {data,error}=await db.rpc("forge_st_v1_get_studio");

 if(error)throw error;

 if(serial!==request||user?.id!==account)return;

 output.replaceChildren();

 const allowed={
 theme:"Tema",
 theme_name:"Tema",
 display_name:"Nome visualizzato",
 active:"Attivo",
 status:"Stato",
 title:"Titolo",
 description:"Descrizione"
 };

 function showData(value,depth=0){

 if(!value||typeof value!=="object"||depth>4)return;

 Object.entries(value).forEach(([k,v])=>{

 if(v&&typeof v==="object"){
 showData(v,depth+1);
 }else if(allowed[k]&&v!==null){
 output.append(el("p",
 allowed[k]+": "+
 (typeof v==="boolean"?(v?"Sì":"No"):String(v))
 ));
 }

 });

 }

 showData(data);

 if(!output.children.length){
 output.append(el("p","Nessuna configurazione visualizzabile.","muted"));
 }

 }catch(e){
 if(serial===request&&user?.id===account){
 output.textContent=friendly(e);
 }
 }

}

section=function(name){

 if(!names.includes(name)){
 return previous.apply(this,arguments);
 }

 if(!user)return;

 serial++;
 calendarSerial++;
 active=name;

 $("sectionTitle").textContent=name;
 $("sectionText").textContent="";

 const root=$("sectionContent");
 root.replaceChildren();

 $("sectionCard").classList.remove("hidden");

 document.querySelectorAll("[data-section]").forEach(b=>{
 b.classList.toggle("active",b.dataset.section===name);
 });

 if(name==="Forge Studio"){
 studio(root);
 }else{
 metric(root,name==="Forge Hydration"?"water":"weight");
 }

 $("sectionCard").scrollIntoView({
 behavior:"smooth",
 block:"start"
 });

};

console.info("FORGE V23 ACTIVE");

})();
</script>
