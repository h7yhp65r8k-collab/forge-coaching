<script>
(()=>{
if(window.forgeV51Loaded)return;
window.forgeV51Loaded=true;

const E=(tag,text)=>{
const n=document.createElement(tag);
n.textContent=text||'';
return n;
};

const today=()=>new Intl.DateTimeFormat(
'sv-SE',{timeZone:'Europe/Rome'}
).format(new Date());

function plus(date,days){
const d=new Date(date+'T12:00:00Z');
d.setUTCDate(d.getUTCDate()+Number(days));
return d.toISOString().slice(0,10);
}

function admin(){
return typeof user!=='undefined'&&user&&
typeof role!=='undefined'&&role==='admin'&&
typeof db!=='undefined';
}

async function rpc(name,args){
const {data,error}=await db.rpc(name,args);
if(error)throw error;
return data;
}

function select(options){
const s=E('select');
options.forEach(([v,t])=>{
const o=E('option',t);
o.value=v;
s.append(o);
});
return s;
}

function date(value){
const i=E('input');
i.type='date';
i.value=value;
return i;
}

function field(root,label,input){
root.append(E('label',label),input);
return input;
}

function btn(text,action,gold=false){
const b=E('button',text);
b.type='button';
if(gold)b.className='gold';
b.onclick=async()=>{
b.disabled=true;
try{await action();}
catch(e){alert(e.message||String(e));}
finally{b.disabled=false;}
};
return b;
}

function mount(root){
if(root.querySelector('#forgeV51'))return;

const panel=E('div');
panel.id='forgeV51';

const content=E('div');
content.hidden=true;

const clients=select([
['','Seleziona cliente']
]);

const detail=E('div');
let loaded=false;
let serial=0;
const owner=user.id;

const alive=()=>panel.isConnected&&
admin()&&user.id===owner;

panel.append(
E('h3','FORGE ACCESS CONTROL'),
btn('Gestisci percorsi e scadenze',async()=>{
content.hidden=!content.hidden;
if(!content.hidden&&!loaded)await load();
},true),
content
);

content.append(
clients,
btn('Aggiorna clienti',load),
detail
);

root.prepend(panel);

async function load(){
if(!alive())return;
const {data,error}=await db
.from('profiles')
.select('id,first_name,last_name,full_name,email')
.neq('id',owner)
.limit(1000);

if(error)throw error;
if(!alive())return;

clients.replaceChildren();

const first=E('option','Seleziona cliente');
first.value='';
clients.append(first);

(data||[]).forEach(p=>{
const o=E('option',
[p.first_name,p.last_name]
.filter(Boolean).join(' ')||
p.full_name||p.email||'Cliente'
);
o.value=p.id;
clients.append(o);
});

loaded=true;

if(data?.length===1){
clients.value=data[0].id;
}

await render();
}

clients.onchange=()=>{
render().catch(e=>alert(e.message));
};

async function render(){
const token=++serial;
const id=clients.value;
detail.replaceChildren();

if(!id||!alive())return;

const valid=()=>alive()&&
serial===token&&clients.value===id;

const [access,plans]=await Promise.all([
rpc('forge_v45_access_status',{
p_client_id:id
}),
rpc('forge_v51_client_plans',{
p_client_id:id
})
]);

if(!valid())return;

const labels={
pending:'In attesa di approvazione',
coaching_active:'Coaching attivo',
coaching_expired:'Coaching scaduto',
approved_no_plan:'Approvato senza percorso',
suspended:'Sospeso',
unlimited:'Accesso illimitato',
trial_active:'Prova gratuita attiva',
trial_expired:'Prova terminata'
};

detail.append(E('p',
labels[access.mode]||access.mode
));

const list=Array.isArray(plans)?plans:[];

list.forEach(p=>{
const box=E('div');
box.className='f51box';

const active=p.status==='active'&&
p.starts_on<=today()&&
p.expires_on>today();

const days=E('div',
active?String(p.remaining_days):'0'
);
days.className='f51days';

box.append(
E('h3',p.title),
E('p','Inizio: '+p.starts_on),
E('p','Scadenza: '+p.expires_on),
days,
E('p','Giorni rimanenti')
);

if(p.status==='active'){
const end=field(box,
'Modifica scadenza',
date(p.expires_on)
);

[7,14,30,42].forEach(n=>{
box.append(btn('Proroga +'+n+' giorni',()=>{
end.value=plus(
end.value>today()?end.value:today(),n
);
}));
});

box.append(btn('Salva nuova scadenza',async()=>{
if(!valid())return;
if(!end.value||end.value<=p.starts_on){
throw new Error('Data non valida');
}
if(!confirm('Confermi la nuova scadenza?'))return;

const ok=await rpc(
'forge_v51_update_expiry',{
p_subscription_id:p.id,
p_expires_on:end.value
});

if(!ok)throw new Error('Aggiornamento non riuscito');

alert('Scadenza aggiornata');
await render();
},true));
}

detail.append(box);
});

const form=E('div');
form.className='f51box';

form.append(E('h3','Assegna coaching'));

const type=field(form,'Tipologia',select([
['Coaching online','Coaching online'],
['Coaching in presenza','Coaching in presenza']
]));

const next=list.filter(p=>
p.status==='active'&&p.expires_on>today()
).map(p=>p.expires_on).sort().pop()||today();

const start=field(form,'Data inizio',date(next));

const duration=field(form,'Durata',select([
['7','7 giorni'],
['14','2 settimane'],
['30','30 giorni'],
['42','6 settimane'],
['60','60 giorni'],
['90','90 giorni'],
['180','180 giorni'],
['365','365 giorni'],
['custom','Personalizzata']
]));

duration.value='42';

const end=field(form,'Data scadenza',
date(plus(next,42)));

function calculate(){
if(start.value&&duration.value!=='custom'){
end.value=plus(start.value,duration.value);
}
}

start.onchange=calculate;
duration.onchange=calculate;
end.onchange=()=>duration.value='custom';

form.append(btn(
access.mode==='pending'?
'Approva e attiva coaching':
'Assegna o rinnova coaching',
async()=>{
if(!valid())return;

if(!start.value||!end.value||
end.value<=start.value||
end.value<=today()){
throw new Error('Controlla le date');
}

if(!confirm('Confermi il percorso fino al '+end.value+'?'))return;

await rpc('forge_v51_assign_coaching',{
p_client_id:id,
p_title:type.value,
p_starts_on:start.value,
p_expires_on:end.value
});

alert('Coaching assegnato');
await render();
},true));

detail.append(form);

const trial=E('div');
trial.className='f51box';

trial.append(E('h3','FORGE EXPERIENCE'));

const hours=field(trial,'Durata prova',select([
['24','24 ore'],
['48','48 ore'],
['72','72 ore'],
['168','7 giorni']
]));

hours.value='48';

trial.append(btn('Attiva prova gratuita',async()=>{
if(!valid())return;
if(!confirm('Confermi la prova gratuita?'))return;

await rpc('forge_v41_grant_trial',{
p_client_id:id,
p_hours:Number(hours.value),
p_allow_repeat:false
});

alert('Prova assegnata');
await render();
}));

if(access.mode==='trial_active'){
trial.append(btn('Proroga prova +24 ore',async()=>{
if(!valid())return;
if(!confirm('Aggiungere 24 ore?'))return;

await rpc('forge_v46_extend_trial',{
p_client_id:id,
p_hours:24
});

await render();
}));
}

detail.append(trial);
}
}

function refresh(){
const old=document.getElementById('forgeV51');

if(!admin()){
old?.remove();
return;
}

const root=document.getElementById('sectionContent');
const title=document.getElementById('sectionTitle');

if(!root||!title)return;

const name=title.textContent.trim().toLowerCase();

if(![
'forge clients',
'i miei clienti',
'forge client manager'
].includes(name)){
old?.remove();
return;
}

mount(root);
}

setInterval(refresh,800);
refresh();

console.log('FORGE ACCESS CONTROL V51 ACTIVE');
})();
</script>

 );
 return Number.isNaN(d.getTime())?
 String(v):d.toLocaleDateString('it-IT');

const euro=v=>Number(v||0).toLocaleString(

);

 if(error)throw error;
 return data;

async function mount(card,root){

 if(card.dataset.v52mounted)return;
 card.dataset.v52mounted='1';

 const owner=user.id;
 const email=card.querySelector('p')?
 card.querySelector('p').textContent.trim():'';

 const name=heading?.textContent.trim();

 if(!name||!email)return;

 const panel=E('div');

  try{
   await fn(target);

     generation++;
     output.replaceChildren();
     grid.querySelectorAll('button').forEach(
      b=>b.classList.remove('selected')

   );

   output.scrollIntoView({

   });

     E('h3',title),

     'v52error')

  }
 }

   .forEach(img=>img.remove());

 if(!['i miei clienti','forge clients',
 'forge client manager'].includes(
 title.textContent.trim().toLowerCase()
 ))return;

 .find(b=>b.textContent.includes('Tutti i clienti'));

 .find(x=>x.querySelector('h2'));

 mount(card,root);

 margin-top:10px;
 font-size:13px;
}

 color:#f18b8b;
}

<script>
(function(){
'use strict';

if(window.forgeV55Installed)return;
window.forgeV55Installed=true;

let access=null;
let accountId=null;
let lastFetch=0;
let busy=false;

function node(tag,text,cls){
 const n=document.createElement(tag);
 n.textContent=text||'';
 if(cls)n.className=cls;
 return n;
}

function remove(){
 document.getElementById('forgeV55Status')?.remove();
}

function render(){
 const app=document.getElementById('app');

 if(!app||app.classList.contains('hidden')||
 !user||role==='admin'||!access){
  remove();
  return;
 }

 const welcome=document.getElementById('welcome');
 const anchor=welcome?.closest('.card');

 if(!anchor)return;

 const mode=access.mode;

 if(['admin','pending','suspended'].includes(mode)){
  remove();
  return;
 }

 let panel=document.getElementById('forgeV55Status');

 if(!panel){
  panel=node('div');
  panel.id='forgeV55Status';
  anchor.after(panel);
 }

 const labels={
  coaching_active:'COACHING ATTIVO',
  coaching_expired:'COACHING SCADUTO',
  trial_active:'PROVA GRATUITA',
  trial_expired:'PROVA TERMINATA',
  unlimited:'ACCESSO ILLIMITATO',
  approved_no_plan:'ATTIVA IL TUO PERCORSO'
 };

 panel.replaceChildren(
  node('div',labels[mode]||'FORGE COACHING','f55label')
 );

 const expiry=access.expires_at?
 new Date(access.expires_at):null;

 const seconds=expiry?
 Math.max(0,Math.ceil(
 (expiry.getTime()-Date.now())/1000
 )):null;

 if(seconds!==null&&Number.isFinite(seconds)){

  const days=Math.ceil(seconds/86400);

  const hours=Math.floor(seconds/3600);
  const minutes=Math.floor((seconds%3600)/60);

  const remaining=seconds===0?
  'Scaduto':
  seconds<86400?
  hours+'h '+minutes+'m':
  days+' giorni';

  panel.append(
   node('div',remaining,'f55number'),
   node('div',
    'Accesso fino al '+expiry.toLocaleString(
     'it-IT',{
      timeZone:'Europe/Rome',
      day:'numeric',
      month:'long',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
     }
    ),
    'f55detail'
   )
  );

  if(seconds===0){
   panel.append(node('div',
    'Accesso terminato. Aggiornamento stato in corso.',
    'f55warning'
   ));
  }else if(days<=7){
   const warning=days<=1?
   'Il tuo percorso termina entro 24 ore.':
   days<=3?
   'Il tuo percorso sta per terminare.':
   'Il tuo percorso scade entro 7 giorni.';

   panel.append(node('div',
    warning+' Contatta il coach per il rinnovo.',
    'f55warning'
   ));
  }

 }else if(mode==='unlimited'){

  panel.append(node('div',
   'Illimitato','f55number'
  ));

 }else if(access.renewal_required){

  panel.append(node('div',
   'Non attivo','f55number f55expired'
  ));

  panel.append(node('div',
   'I tuoi dati sono conservati. Puoi riattivare il percorso con il tuo coach.',
   'f55detail'
  ));

 }

 if(access.pt_access){
  panel.append(node('div',
   'Lezioni disponibili: '+access.remaining_sessions,
   'f55detail'
  ));
 }

 if(access.premium_access){
  panel.append(node('div',
   'Forge Premium attivo','f55detail'
  ));
 }

 if(access.modules?.renewal&&
 (access.renewal_required||
 (seconds!==null&&seconds<=604800))){

  const b=node('button',
   'Acquista o rinnova il percorso'
  );

  b.onclick=()=>{
   const shop=document.querySelector(
    '[data-section="Forge Shop"]'
   );

   if(shop)shop.click();
   else section('Forge Shop');
  };

  panel.append(b);
 }

}

async function refresh(force=false){

 if(typeof user==='undefined'||!user||
 role==='admin'){
  access=null;
  accountId=null;
  remove();
  return;
 }

 if(accountId!==user.id){
  access=null;
  accountId=user.id;
  lastFetch=0;
  remove();
 }

 if(busy)return;

 if(!force&&Date.now()-lastFetch<30000){
  render();
  return;
 }

 busy=true;

 const id=user.id;

 try{

  const {data,error}=await db.rpc(
   'forge_v45_access_status',
   {p_client_id:id}
  );

  if(error)throw error;

  if(!user||user.id!==id)return;

  access=data;
  lastFetch=Date.now();
  render();

 }catch(e){

  access=null;
  remove();
  console.warn('FORGE V55:',e.message);

 }finally{
  busy=false;
 }

}

setInterval(()=>refresh(),5000);

document.addEventListener(
 'visibilitychange',()=>{
  if(!document.hidden)refresh(true);
 }
);

window.addEventListener(
 'focus',()=>refresh(true)
);

refresh(true);

console.log('FORGE ACCESS CONTROL V55.2 ACTIVE');

})();
</script>

<script>
(()=>{
'use strict';

if(window.forgeV56Loaded)return;
window.forgeV56Loaded=true;

const cache=new Map();
const pending=new Map();
const mounted=new WeakSet();

const E=(tag,text='',cls='')=>{
 const e=document.createElement(tag);
 e.textContent=text;
 e.className=cls;
 return e;
};

const admin=()=>typeof user!=='undefined'
 &&user
 &&typeof role!=='undefined'
 &&role==='admin'
 &&typeof db!=='undefined';

const today=()=>new Intl.DateTimeFormat(
 'sv-SE',{timeZone:'Europe/Rome'}
).format(new Date());

const days=(a,b)=>Math.round(
 (Date.parse(b)-Date.parse(a))/86400000
);

const fmt=v=>v?
 v.slice(0,10).split('-').reverse().join('/')
 :'—';

const plus=(d,n)=>{
 const x=new Date(d+'T12:00:00Z');
 x.setUTCDate(x.getUTCDate()+n);
 return x.toISOString().slice(0,10);
};

async function rpc(name,args){
 const {data,error}=await db.rpc(name,args);
 if(error)throw error;
 return data;
}

function button(label,fn,cls=''){
 const b=E('button',label,cls);
 b.type='button';
 b.onclick=async()=>{
  b.disabled=true;
  try{await fn();}
  catch(e){alert(e.message||String(e));}
  finally{b.disabled=false;}
 };
 return b;
}

async function load(email,force=false){
 const owner=user.id;
 const key=owner+':'+email;

 if(!force&&cache.has(key)){
  const c=cache.get(key);
  if(Date.now()-c.time<20000)return c;
 }

 if(pending.has(key))return pending.get(key);

 const task=(async()=>{
  const {data,error}=await db.from('profiles')
   .select('id,email')
   .eq('email',email)
   .neq('id',owner)
   .limit(2);

  if(error)throw error;
  if(data?.length!==1)
   throw Error('Profilo non identificato');

  const id=data[0].id;

  const [plans,access]=await Promise.all([
   rpc('forge_v51_client_plans',{
    p_client_id:id
   }),
   rpc('forge_v45_access_status',{
    p_client_id:id
   })
  ]);

  const value={
   id,owner,email,access,
   plans:Array.isArray(plans)?plans:[],
   time:Date.now()
  };

  if(admin()&&user.id===owner)
   cache.set(key,value);

  return value;
 })();

 pending.set(key,task);

 try{return await task;}
 finally{pending.delete(key);}
}

function status(data){
 const t=today();
 const list=data.plans;

 const active=list.filter(p=>
  p.status==='active'&&
  p.starts_on<=t&&p.expires_on>t
 ).sort((a,b)=>
  a.expires_on.localeCompare(b.expires_on)
 )[0];

 if(active){
  const n=days(t,active.expires_on);
  return {
   plan:active,active:true,n,
   title:n<=3?'Scadenza imminente':
    n<=7?'Coaching in scadenza':
    'Coaching attivo',
   color:n<=3?'#ed91b8':
    n<=7?'#e9c675':'#75d69a'
  };
 }

 const future=list.filter(p=>
  p.status==='active'&&p.starts_on>t
 ).sort((a,b)=>
  a.starts_on.localeCompare(b.starts_on)
 )[0];

 if(future)return{
  plan:future,n:days(t,future.expires_on),
  title:'Coaching programmato',
  color:'#e9c675'
 };

 const last=[...list].sort((a,b)=>
  b.expires_on.localeCompare(a.expires_on)
 )[0];

 if(last)return{
  plan:last,n:0,
  title:last.status==='cancelled'?
   'Coaching terminato':'Coaching scaduto',
  color:'#ff7979'
 };

 return{
  plan:null,n:0,
  title:'Nessun coaching assegnato',
  color:'#a4a5ab'
 };
}

function metric(label,value,color){
 const box=E('div','','f56-metric');
 const v=E('strong',value);
 v.style.color=color;
 box.append(E('small',label),v);
 return box;
}

async function dashboard(panel,card,email){

 if(mounted.has(panel))return;
 mounted.add(panel);

 const owner=user.id;
 const alive=()=>admin()&&user.id===owner
  &&panel.isConnected&&card.isConnected;

 const summary=E('div','','f56-summary');

 const expiry=panel.querySelector('.v52expiry');
 if(!expiry){
  mounted.delete(panel);
  return;
 }

 expiry.after(summary);

 const oldManage=[...panel.querySelectorAll('button')]
  .find(b=>b.textContent.trim()==='Gestisci coaching');

 const account=E('details','','f56-account');
 account.append(E('summary','Gestione account'));

 const accountButtons=[...card.querySelectorAll('button')]
  .filter(b=>/^(Sospendi|Rifiuta|Approva|Riattiva|Apri Forge Chat)$/i
   .test(b.textContent.trim()));

 accountButtons.forEach(b=>{
  account.append(button(
   b.textContent.trim(),()=>b.click()
  ));
 });

 panel.append(account);

 async function render(force=false){

  summary.replaceChildren(
   E('div','PERCORSO COACHING','f56-label'),
   E('p','Caricamento...')
  );

  try{

   const data=await load(email,force);
   if(!alive())return;

   const s=status(data);
   const p=s.plan;

   summary.replaceChildren(
    E('div','PERCORSO COACHING','f56-label')
   );

   const title=E('div',s.title,'f56-title');
   title.style.color=s.color;
   summary.append(title);

   if(p){
    summary.append(E('small',p.title||'Coaching'));

    const metrics=E('div','','f56-metrics');

    metrics.append(
     metric('Scadenza',fmt(p.expires_on),s.color),
     metric('Giorni rimanenti',
      String(Math.max(0,s.n)),s.color)
    );

    summary.append(metrics);

    summary.append(E('small',
     'Inizio: '+fmt(p.starts_on)
    ));

    if(s.active){
     const total=Math.max(1,
      days(p.starts_on,p.expires_on));

     const percent=Math.max(0,Math.min(100,
      Math.round((total-s.n)/total*100)));

     const track=E('div','','f56-progress');
     const bar=E('div');
     bar.style.width=percent+'%';
     bar.style.background=s.color;
     track.append(bar);

     summary.append(track,
      E('small',percent+'% del percorso')
     );
    }
   }

   const actions=E('div','','f56-actions');

   if(oldManage){
    actions.append(button(
     p?'Gestisci coaching':'Assegna coaching',
     ()=>oldManage.click(),'v52gold'
    ));
   }

   if(p&&p.status==='active'){

    function editor(proroga){

     summary.querySelector('.f56-editor')?.remove();

     const box=E('div','','f56-editor');

     box.append(E('strong',
      proroga?'Proroga coaching':'Modifica scadenza'
     ));

     const input=E('input');
     input.type='date';
     input.value=p.expires_on;
     box.append(input);

     if(proroga){
      const quick=E('div','','f56-actions');

      [7,14,30,42].forEach(n=>{
       quick.append(button('+'+n+' giorni',()=>{
        input.value=plus(
         p.expires_on>today()?
          p.expires_on:today(),n
        );
       }));
      });

      box.append(quick);
     }

     box.append(button('Salva scadenza',async()=>{

      if(!alive())return;

      if(!input.value||input.value<=p.starts_on)
       throw Error('Data non valida');

      if(!confirm('Nuova scadenza: '+
       fmt(input.value)+'?'))return;

      const ok=await rpc('forge_v51_update_expiry',{
       p_subscription_id:p.id,
       p_expires_on:input.value
      });

      if(!ok)throw Error('Modifica non riuscita');

      await render(true);

     },'v52gold'));

     box.append(button('Annulla',()=>box.remove()));

     summary.append(box);
    }

    actions.append(
     button('Proroga',()=>editor(true)),
     button('Modifica scadenza',()=>editor(false)),
     button('Termina coaching',async()=>{

      if(!alive())return;

      if(!confirm(
       'Terminare questo percorso? I dati saranno conservati.'
      ))return;

      const ok=await rpc(
       'forge_v56_terminate_coaching',{
        p_subscription_id:p.id
       }
      );

      if(!ok)throw Error('Operazione non riuscita');

      await render(true);

     },'f56-danger')
    );
   }

   summary.append(actions);

   summary.append(button(
    'Aggiorna scadenza',()=>render(true)
   ));

   if(oldManage)oldManage.classList.add('f56-hidden');

   card.classList.add('f56-hidden');

  }catch(e){
   if(!alive())return;
   card.classList.remove('f56-hidden');
   oldManage?.classList.remove('f56-hidden');

   summary.replaceChildren(
    E('p','Dati non disponibili: '+e.message),
    button('Riprova',()=>render(true))
   );
  }
 }

 await render();
}

async function listStatus(row){

 const info=row.querySelector('.f30-info');
 if(!info)return;

 const email=[...info.querySelectorAll('small')]
  .map(e=>e.textContent.trim())
  .find(t=>t.includes('@'));

 if(!email)return;

 let label=info.querySelector('.f56-list-status');

 if(!label){
  label=E('small','Verifica coaching...',
   'f56-list-status');
  info.append(label);
 }

 if(label.dataset.loading==='1')return;

 if(Date.now()-Number(label.dataset.updated||0)
  <20000)return;

 label.dataset.loading='1';

 const owner=user.id;

 try{
  const data=await load(email);
  if(!admin()||user.id!==owner||!row.isConnected)return;

  const s=status(data);

  label.style.color=s.color;

  label.textContent=s.plan?
   s.title+' · '+fmt(s.plan.expires_on)+
   ' · '+Math.max(0,s.n)+' gg':
   s.title;

 }catch(e){
  label.textContent='Scadenza non disponibile';
  label.style.color='#a4a5ab';
 }finally{
  label.dataset.loading='0';
  label.dataset.updated=String(Date.now());
 }
}

function refresh(){

 if(!admin()){
  cache.clear();
  return;
 }

 const root=document.getElementById('sectionContent');
 const title=document.getElementById('sectionTitle');
 const section=document.getElementById('sectionCard');

 if(!root||!title||!section||
 section.classList.contains('hidden'))return;

 if(!/^(forge clients|i miei clienti|forge client manager)$/i
 .test(title.textContent.trim()))return;

 const panel=root.querySelector('#forgeV52');

 if(panel&&panel.querySelector('.v52grid')){

  const card=panel.previousElementSibling;

  if(card&&card.classList.contains('f30-panel')){
   const email=card.querySelector('p')
    ?.textContent.trim();

   if(email&&email.includes('@'))
    dashboard(panel,card,email);
  }

 }else{

  root.querySelectorAll('.f30-client')
   .forEach(row=>listStatus(row));

 }
}

setInterval(refresh,1000);
refresh();

console.log('FORGE CLIENTS V56 SMART DASHBOARD ACTIVE');

})();
</script>

<script>
(function(){
'use strict';

if(window.FORGE_CHECK_V57)return;
window.FORGE_CHECK_V57=true;

const mounted=new WeakSet();
const cache=new Map();

const gold='#e9c675';
const pink='#ed91b8';
const green='#75d69a';
const red='#ff7979';
const gray='#a4a5ab';

function admin(){
 return typeof user!=='undefined'&&
 user&&role==='admin';
}

function E(tag,text='',cls=''){
 const n=document.createElement(tag);
 n.textContent=text;
 if(cls)n.className=cls;
 return n;
}

function btn(text,fn,cls='secondary'){
 const b=E('button',text,cls);
 b.type='button';
 b.onclick=async()=>{
  b.disabled=true;
  try{await fn();}
  catch(e){alert(e.message||String(e));}
  finally{b.disabled=false;}
 };
 return b;
}

function dateFormat(d){
 if(!d)return 'Non programmato';
 return new Date(d+'T12:00:00')
 .toLocaleDateString('it-IT',{
  day:'numeric',
  month:'long',
  year:'numeric'
 });
}

function status(s){
 if(!s)return{
  text:'Check da configurare',color:gray
 };
 if(!s.enabled)return{
  text:'Check disattivato',color:gray
 };
 if(s.days_remaining==null)return{
  text:'Data da programmare',color:gray
 };

 const n=Number(s.days_remaining);

 if(n<0)return{
  text:'Check scaduto da '+Math.abs(n)+' gg',
  color:red
 };
 if(n===0)return{
  text:'Check previsto oggi',color:pink
 };
 if(n<=3)return{
  text:'Check tra '+n+' gg',color:pink
 };
 return{
  text:'Check tra '+n+' gg',color:green
 };
}

async function load(email,force=false){
 const owner=user.id;
 const key=owner+':'+email;
 const old=cache.get(key);

 if(!force&&old&&
 Date.now()-old.time<30000)return old;

 const {data:p,error:pe}=await db
 .from('profiles')
 .select('id,email')
 .eq('email',email)
 .neq('id',owner)
 .limit(2);

 if(pe)throw pe;
 if(p?.length!==1)
 throw Error('Profilo non identificato');

 const id=p[0].id;

 const [settings,due]=await Promise.all([
  db.from('forge_fb_v1_settings')
   .select('*')
   .eq('client_id',id)
   .maybeSingle(),

  db.from('forge_fb_v1_due_checks')
   .select('*')
   .eq('client_id',id)
   .maybeSingle()
 ]);

 if(settings.error)throw settings.error;
 if(due.error)throw due.error;

 const value={
  id,
  settings:settings.data,
  due:due.data,
  time:Date.now()
 };

 if(admin()&&user.id===owner)
 cache.set(key,value);

 return value;
}

function metric(label,value){
 const n=E('div','','f57-metric');
 n.append(
  E('small',label),
  E('strong',value)
 );
 return n;
}

function field(label,type,value){
 const box=E('div');
 const i=E('input');
 i.type=type;
 i.value=value??'';
 box.append(E('label',label),i);
 return {box,i};
}

function checkField(label,value){
 const box=E('label');
 box.style.display='flex';
 box.style.alignItems='center';
 box.style.gap='9px';

 const i=E('input');
 i.type='checkbox';
 i.checked=Boolean(value);
 i.style.width='18px';
 i.style.accentColor=gold;

 box.append(i,E('span',label));
 return {box,i};
}

async function dashboard(panel,email){

 if(mounted.has(panel))return;

 const anchor=panel.querySelector('.f56-summary')
 ||panel.querySelector('.v52expiry');

 if(!anchor)return;

 mounted.add(panel);

 const owner=user.id;
 const alive=()=>admin()&&
 user.id===owner&&panel.isConnected;

 const root=E('div','','f57-panel');
 anchor.after(root);

   E('div','FORGE CHECK V57','f57-title'),

  );

   if(!alive())return;

   const cfg=data.settings;
   const due=data.due;
   const st=status(due||cfg);

   root.replaceChildren(
    E('div','FORGE CHECK','f57-title'),
    E('small','PROSSIMO CHECK')
   );

   const date=E('div',
    cfg?.enabled?
    dateFormat(due?.next_check_date):
    'Non programmato',
    'f57-date'
   );

   date.style.color=st.color;

   const state=E('strong',st.text);
   state.style.color=st.color;

   root.append(date,state);

   const grid=E('div','','f57-grid');

   grid.append(
    metric('Frequenza',
     cfg?'Ogni '+cfg.frequency_days+' gg':'—'),
    metric('Orario',
     cfg?.preferred_time?.slice(0,5)||'—'),
    metric('Ultimo check',
     due?.last_check_date?
     dateFormat(due.last_check_date):'Nessuno'),
    metric('Promemoria',
     cfg?cfg.reminder_enabled?'Attivi':'Disattivati':'—')
   );

   root.append(grid);

   const details=E('details');
   details.append(
    E('summary','Modifica impostazioni check')
   );

   const enabled=checkField(
    'Check periodici attivi',
    cfg?.enabled??true
   );

   const frequency=field(
    'Frequenza in giorni','number',
    cfg?.frequency_days??7
   );

   frequency.i.min='1';
   frequency.i.step='1';

   const quick=E('div','','f57-grid');

   [7,14,21,30].forEach(n=>{
    quick.append(btn(n+' giorni',()=>{
     frequency.i.value=n;
    }));
   });

   const weekday=E('select');

   [
    ['', 'Qualsiasi giorno'],
    ['1','Lunedì'],
    ['2','Martedì'],
    ['3','Mercoledì'],
    ['4','Giovedì'],
    ['5','Venerdì'],
    ['6','Sabato'],
    ['0','Domenica']
   ].forEach(([v,t])=>{
    const o=E('option',t);
    o.value=v;
    weekday.append(o);
   });

   weekday.value=cfg?.preferred_weekday==null?
    '':String(cfg.preferred_weekday);

   const time=field(
    'Orario preferito','time',
    cfg?.preferred_time?.slice(0,5)||'18:00'
   );

   const first=field(
    'Data primo check','date',
    cfg?.first_check_date||todayRome()
   );

   const reminder=checkField(
    'Abilita promemoria',
    cfg?.reminder_enabled??true
   );

   details.append(
    enabled.box,
    frequency.box,
    quick,
    E('label','Giorno preferito'),

    time.box,
    first.box,
    reminder.box
   );

   details.append(btn(

    async()=>{

     if(!alive())return;

     const n=Number(frequency.i.value);

     if(!Number.isInteger(n)||n<1)
      throw Error('Frequenza non valida');

     const {data:ok,error}=await db.rpc(
      'forge_fb_v1_configure_client',{
       p_client_id:data.id,

     await render(true);

   root.append(details);

   history.ontoggle=async()=>{

    output.replaceChildren(

    try{

      .from('forge_fb_v1_history')
      .select('*')
      .eq('client_id',data.id)
      .neq('status','archived')
      .order('check_date',{ascending:false})

     for(const r of rows){

      const item=E('details','','f57-history');

      item.append(E('summary',
       dateFormat(r.check_date)
      ));

      const labels={
       submitted:'Inviato',
       pending:'In attesa',
       reviewed:'Revisionato',
       answered:'Risposto'
      };

      item.append(E('p',
       'Stato: '+(labels[r.status]||r.status)
      ));

      const stats=E('div','','f57-grid');

      [
       ['Benessere',r.wellness_score],
       ['Aderenza',r.adherence_score],
       ['Energia',r.energy_score],
       ['Sonno',r.sleep_score],
       ['Stress',r.stress_score],
       ['Recupero',r.recovery_score],
       ['Motivazione',r.motivation_score],
       ['Peso',r.weight_kg==null?

<script>
(function(){
'use strict';

if(window.FORGE_MENU_FIX_V64)return;
window.FORGE_MENU_FIX_V64=true;

let owner='';
let permissions=null;
let lastLoad=0;
let busy=false;

const modules={
 'allenamento':'training',
 'forge training':'training',
 'forge performance':'training',
 'forge nutrition':'nutrition',
 'forge hydration':'hydration',
 'forge weight':'weight',
 'progress evolution':'progress',
 'prenotazioni':'calendar',
 'forge calendar':'calendar',
 'video esercizi':'videos',
 'forge premium':'premium',
 'forge studio':'studio',
 'forge chat':'chat',
 'feedback':'feedback',
 'pacchetti lezioni':'packages',
 'forge shop':'shop',
 'profilo':'profile'
};

function paint(){

 const nav=document.getElementById('mainNav');
 if(!nav||!user)return;

 const admin=role==='admin';

 nav.querySelectorAll('button').forEach(b=>{

  const name=String(
   b.dataset.section||b.textContent||''
  ).trim().toLowerCase();

  const adminOnly=
   b.id==='forgeV30Clients'||
   b.id==='f50AdminButton'||
   [
    'i miei clienti',
    'forge clients',
    'forge client manager',
    'gestione accessi'
   ].includes(name);

  const key=modules[name];

  if(!admin&&!adminOnly&&
     (!key||!permissions||
      typeof permissions[key]!=='boolean')){
   b.removeAttribute('data-f64-visible');
   return;
  }

  const allowed=admin||
   (!adminOnly&&permissions?.[key]===true);

  b.dataset.f64Visible=allowed?'1':'0';

  if(allowed){
   b.removeAttribute('data-f58-hide');
   b.classList.remove('hidden');

   if(admin){
    b.classList.remove('f50-locked');
    delete b.dataset.f50Locked;
    b.removeAttribute('aria-disabled');
   }

 });

async function refresh(force=false){

 if(typeof user==='undefined'||!user||
 document.getElementById('app')?.classList.contains('hidden')){

  owner='';
  permissions=null;
  lastLoad=0;

  document.querySelectorAll('[data-f64-visible]')
   .forEach(b=>b.removeAttribute('data-f64-visible'));

  return;
 }

 if(owner!==user.id){
  owner=user.id;
  permissions=null;
  lastLoad=0;
 }

 if(role==='admin'){
  paint();
  return;
 }

 if(busy)return;

 if(!force&&Date.now()-lastLoad<15000){
  paint();
  return;
 }

 busy=true;
 const id=user.id;

 try{

  const results=await Promise.all(
   [...new Set(Object.values(modules))]
   .map(async key=>{

    const r=await db.rpc(
     'forge_v47_can_access',
     {p_module:key}
    );

    if(r.error)throw r.error;

    return [key,r.data===true];

   })
  );

  if(!user||user.id!==id)return;

  permissions=Object.fromEntries(results);
  lastLoad=Date.now();

  paint();

 }catch(e){
  console.warn('Forge Menu V64:',e.message);
 }finally{
  busy=false;
 }
}

setInterval(()=>refresh(),1500);

window.addEventListener('focus',()=>{
 refresh(true);
});

 if(!document.hidden)refresh(true);
});

})();

<script>
(function(){

if(window.FORGE_PROGRESS_V67)return;

 n.className=cls;
 return n;
};

const names={
 front:'Fronte',
 back:'Retro',
 left:'Lato sinistro',
 right:'Lato destro'
};

const pose=p=>String(
 p.photo_angle||p.pose||p.angle||'Foto'
).toLowerCase();

const label=p=>names[pose(p)]||pose(p);

const date=d=>new Date(
 String(d).slice(0,10)+'T12:00:00'
).toLocaleDateString('it-IT');

const admin=()=>
 typeof user!=='undefined'&&
 user&&
 typeof role!=='undefined'&&
 role==='admin';

function button(text,fn){
 const b=E('button',text,'secondary');
 b.type='button';
 b.onclick=fn;
 return b;
}

async function result(q){
 const {data,error}=await q;
 if(error)throw error;
 return data;
}

function zoom(src,title){

 const modal=E('dialog','','f67modal');
 const img=E('img');

 img.src=src;
 img.alt=title;
 img.style.cssText=
 'width:100%;max-height:78vh;object-fit:contain';

 modal.append(
 button('✕ Chiudi',()=>modal.close()),
 E('h3',title),
 img
 );

 modal.addEventListener('close',()=>{
  modal.remove();
 },{once:true});

 document.body.append(modal);
 modal.showModal();
}

async function photo(p,cell,alive){

 const status=E('p','Caricamento...','small');

 cell.append(
 E('strong',label(p)),
 status
 );

 try{

  const bucket=p.bucket_name||
  'forge-progress-private';

  if(![
   'forge-progress-private',
   'forge-pe-v1-private'
  ].includes(bucket)){
   throw Error('Archivio non disponibile');
  }

  const data=await result(
   db.storage.from(bucket)
   .createSignedUrl(p.storage_path,900)
  );

  if(!alive()||!cell.isConnected)return;

  const img=E('img','','f67photo');

  img.alt=label(p);
  img.loading='lazy';
  img.decoding='async';

  img.onload=()=>status.remove();

  img.onerror=()=>{
   status.textContent='Foto non disponibile';
   img.remove();
  };

  img.onclick=()=>zoom(
   img.src,
   label(p)+' • '+date(p.photo_date)
  );

  img.src=data.signedUrl;
  cell.append(img);

 }catch(e){
  status.textContent=e.message;
 }
}

async function openGallery(panel,tile){

 if(!admin())return;

 const owner=user.id;
 const card=panel.previousElementSibling;
 const email=card?.querySelector('p')
 ?.textContent.trim();

 const output=panel.querySelector('.v52output');

 if(!output||!email)return;

 const host=E('div');
 host.id='forgeV67Gallery';

 const alive=()=>admin()&&
 user.id===owner&&
 host.isConnected&&
 panel.isConnected&&
 !document.getElementById('sectionCard')
 ?.classList.contains('hidden');

 panel.querySelectorAll('.v52tile')
 .forEach(b=>b.classList.remove('selected'));

 tile.classList.add('selected');

 output.replaceChildren(
 E('h3','📸 Archivio check'),
 button('Chiudi dettaglio',()=>{
  output.replaceChildren();
  tile.classList.remove('selected');
 }),
 host
 );

 host.append(
 E('p','Caricamento archivio...','small')
 );

 try{

  const profiles=await result(
   db.from('profiles')
   .select('id')
   .eq('email',email)
   .neq('id',owner)
   .limit(2)
  );

  if(!alive())return;

  if(profiles.length!==1){
   throw Error('Cliente non identificato');
  }

  const photos=[];

  for(let offset=0;;offset+=200){

   const rows=await result(
    db.from('progress_photos')
    .select('*')
    .eq('client_id',profiles[0].id)
    .eq('archived',false)
    .order('photo_date',{ascending:false})
    .order('id')
    .range(offset,offset+199)
   );

   if(!alive())return;

   photos.push(...(rows||[]));

   if(!rows||rows.length<200)break;
  }

  host.replaceChildren();

  if(!photos.length){
   host.append(
    E('p','Nessuna foto disponibile','small')
   );
   return;
  }

  const groups=new Map();

  for(const p of photos){

   const day=String(p.photo_date)
   .slice(0,10);

   if(!groups.has(day)){
    groups.set(day,[]);
   }

   groups.get(day).push(p);
  }

  host.append(
   E('p',
   groups.size+' check • '+
   photos.length+' fotografie',
   'small')
  );

  const compare=E('div');
  host.append(compare);

  function comparison(p,day){

   compare.className='f67compare';

   compare.replaceChildren(
    E('h3','Confronto '+label(p)),
    button('Chiudi confronto',()=>{
     compare.replaceChildren();
     compare.className='';
    }),
    E('p','Seleziona da 2 a 5 date','small')
   );

   const picks=[];

   for(const [d,items] of groups){

    const match=d===day?p:
    items.find(x=>pose(x)===pose(p));

    if(!match)continue;

    const row=E('label');
    const cb=E('input');

    cb.type='checkbox';
    cb.checked=d===day;

    row.append(
     cb,
     document.createTextNode(date(d))
    );

    compare.append(row);
    picks.push({cb,d,match});
   }

   const grid=E('div','','f67grid');

   compare.append(
    button('Confronta fotografie',async()=>{

     const chosen=picks
     .filter(x=>x.cb.checked)
     .sort((a,b)=>a.d.localeCompare(b.d));

     if(chosen.length<2||
        chosen.length>5){
      alert('Seleziona da 2 a 5 date');
      return;
     }

     grid.replaceChildren();

     await Promise.all(
      chosen.map(async x=>{

       const cell=E('div','','f67cell');

       cell.append(E('h3',date(x.d)));
       grid.append(cell);

       await photo(x.match,cell,alive);
      })
     );

    }),
    grid
   );

   compare.scrollIntoView({
    behavior:'smooth',
    block:'start'
   });
  }

  for(const [day,items] of groups){

   const folder=E('details','','f67folder');

   const summary=E(
    'summary',
    '📁 Check del '+date(day)+
    ' • '+items.length+' foto'
   );

   const grid=E('div','','f67grid');

   folder.append(summary,grid);
   host.append(folder);

   folder.ontoggle=async()=>{

    if(!folder.open||!alive())return;

    grid.replaceChildren();

    await Promise.all(
     items.map(async p=>{

      const cell=E('div','','f67cell');

      grid.append(cell);

      cell.append(
       button('Confronta posa',()=>{
        comparison(p,day);
       })
      );

      await photo(p,cell,alive);
     })
    );
   };
  }

  output.scrollIntoView({
   behavior:'smooth',
   block:'nearest'
  });

 }catch(e){

  if(alive()){
   host.replaceChildren(
    E('p',e.message,'status error')
   );
  }
 }
}

 .slice(0,10);

 return /^\d{4}-\d{2}-\d{2}$/.test(d)
 ?d.split('-').reverse().join('/')
 :'Data non disponibile';

function pose(p){
 const v=String(
 p.photo_angle||
 p.photo_type||
 p.pose||
 p.angle||
 'unknown'
 ).trim().toLowerCase();

 const aliases={
 front:'front',
 frontale:'front',

 back:'back',
 rear:'back',
 retro:'back',
 posteriore:'back',
 left:'left',
 left_side:'left',
 side_left:'left',

 'lato sinistro':'left',
 right:'right',
 right_side:'right',
 side_right:'right',
 destra:'right',
 destro:'right',
 'lato destro':'right'
 };

 return aliases[v]||v;
}

function poseLabel(p){
 return ({
 front:'Frontale',
 back:'Posteriore',
 left:'Lato sinistro',
 right:'Lato destro',

 })[pose(p)]||pose(p);

 );

 }

 );

 await renderPhoto(x.match,cell,alive);

 );

 );

 });

 cell,

 );

 !cell.isConnected||
 run!==request)return;

 cell.append(

 compare(p,d);
 })
 );

 });

 }catch(e){
