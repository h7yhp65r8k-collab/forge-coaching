 color:#ffaaaa;
}
#fp24 .fp-count{
 font-size:34px;
 font-weight:850;
 color:var(--fg);
}
#fp24 input[type=file]{
 padding:12px 5px;
 font-size:13px;
}
#fp24 button{
 min-height:44px;
}
</style>

<script>
(function(){
"use strict";

if(window.__forgeProgress24)return;
window.__forgeProgress24=true;

const previous=section;
const bucket="forge-progress-private";

const fields=[
 ["weight","Peso corporeo","kg","Al mattino, a digiuno, nelle stesse condizioni."],
 ["body_fat","Massa grassa","%","Utilizza sempre lo stesso metodo di rilevazione."],
 ["height_cm","Altezza","cm","In piedi, senza scarpe."],
 ["neck_cm","Collo","cm","Appena sotto la laringe."],
 ["shoulders_cm","Spalle","cm","Attorno alla parte più larga delle spalle."],
 ["chest","Torace","cm","All'altezza del petto, senza gonfiare il torace."],
 ["waist","Vita","cm","Tra ultima costola e cresta iliaca."],
 ["abdomen_cm","Addome","cm","All'altezza dell'ombelico."],
 ["hips","Fianchi","cm","Nel punto più largo dei glutei."],
 ["left_arm_cm","Braccio sinistro rilassato","cm","A metà tra spalla e gomito."],
 ["right_arm_cm","Braccio destro rilassato","cm","A metà tra spalla e gomito."],
 ["left_arm_flexed_cm","Braccio sinistro contratto","cm","Nel punto di massima circonferenza."],
 ["right_arm_flexed_cm","Braccio destro contratto","cm","Nel punto di massima circonferenza."],
 ["left_forearm_cm","Avambraccio sinistro","cm","Nel punto più largo."],
 ["right_forearm_cm","Avambraccio destro","cm","Nel punto più largo."],
 ["left_thigh_cm","Coscia sinistra","cm","A metà tra inguine e ginocchio."],
 ["right_thigh_cm","Coscia destra","cm","A metà tra inguine e ginocchio."],
 ["left_calf_cm","Polpaccio sinistro","cm","Nel punto più largo."],
 ["right_calf_cm","Polpaccio destro","cm","Nel punto più largo."]
];

const angles=[
 ["front","Frontale"],
 ["back","Posteriore"],
 ["left","Laterale sinistra"],
 ["right","Laterale destra"],
 ["other","Altra posa"]
];

function node(tag,text="",cls=""){
 const e=document.createElement(tag);
 e.textContent=text;
 e.className=cls;
 return e;
}

function btn(text,fn,secondary=false){
 const b=node("button",text,secondary?"secondary":"");
 b.type="button";
 b.onclick=fn;
 return b;
}

function panel(){
 return node("div","","fp-panel");
}

function details(title,open=false){
 const d=node("details");
 d.open=open;
 d.append(node("summary",title));
 return d;
}

function field(type,placeholder=""){
 const e=node("input");
 e.type=type;
 e.placeholder=placeholder;
 return e;
}

function select(options){
 const s=node("select");
 options.forEach(([value,label])=>{
  const o=node("option",label);
  o.value=value;
  s.append(o);
 });
 return s;
}

function day(value){
 if(!value)return "";
 if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Europe/Rome",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).format(new Date(value));
}

function labelDate(value){
 if(!value)return "—";
 return new Date(day(value)+"T12:00:00")
 .toLocaleDateString("it-IT");
}

function number(value){
 if(value===null||value===undefined||value==="")return "—";
 return Number(value).toLocaleString("it-IT",{
  maximumFractionDigits:2
 });
}

function stat(label,value){
 const box=node("div","","fp-stat");
 box.append(node("span",label),node("strong",value));
 return box;
}

function status(root,text,error=false){
 root.textContent=text;
 root.className="status "+(error?"error":"success");
}

async function result(request){
 const {data,error}=await request;
 if(error)throw error;
 return data;
}

async function rpc(name,params={}){
 return result(db.rpc(name,params));
}

function valueOf(row,key){
 return row&&row[key]!==null&&row[key]!==undefined
 ?row[key]:null;
}

async function render(root){

 const account=user.id;
 const request=serial;
 const admin=role==="admin";

 let client=account;
 let generation=0;

 const shell=node("div");
 shell.id="fp24";

 const content=node("div");

 shell.append(
  node("div","FORGE PROGRESS","fp-title"),
  node("div","CHECK • EVOLUTION • TRANSFORMATION","fp-sub")
 );

 root.replaceChildren(shell);

 function valid(){
  return shell.isConnected&&
   user?.id===account&&
   serial===request;
 }

 if(admin){

  const coach=panel();
  coach.append(node("h3","Area coach"));

  const clients=select([[account,"I miei progressi"]]);

  coach.append(clients);
  shell.append(coach);

  clients.onchange=()=>{
   client=clients.value;
   load();
  };

  try{
   const profiles=await result(
    db.from("profiles").select("*").limit(1000)
   );

   if(!valid())return;

   (profiles||[]).forEach(p=>{
    const id=p.user_id||p.id;
    if(!id||id===account)return;

    const name=p.full_name||
     p.display_name||
     [p.first_name,p.last_name].filter(Boolean).join(" ")||
     p.email;

    if(!name)return;

    const o=node("option",name);
    o.value=id;
    clients.append(o);
   });

  }catch(e){
   coach.append(node("p","Elenco clienti: "+e.message,"small"));
  }

 }

 if(!valid())return;

 shell.append(content);

 async function load(){

  const current=++generation;
  const target=client;

  const alive=()=>valid()&&
   generation===current&&client===target;

  content.replaceChildren(
   node("p","Caricamento progressi...","muted")
  );

  try{

   const [dashboard,measurements,photos,checks]=
   await Promise.all([

    rpc("forge_progress_v4_dashboard",{
     p_client_id:target
    }),

    result(
     db.from("body_measurements")
     .select("*")
     .eq("client_id",target)
     .order("recorded_at",{ascending:false})
     .limit(1000)
    ),

    result(
     db.from("progress_photos")
     .select("*")
     .eq("client_id",target)
     .eq("archived",false)
     .order("photo_date",{ascending:false})
     .order("created_at",{ascending:false})
     .limit(1000)
    ),

    result(
     db.from("forge_client_checkins")
     .select("*")
     .eq("client_id",target)
     .order("checkin_date",{ascending:false})
     .limit(1000)
    )

   ]);

   if(!alive())return;

   content.replaceChildren();

   const latest=measurements[0]||{};
   const first=measurements[measurements.length-1]||{};

   const overview=panel();
   overview.append(node("h3","La tua evoluzione"));

   const grid=node("div","","fp-grid");

   const delta=latest.weight!=null&&first.weight!=null
    ?Number(latest.weight)-Number(first.weight):null;

   grid.append(
    stat("Peso attuale",latest.weight!=null
     ?number(latest.weight)+" kg":"—"),
    stat("Variazione peso",delta!==null
     ?(delta>0?"+":"")+number(delta)+" kg":"—"),
    stat("Ultima vita",latest.waist!=null
     ?number(latest.waist)+" cm":"—"),
    stat("Check registrati",String(checks.length))
   );

   overview.append(grid);
   content.append(overview);

   /* PROMEMORIA CHECK */

   const reminder=dashboard?.reminder||{};
   const reminderBox=panel();

   reminderBox.append(node("h3","Prossimo check"));

   if(reminder.next_check){

    const days=Number(reminder.days_remaining);

    reminderBox.append(
     node("div",days<0
      ?Math.abs(days)+" giorni di ritardo"
      :days===0?"Oggi":days+" giorni","fp-count"),

     node("p","Data prevista: "+
      labelDate(reminder.next_check),"small")
    );

    if(days<=3){
     reminderBox.append(
      node("div",days<0
       ?"Il check è scaduto."
       :days===0
        ?"È il momento del tuo check."
        :"Il prossimo check si avvicina.",
       "fp-alert"+(days<0?" fp-overdue":""))
     );
    }

   }else{
    reminderBox.append(
     node("p","Registra le prime misure per avviare il conto alla rovescia.")
    );
   }

   content.append(reminderBox);

   /* NUOVO CHECK */

   if(target===account||admin){

    const form=details("＋ Registra misure corporee");

    const intro=node("p",
     "Compila soltanto le misure disponibili. Le altre possono restare vuote.",
     "small"
    );

    form.append(intro);

    const inputs={};
    const formGrid=node("div","","fp-grid");

    fields.forEach(([key,title,unit,guide])=>{

     const wrap=node("div");
     const label=node("label",title+" ("+unit+")");
     const inp=field("number",unit);

     inp.min="0.1";
     inp.max=key==="body_fat"?"99.9":"500";
     inp.step="0.1";
     inp.inputMode="decimal";

     inputs[key]=inp;

     wrap.append(label,inp);
     formGrid.append(wrap);

    });

    form.append(formGrid);

    const method=field("text","Metodo di rilevazione");
    const notes=node("textarea");
    notes.placeholder="Note sulle misurazioni";

    const message=node("div");

    const save=btn("Salva misurazioni",async()=>{

     if(!alive())return;

     const data={};

     for(const [key,inp] of Object.entries(inputs)){

      if(inp.value==="")continue;

      const n=Number(inp.value);

      if(!Number.isFinite(n)||n<=0||
       n>500||(key==="body_fat"&&n>=100)){
       status(message,"Controlla i valori inseriti.",true);
       return;
      }

      data[key]=n;

     }

     if(!Object.keys(data).length){
      status(message,"Inserisci almeno una misura.",true);
      return;
     }

     if(method.value.trim())
      data.measurement_method=method.value.trim();

     if(notes.value.trim())
      data.measurement_notes=notes.value.trim();

     save.disabled=true;

     try{

      await rpc("forge_progress_v4_save_measurement",{
       p_data:data,
       p_client_id:target
      });

      if(!alive())return;

      Object.values(inputs).forEach(i=>i.value="");

      alert("Misurazioni salvate.");
      await load();

     }catch(e){
      status(message,e.message,true);
     }finally{
      save.disabled=false;
     }

    });

    form.append(method,notes,save,message);
    content.append(form);

   }

   /* GUIDA ALLE MISURAZIONI */

   const guide=details("Guida alle misurazioni");

   guide.append(node("p",
    "Utilizza un metro morbido, senza comprimere la pelle. Mantieni sempre gli stessi punti di riferimento.",
    "small"
   ));

   fields.forEach(([key,title,unit,text])=>{
    guide.append(
     node("strong",title),
     node("p",text,"fp-guide")
    );
   });

   content.append(guide);

   /* FEEDBACK CHECK */

   if(target===account){

    const checkForm=details("＋ Compila check periodico");

    const checkDate=field("date");
    checkDate.value=todayRome();
    checkDate.max=todayRome();

    checkForm.append(node("label","Data check"),checkDate);

    const checkFields=[
     ["body_weight_kg","Peso corporeo (kg)",500,0.1],
     ["sleep_hours","Ore di sonno",24,0.5],
     ["energy_score","Energia (1–10)",10,1],
     ["adherence_score","Aderenza generale (1–10)",10,1],
     ["stress_score","Stress (1–10)",10,1],
     ["hunger_score","Fame (1–10)",10,1],
     ["recovery_score","Recupero (1–10)",10,1],
     ["mood_score","Umore (1–10)",10,1],
     ["digestion_score","Digestione (1–10)",10,1],
     ["motivation_score","Motivazione (1–10)",10,1]
    ];

    const checkInputs={};
    const cg=node("div","","fp-grid");

    checkFields.forEach(([key,title,max,step])=>{

     const wrap=node("div");
     const i=field("number");

     i.min=String(step);
     i.max=String(max);
     i.step=String(step);

     checkInputs[key]=i;
     wrap.append(node("label",title),i);
     cg.append(wrap);

    });

    checkForm.append(cg);

    const notes=node("textarea");
    notes.placeholder="Come è andato questo periodo?";

    const message=node("div");

    const save=btn("Salva check",async()=>{

     if(!alive())return;

     const data={};

     for(const [key,i] of Object.entries(checkInputs)){

      if(i.value==="")continue;

      const n=Number(i.value);

      if(!Number.isFinite(n)||
       n<Number(i.min)||n>Number(i.max)||
       (key.endsWith("_score")&&!Number.isInteger(n))){
       status(message,"Controlla i valori del check.",true);
       return;
      }

      data[key]=n;

     }

     if(!Object.keys(data).length){
      status(message,"Inserisci almeno un valore.",true);
      return;
     }

     if(!checkDate.value||
      checkDate.value>todayRome()){
      status(message,"Data non valida.",true);
      return;
     }

     if(notes.value.trim())data.notes=notes.value.trim();

     save.disabled=true;

     try{

      await rpc("forge_progress_v3_save_checkin",{
       p_data:data,
       p_date:checkDate.value
      });

      if(!alive())return;

      alert("Check salvato.");
      await load();

     }catch(e){
      status(message,e.message,true);
     }finally{
      save.disabled=false;
     }

    });

    checkForm.append(notes,save,message);
    content.append(checkForm);

   }

   /* CARICAMENTO FOTO IPHONE */

   if(target===account){

    const upload=details("＋ Carica foto progressi",true);

    const photoDate=field("date");
    photoDate.value=todayRome();
    photoDate.max=todayRome();

    const pose=select(angles);

    const file=field("file");
    file.accept="image/*";

    const photoNotes=node("textarea");
    photoNotes.placeholder="Note facoltative";

    const message=node("div");

    async function prepareImage(original){

     if(original.size>15*1024*1024)
      throw Error("La foto supera 15 MB.");

     if(["image/jpeg","image/png","image/webp"]
      .includes(original.type))return original;

     const url=URL.createObjectURL(original);

     try{

      const img=new Image();
      img.src=url;

      await img.decode();

      const canvas=document.createElement("canvas");
      const scale=Math.min(1,1800/
       Math.max(img.width,img.height));

      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);

      canvas.getContext("2d").drawImage(
       img,0,0,canvas.width,canvas.height
      );

      const blob=await new Promise(resolve=>
       canvas.toBlob(resolve,"image/jpeg",0.88)
      );

      if(!blob)throw Error("Conversione non riuscita.");

      return blob;

     }catch(e){
      throw Error("Formato non leggibile. Seleziona una foto JPEG o PNG.");
     }finally{
      URL.revokeObjectURL(url);
     }

    }

    const save=btn("Carica e salva foto",async()=>{

     if(!alive())return;

     if(!file.files?.[0]){
      status(message,"Seleziona una foto.",true);
      return;
     }

     if(!photoDate.value||
      photoDate.value>todayRome()){
      status(message,"Data non valida.",true);
      return;
     }

     save.disabled=true;
     status(message,"Caricamento in corso...");

     let path="";
     let uploaded=false;
     let registered=false;

     try{

      const image=await prepareImage(file.files[0]);

      if(!alive())return;

      const ext=image.type==="image/png"?"png":
       image.type==="image/webp"?"webp":"jpg";

      path=account+"/"+photoDate.value+"/"+
       pose.value+"-"+crypto.randomUUID()+"."+ext;

      await result(
       db.storage.from(bucket).upload(path,image,{
        contentType:image.type,
        upsert:false
       })
      );

      uploaded=true;

      await rpc("forge_progress_v3_register_photo",{
       p_storage_path:path,
       p_photo_angle:pose.value,
       p_photo_date:photoDate.value,
       p_notes:photoNotes.value.trim()
      });

      registered=true;

      if(!alive())return;

      alert("Foto salvata nella galleria privata.");
      await load();

     }catch(e){

      if(uploaded&&!registered){

       const cleanup=await db.storage.from(bucket)
        .remove([path]);

       if(cleanup.error){
        status(message,
         e.message+" — Pulizia del file non riuscita.",
         true
        );
        return;
       }

      }

      status(message,e.message,true);

     }finally{
      save.disabled=false;
     }

    });

    upload.append(
     node("label","Data della foto"),
     photoDate,
     node("label","Posizione"),
     pose,
     node("label","Seleziona foto dall'iPhone"),
     file,
     photoNotes,
     save,
     message
    );

    content.append(upload);

   }

   /* CONFRONTO MULTIPLO */

   const comparison=details(
    "Prima e dopo • Confronta fino a 5 check",true
   );

   const allDates=[...new Set([

    ...measurements.map(m=>day(m.recorded_at)),
    ...photos.map(p=>day(p.photo_date)),
    ...checks.map(c=>day(c.checkin_date))

   ])].filter(Boolean).sort().reverse();

   comparison.append(node("p",
    "Seleziona da 2 a 5 date, anche di settimane o mesi differenti.",
    "small"
   ));

   const selected=new Set();
   const dateList=node("div");

   dateList.style.maxHeight="240px";
   dateList.style.overflowY="auto";

   const counter=node("p","0 di 5 date selezionate","small");

   const poseFilter=select(angles);

   const comparisonOutput=node("div");

   allDates.forEach(date=>{

    const label=node("label","","fp-check");
    const cb=field("checkbox");

    const photoCount=photos.filter(p=>
     day(p.photo_date)===date
    ).length;

    cb.onchange=()=>{

     if(cb.checked&&selected.size>=5){
      cb.checked=false;
      alert("Puoi confrontare al massimo 5 date.");
      return;
     }

     if(cb.checked)selected.add(date);
     else selected.delete(date);

     counter.textContent=selected.size+
      " di 5 date selezionate";

     comparisonOutput.replaceChildren();

    };

    label.append(
     cb,
     node("span",labelDate(date)+
      (photoCount?" • "+photoCount+" foto":""))
    );

    dateList.append(label);

   });

   if(!allDates.length){
    dateList.append(node("p",
     "Nessun check disponibile.","muted"));
   }

   comparison.append(dateList,counter,
    node("label","Posizione fotografica"),poseFilter);

   let compareRun=0;

   poseFilter.onchange=()=>{
    compareRun++;
    comparisonOutput.replaceChildren();
   };

   async function photoCard(photo,date){

    const card=node("div","","fp-photo");

    card.append(node("div",labelDate(date),"fp-date"));

    if(!photo){
     card.append(node("p","Foto non disponibile","small"));
     return card;
    }

    try{

     const data=await result(
      db.storage.from(photo.bucket_name||bucket)
       .createSignedUrl(photo.storage_path,900)
     );

     const img=node("img");

     img.src=data.signedUrl;
     img.alt="Foto progressi "+labelDate(date);
     img.loading="lazy";

     img.onerror=()=>{
      img.replaceWith(node("p",
       "Foto non visualizzabile.","small"));
     };

     card.append(img);

    }catch(e){
     card.append(node("p","Foto non accessibile.","small"));
    }

    return card;

   }

   const compareButton=btn("Confronta date selezionate",async()=>{

    if(selected.size<2){
     alert("Seleziona almeno due date.");
     return;
    }

    const run=++compareRun;
    const dates=[...selected].sort();
    const angle=poseFilter.value;

    compareButton.disabled=true;

    comparisonOutput.replaceChildren(
     node("p","Preparazione confronto...","small")
    );

    try{

     const gallery=node("div","","fp-scroll");

     const cards=await Promise.all(dates.map(date=>{

      const photo=photos.find(p=>
       day(p.photo_date)===date&&p.photo_angle===angle
      );

      return photoCard(photo,date);

     }));

     if(!alive()||run!==compareRun)return;

     gallery.append(...cards);

     comparisonOutput.replaceChildren(
      node("h3","Evoluzione fotografica"),
      gallery
     );

     const tableWrap=node("div","","fp-table");
     const table=node("table");
     const head=node("tr");

     head.append(node("th","Misura"));

     dates.forEach(d=>
      head.append(node("th",labelDate(d)))
     );

     head.append(node("th","Variazione"));

     const thead=node("thead");
     thead.append(head);
     table.append(thead);

     const tbody=node("tbody");

     const rows=dates.map(date=>
      measurements.find(m=>day(m.recorded_at)===date)
     );

     fields.forEach(([key,title,unit])=>{

      const values=rows.map(r=>valueOf(r,key));

      if(values.every(v=>v===null))return;

      const tr=node("tr");

      tr.append(node("td",title));

      values.forEach(v=>{
       tr.append(node("td",v===null?"—":
        number(v)+" "+unit));
      });

      const a=values[0];
      const b=values[values.length-1];

      const delta=a!==null&&b!==null
       ?Number(b)-Number(a):null;

      tr.append(node("td",delta===null?"—":
       (delta>0?"+":"")+number(delta)+" "+unit));

      tbody.append(tr);

     });

     table.append(tbody);
     tableWrap.append(table);

     comparisonOutput.append(
      node("h3","Confronto misurazioni"),
      node("p",
       "Variazione calcolata tra la prima e l'ultima data selezionata.",
       "small"),
      tableWrap
     );

    }catch(e){
     status(comparisonOutput,e.message,true);
    }finally{
     compareButton.disabled=false;
    }

   });

   comparison.append(compareButton,comparisonOutput);
   content.append(comparison);

   /* GALLERIA COMPLETA */

   const gallery=details("Galleria fotografica");
   const galleryPose=select([
    ["all","Tutte le posizioni"],...angles
   ]);

   const galleryOutput=node("div");

   let galleryRun=0;

   async function loadGallery(){

    const run=++galleryRun;

    galleryOutput.replaceChildren(
     node("p","Caricamento foto...","small")
    );

    const rows=photos.filter(p=>
     galleryPose.value==="all"||
     p.photo_angle===galleryPose.value
    );

    const grid=node("div","","fp-grid");

    const cards=await Promise.all(
     rows.slice(0,30).map(async p=>{

      const card=await photoCard(p,p.photo_date);

      card.append(node("p",
       angles.find(a=>a[0]===p.photo_angle)?.[1]||
       "Foto","small"));

      if(target===account){

       const archive=btn("Archivia",async()=>{

        if(!alive())return;
        if(!confirm("Archiviare questa foto?"))return;

        archive.disabled=true;

        try{

         await rpc("forge_progress_v3_archive_photo",{
          p_photo_id:p.id,
          p_archived:true
         });

         if(alive())await load();

        }catch(e){
         alert(e.message);
        }finally{
         archive.disabled=false;
        }

       },true);

       card.append(archive);

      }

      return card;

     })
    );

    if(!alive()||run!==galleryRun)return;

    grid.append(...cards);
    galleryOutput.replaceChildren(grid);

    if(!rows.length){
     galleryOutput.append(node("p",
      "Nessuna foto disponibile.","muted"));
    }

    if(rows.length>30){
     galleryOutput.append(node("p",
      "Visualizzate le 30 foto più recenti. Le altre restano disponibili nel confronto per data.",
      "small"));
    }

   }

   galleryPose.onchange=loadGallery;

   gallery.ontoggle=()=>{
    if(gallery.open)loadGallery();
   };

   gallery.append(galleryPose,galleryOutput);
   content.append(gallery);

   /* GRAFICI EVOLUZIONE */

   const charts=details("Grafici delle misurazioni");

   const metric=select(fields.map(([k,t,u])=>
    [k,t+" ("+u+")"]
   ));

   const range=select([
    ["30","Ultimi 30 giorni"],
    ["90","Ultimi 3 mesi"],
    ["180","Ultimi 6 mesi"],
    ["365","Ultimo anno"],
    ["all","Tutto lo storico"]
   ]);

   const chartOutput=node("div");

   function drawChart(){

    chartOutput.replaceChildren();

    const key=metric.value;

    const cutoff=range.value==="all"?0:
     Date.now()-Number(range.value)*86400000;

    const rows=measurements.filter(m=>
     m[key]!=null&&
     new Date(m.recorded_at).getTime()>=cutoff
    ).slice().reverse();

    if(!rows.length){
     chartOutput.append(node("p",
      "Nessuna misurazione nel periodo.","muted"));
     return;
    }

    const values=rows.map(r=>Number(r[key]));
    const low=Math.min(...values);
    const high=Math.max(...values);

    const svg=document.createElementNS(
     "http://www.w3.org/2000/svg","svg"
    );

    svg.setAttribute("viewBox","0 0 340 200");
    svg.style.width="100%";

    function shape(tag,attrs){

     const e=document.createElementNS(
      "http://www.w3.org/2000/svg",tag
     );

     Object.entries(attrs).forEach(([k,v])=>
      e.setAttribute(k,String(v))
     );

     svg.append(e);
     return e;

    }

    const x=i=>rows.length===1?170:
     38+i*282/(rows.length-1);

    const y=v=>high===low?95:
     165-(v-low)/(high-low)*130;

    for(let j=0;j<5;j++){

     const yy=35+j*32.5;

     shape("line",{
      x1:38,x2:320,y1:yy,y2:yy,
      stroke:"#39352e"
     });

    }

    if(rows.length>1){

     shape("polyline",{
      points:values.map((v,i)=>x(i)+","+y(v)).join(" "),
      stroke:"#e9c675",
      "stroke-width":2.5,
      fill:"none"
     });

    }

    values.forEach((v,i)=>{

     const dot=shape("circle",{
      cx:x(i),cy:y(v),r:4,fill:"#e9c675"
     });

     dot.onclick=()=>{

      chartTip.textContent=
       labelDate(rows[i].recorded_at)+
       " • "+number(v);

     };

    });

    const chartTip=node("p",
     "Tocca un punto per visualizzare la misura.",
     "small");

    const summary=node("div","","fp-grid");

    summary.append(
     stat("Iniziale",number(values[0])),
     stat("Attuale",number(values[values.length-1])),
     stat("Minimo",number(low)),
     stat("Massimo",number(high))
    );

    chartOutput.append(svg,chartTip,summary);

   }

   metric.onchange=drawChart;
   range.onchange=drawChart;

   charts.append(metric,range,chartOutput);
   content.append(charts);

   drawChart();

   /* STORICO CHECK */

   const history=details("Storico check e misurazioni");

   allDates.forEach(date=>{

    const item=details(labelDate(date));

    const ms=measurements.filter(m=>
     day(m.recorded_at)===date
    );

    const cs=checks.filter(c=>
     day(c.checkin_date)===date
    );

    ms.forEach(m=>{

     const box=panel();

     box.append(node("h3","Misurazioni"));

     fields.forEach(([key,title,unit])=>{

      if(m[key]!=null){

       box.append(node("div",
        title+": "+number(m[key])+" "+unit,
        "history-item"
       ));

      }

     });

     if(m.measurement_notes)
      box.append(node("p",m.measurement_notes,"small"));

     item.append(box);

    });

    cs.forEach(c=>{

     const box=panel();

     box.append(node("h3","Feedback periodico"));

     [
      ["body_weight_kg","Peso"],
      ["sleep_hours","Ore di sonno"],
      ["energy_score","Energia"],
      ["adherence_score","Aderenza"],
      ["stress_score","Stress"],
      ["hunger_score","Fame"],
      ["recovery_score","Recupero"],
      ["mood_score","Umore"],
      ["digestion_score","Digestione"],
      ["motivation_score","Motivazione"]
     ].forEach(([key,title])=>{

      if(c[key]!=null)
       box.append(node("div",
        title+": "+number(c[key]),"history-item"));

     });

     if(c.notes)box.append(node("p",c.notes));

     if(admin){

      const review=node("textarea");
      review.placeholder="Feedback del coach";

      const plan=node("textarea");
      plan.placeholder="Indicazioni per il prossimo periodo";

      const score=field("number","Valutazione 1–10");
      score.min="1";
      score.max="10";
      score.step="1";

      const message=node("div");

      const save=btn("Invia valutazione coach",async()=>{

       if(!alive())return;

       const n=Number(score.value);

       if(!Number.isInteger(n)||n<1||n>10||
        !review.value.trim()){
        status(message,"Inserisci valutazione e feedback.",true);
        return;
       }

       save.disabled=true;

       try{

        await rpc("forge_progress_v3_review_checkin",{
         p_checkin_id:c.id,
         p_score:n,
         p_feedback:review.value.trim(),
         p_action_plan:plan.value.trim()
        });

        status(message,"Valutazione salvata.");

       }catch(e){
        status(message,e.message,true);
       }finally{
        save.disabled=false;
       }

      });

      box.append(score,review,plan,save,message);

     }

     item.append(box);

    });

    const count=photos.filter(p=>
     day(p.photo_date)===date
    ).length;

    item.append(node("p",count+" foto registrate","small"));

    history.append(item);

   });

   if(!allDates.length){
    history.append(node("p",
     "Lo storico è ancora vuoto.","muted"));
   }

   content.append(history);

   /* FEEDBACK COACH */

   const feedback=dashboard?.latest_coach_feedback;

   if(feedback){

    const box=panel();

    box.append(node("h3","Ultimo feedback del coach"));

    if(feedback.feedback)
     box.append(node("p",feedback.feedback));

    if(feedback.action_plan)
     box.append(node("p",feedback.action_plan));

    content.append(box);

   }

   content.append(
    btn("Aggiorna progressi",load,true)
   );

  }catch(e){

   if(!alive())return;

   content.replaceChildren(
    node("div",e.message||String(e),"status error"),
    btn("Riprova",load,true)
   );

  }

 }

 await load();

}

 try{

function applySettings(s){

 const t=themes[s.theme]||themes.gold;
 const css=document.documentElement.style;

 css.setProperty('--gold',s.color||t.gold);
 css.setProperty('--bg',t.bg);

function saveSettings(s){

  return true;

  alert(
   'Memoria del dispositivo insufficiente. Prova una foto più piccola.'
  );

  return false;
 }
}

function updateSetting(name,value){

 const s=readSettings();

 if(value===null){
  delete s[name];
 }else{
  s[name]=value;
 }

 return saveSettings(s);
}

function pickImage(type,done){

 if(!user)return;

 if(type==='logo'&&!isAdmin())return;

 const account=user.id;

 const picker=document.createElement('input');

 picker.type='file';
 picker.accept='image/*';

 picker.style.position='fixed';
 picker.style.left='-9999px';

 document.body.append(picker);

 picker.addEventListener('cancel',()=>{
  picker.remove();
 },{once:true});

 picker.onchange=()=>{

  const file=picker.files?.[0];

  picker.remove();

  if(!file)return;

  const reader=new FileReader();

  reader.onerror=()=>{
   alert('Impossibile leggere la foto.');
  };

  reader.onload=()=>{

   const img=new Image();

   img.onerror=()=>{
    alert('Formato immagine non supportato.');
   };

   img.onload=()=>{

    if(user?.id!==account)return;

    if(type==='logo'&&!isAdmin())return;

    const max=type==='logo'?800:1200;

    const ratio=Math.min(
     1,max/Math.max(img.width,img.height)
    );

    const canvas=document.createElement(
     'canvas'
    );

    canvas.width=Math.max(
     1,Math.round(img.width*ratio)
    );

    canvas.height=Math.max(
     1,Math.round(img.height*ratio)
    );

    const ctx=canvas.getContext('2d');

    if(!ctx)return;

    if(type==='logo'){
     ctx.fillStyle='#000';
     ctx.fillRect(
      0,0,canvas.width,canvas.height
     );
    }

    ctx.drawImage(
     img,0,0,canvas.width,canvas.height
    );

    try{

     const data=canvas.toDataURL(
      'image/jpeg',.78
     );

     if(updateSetting(type,data)){

      if(typeof done==='function'){
       done();
      }

     }

    }catch(e){

     alert('Impossibile salvare immagine.');

    }

   };

   img.src=reader.result;

  };

  reader.readAsDataURL(file);

 };

 picker.click();
}

  if(saved!==true)throw Error('Anagrafica non sincronizzata');

 }catch(e){
  if(syncedIdentity===key)syncedIdentity='';
  console.warn('Forge V30 identity:',e.message);
 }
}

/* LETTURA CLIENTI */

async function getClients(){
 if(role!=='admin')throw Error('Accesso riservato al coach.');

 const result=await db.from('profiles')
 .select('id,first_name,last_name,full_name,email,avatar_url')
 .neq('id',user.id)
 .limit(1000);

 if(result.error)throw result.error;

 const access=await db.from('account_access')
 .select('user_id,status')
 .limit(1000);

 if(access.error)throw access.error;

 const map=new Map(
  (access.data||[]).map(x=>[x.user_id,x.status])
 );

 return (result.data||[]).map(p=>({
  ...p,
  status:map.get(p.id)||'unknown',
  name:[p.first_name,p.last_name]
   .filter(Boolean).join(' ')||
   p.full_name||p.email||'Cliente'
 })).sort((a,b)=>a.name.localeCompare(b.name,'it'));
}

function avatar(p){
 const a=node('div','','f30-avatar');

 a.textContent=p.name.split(/\s+/)
 .slice(0,2).map(x=>x[0]||'').join('').toUpperCase();

 if(p.avatar_url){
  const img=node('img');
  img.alt='Foto profilo';
  img.src=p.avatar_url;
  img.onload=()=>a.replaceChildren(img);
 }

 return a;
}

const statusLabels={
 approved:'Approvato',
 pending:'In attesa',
 suspended:'Sospeso',
 rejected:'Rifiutato',
 unknown:'Stato non disponibile'
};

/* CLIENT MANAGER */

async function clientManager(chatOnly=false){
 if(!visible()||role!=='admin')return;

 const title=chatOnly?'Forge Chat':'I miei clienti';
 const root=openPanel(title);
 const owner=user.id;
 const version=chatVersion;

 root.append(node('p','Caricamento clienti...','muted'));

 try{
  const clients=await getClients();

  if(!visible()||user.id!==owner||
   active!==title||chatVersion!==version)return;

  const unreadResult=await db.from(CHAT)
  .select('client_id')
  .eq('coach_id',owner)
  .neq('sender_id',owner)
  .is('read_at',null);

  if(unreadResult.error)throw unreadResult.error;

  if(!visible()||user.id!==owner||
   active!==title||chatVersion!==version)return;

  const counts={};

  (unreadResult.data||[]).forEach(m=>{
   counts[m.client_id]=(counts[m.client_id]||0)+1;
  });

  root.replaceChildren();

  const stats=node('div','','stats');

  [
   ['Clienti',clients.length],
   ['Approvati',clients.filter(p=>p.status==='approved').length],
   ['In attesa',clients.filter(p=>p.status==='pending').length],
   ['Messaggi non letti',(unreadResult.data||[]).length]
  ].forEach(([label,value])=>{
   const box=node('div','','stat');
   box.append(node('span',label),node('strong',String(value)));
   stats.append(box);
  });

  const search=node('input');
  search.type='search';
  search.placeholder='Cerca nome, cognome o email';

  const list=node('div');

  root.append(stats,search,list);

  function draw(){
   list.replaceChildren();

   const q=search.value.trim().toLowerCase();

   const filtered=clients.filter(p=>
    (!chatOnly||p.status==='approved') &&
    (p.name+' '+(p.email||'')).toLowerCase().includes(q)
   );

   if(!filtered.length){
    list.append(node('p','Nessun cliente trovato.','muted'));
   }

   filtered.forEach(p=>{
    const card=node('div','','f30-client');
    const info=node('div','','f30-info');

    info.append(
     node('strong',p.name),
     node('small',p.email||''),
     node('small',statusLabels[p.status]||p.status)
    );

    if(counts[p.id]){
     info.append(node('span',
      counts[p.id]+' non letti','f30-badge'));
    }

    const open=action(chatOnly?'Chat':'Apri',()=>{
     return chatOnly?openChat(p.id,p.name):clientDetail(p);
    });

    open.style.width='75px';

    card.append(avatar(p),info,open);
    list.append(card);
   });
  }

  search.oninput=draw;
  draw();

 }catch(e){
  if(active===title&&chatVersion===version){
   root.replaceChildren(node('div',e.message,'status error'));
  }
 }
}

async function changeStatus(id,status){
 if(role!=='admin')throw Error('Non autorizzato.');

 if(!confirm('Confermi il cambio di stato?'))return false;

 const {data,error}=await db.from('account_access')
 .update({status})
 .eq('user_id',id)
 .select('user_id');

 if(error)throw error;

 if(!data?.length)throw Error('Modifica non autorizzata.');

 return true;
}

async function clientDetail(p){
 if(!visible()||role!=='admin')return;

 const root=openPanel('I miei clienti');

 const card=node('div','','f30-panel');

 card.append(
  avatar(p),
  node('h2',p.name),
  node('p',p.email||'','muted'),
  node('p','Account: '+(statusLabels[p.status]||p.status))
 );

 root.append(
  action('‹ Tutti i clienti',()=>clientManager()),
  card
 );

 const controls=node('div','','f30-actions');

 [
  ['Approva','approved'],
  ['Sospendi','suspended'],
  ['Rifiuta','rejected']
 ].forEach(([label,status])=>{
  if(p.status===status)return;

  controls.append(action(label,async()=>{
   if(await changeStatus(p.id,status)){
    await clientManager();
   }
  }));
 });

 card.append(controls);

 if(p.status==='approved'){
  card.append(action('Apri Forge Chat',()=>{
   return openChat(p.id,p.name);
  },''));
 }

 const packages=node('div','','f30-panel');
 packages.append(node('h3','Pacchetti lezioni'));
 root.append(packages);

 const version=chatVersion;

 const {data,error}=await db
 .from('forge_lesson_package_summary')
 .select('*')
 .eq('client_id',p.id);

 if(chatVersion!==version||!packages.isConnected)return;

 if(error){
  packages.append(node('p',error.message,'muted'));
 }else if(!data?.length){
  packages.append(node('p','Nessun pacchetto assegnato.','muted'));
 }else{
  data.forEach(x=>{
   const box=node('div','','item');
   box.append(
    node('strong',x.title||'Pacchetto'),
    node('p','Lezioni rimanenti: '+x.remaining_sessions),
    node('p','Lezioni utilizzate: '+x.used_sessions)
   );
   packages.append(box);
  });
 }
}

/* FORGE CHAT PRIVATA */

async function openChat(clientId,name){
 if(!visible())return;

 const root=openPanel('Forge Chat');

 const owner=user.id;

 currentClient=role==='admin'?clientId:owner;
 currentOwner=owner;
 currentRoot=root;

 const id=currentClient;
 const version=chatVersion;

 if(role==='admin'){
  root.append(action('‹ Conversazioni',()=>clientManager(true)));
 }

 const panel=node('div','','f30-panel');

 panel.append(
  node('h3',role==='admin'?name:'Il tuo coach'),
  node('p','Conversazione privata','muted')
 );

 const messages=node('div','','f30-messages');
 const feedback=node('div','','small');

 const compose=node('div','','f30-compose');
 const text=node('textarea');

 text.placeholder='Scrivi un messaggio...';
 text.maxLength=4000;
 text.rows=2;

 let lastSignature=null;
 let firstLoad=true;

 function valid(){
  return visible()&&
   user.id===owner&&
   currentOwner===owner&&
   currentClient===id&&
   currentRoot===root&&
   active==='Forge Chat'&&
   chatVersion===version&&
   messages.isConnected&&
   !document.getElementById('sectionCard').classList.contains('hidden');
 }

 async function refresh(){
  if(!valid()||loadingChat||document.hidden)return;

  loadingChat=true;

  try{
   let query=db.from(CHAT)
   .select('id,coach_id,client_id,sender_id,body,created_at,read_at')
   .eq('client_id',id);

   if(role==='admin'){
    query=query.eq('coach_id',owner);
   }

   const {data,error}=await query
   .order('created_at',{ascending:false})
   .limit(200);

   if(error)throw error;
   if(!valid())return;

   const rows=(data||[]).reverse();

   const signature=JSON.stringify(
    rows.map(m=>[m.id,m.read_at,m.body])
   );

   const nearBottom=
    messages.scrollHeight-messages.scrollTop-
    messages.clientHeight<90;

   if(signature!==lastSignature){
    lastSignature=signature;

    messages.replaceChildren();

    if(!rows.length){
     messages.append(node('p',
      'Inizia la conversazione.','muted'));
    }

    rows.forEach(m=>{
     const mine=m.sender_id===owner;

     const bubble=node('div',m.body,
      'f30-bubble'+(mine?' mine':''));

     const time=new Date(m.created_at)
      .toLocaleString('it-IT',{
       day:'2-digit',
       month:'2-digit',
       hour:'2-digit',
       minute:'2-digit'
      });

     bubble.append(node('small',
      time+(mine?(m.read_at?' ✓✓':' ✓'):'')
     ));

     messages.append(bubble);
    });

    if(firstLoad||nearBottom){
     messages.scrollTop=messages.scrollHeight;
    }

    firstLoad=false;
   }

   if(rows.some(m=>m.sender_id!==owner&&!m.read_at)){
    if(valid()){
     await rpc('forge_v28_mark_chat_read',{
      p_client_id:id
     });
    }
   }

   if(valid())feedback.textContent='';

  }catch(e){
   if(valid())feedback.textContent=e.message;
  }finally{
   loadingChat=false;
  }
 }

 const send=action('Invia',async()=>{
  if(!valid())return;

  const body=text.value.trim();

  if(!body)return;

  await rpc('forge_v28_send_message',{
   p_client_id:id,
   p_body:body
  });

  if(!valid())return;

  if(text.value.trim()===body)text.value='';

  firstLoad=true;
  await refresh();

 },'');

 compose.append(text,send);

 panel.append(messages,feedback,compose);
 root.append(panel);

 await refresh();

 if(valid()){
  chatTimer=setInterval(()=>{
   if(!valid()){
    stopChat();
    return;
   }

   refresh();
  },5000);
 }
}

   b.id=id;
   b.dataset.section=title;
   b.type='button';
   nav.append(b);

  b.onclick=handler;

  return b;
 }

 );
}

let badgeBusy=false;

async function refreshBadge(){
 if(!visible()||badgeBusy)return;

 const owner=user.id;
 const admin=role==='admin';

 badgeBusy=true;

 try{
  let q=db.from(CHAT)
   .select('id',{count:'exact',head:true})
   .neq('sender_id',owner)
   .is('read_at',null);

  q=admin?q.eq('coach_id',owner):q.eq('client_id',owner);

  const {count,error}=await q;

  if(error||!visible()||user.id!==owner)return;

  const b=document.getElementById('forgeV30Chat');

  if(!b)return;

  let badge=b.querySelector('.f30-badge');

  if(count>0){
   if(!badge){
    badge=node('span','','f30-badge');
    b.append(badge);
   }

   badge.textContent=String(count);
  }else{
   badge?.remove();
  }

 }finally{
  badgeBusy=false;
 }
}

document.addEventListener('click',e=>{

 if(!b)return;

 if(
  b.id==='logoutBtn'||

   b.id!=='forgeV30Chat'&&
   b.id!=='forgeV30Clients')

 }
},true);

installMenu();

setInterval(()=>{
 installMenu();

 if(!visible()){
  if(currentRoot)stopChat();
  syncedIdentity='';
 }
},1000);

setInterval(()=>{
 syncIdentity();
 refreshBadge().catch(console.warn);
},10000);

syncIdentity();
refreshBadge().catch(console.warn);

console.info('FORGE V30 CLIENT MANAGER & CHAT ACTIVE');

})();

<script>
(()=>{
'use strict';

if(window.forgeV31)return;
window.forgeV31=true;

const CHAT='forge_chat_v28_messages';

const icons={
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-4M16 3a4 4 0 0 1 0 8"/>',
 chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H3l2-5a8.5 8.5 0 1 1 16-3.5Z"/>',
 send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'
};

function svg(name,size=24){
 return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[name]+'</svg>';
}

function el(tag,text='',cls=''){
 const n=document.createElement(tag);
 n.textContent=text;
 n.className=cls;
 return n;
}

function owner(){
 return typeof user!=='undefined'&&user?user.id:null;
}

function admin(){
 return typeof role!=='undefined'&&role==='admin';
}

function decorateIcons(){
 [
  ['forgeV30Clients','users'],
  ['forgeV30Chat','chat']
 ].forEach(([id,icon])=>{
  const b=document.getElementById(id);
  if(!b)return;

  const old=b.querySelector('svg');

  if(old&&old.dataset.f31===icon)return;

  const holder=document.createElement('span');
  holder.innerHTML=svg(icon,28);

  const fresh=holder.firstElementChild;
  fresh.dataset.f31=icon;

  if(old)old.replaceWith(fresh);
  else b.prepend(fresh);
 });
}

let cacheOwner=null;
let cacheTime=0;
let clientData=[];
let packages=[];
let messages=[];
let packagesOK=false;
let messagesOK=false;
let loading=null;

async function loadData(){
 const id=owner();

 if(!id||!admin())return;

 if(cacheOwner!==id){
  cacheOwner=id;
  cacheTime=0;
  clientData=[];
  packages=[];
  messages=[];
  packagesOK=false;
  messagesOK=false;
 }

 if(Date.now()-cacheTime<15000)return;
 if(loading)return loading;

 loading=(async()=>{
  try{
   const results=await Promise.allSettled([
    db.from('profiles')
     .select('id,first_name,last_name,full_name,email')
     .neq('id',id)
     .limit(1000),

    db.from('forge_lesson_package_summary')
     .select('*')
     .limit(1000),

    db.from(CHAT)
     .select('client_id,body,created_at,read_at,sender_id')
     .eq('coach_id',id)
     .order('created_at',{ascending:false})
     .limit(1000)
   ]);

   if(owner()!==id||!admin())return;

   const a=results[0].value;
   const b=results[1].value;
   const c=results[2].value;

   clientData=a&&!a.error?a.data||[]:[];
   packagesOK=!!b&&!b.error;
   messagesOK=!!c&&!c.error;
   packages=packagesOK?b.data||[]:[];
   messages=messagesOK?c.data||[]:[];

   cacheTime=Date.now();
  }catch(e){
   console.warn('Forge V31:',e);
  }
 })();

 try{
  await loading;
 }finally{
  loading=null;
 }
}

function findClient(card){
 const info=card.querySelector('.f30-info');
 if(!info)return null;

 const name=info.querySelector('strong')?.textContent;
 const email=info.querySelector('small')?.textContent;

 if(email){
  const exact=clientData.filter(p=>p.email===email);
  if(exact.length===1)return exact[0];
 }

 const matches=clientData.filter(p=>{
  const full=[p.first_name,p.last_name]
   .filter(Boolean).join(' ')||
   p.full_name||p.email;

  return full===name;
 });

 return matches.length===1?matches[0]:null;
}

function decorateCard(card,isChat){
 const info=card.querySelector('.f30-info');
 if(!info)return;

 const status=[...info.querySelectorAll('small')]
  .find(n=>/^(Approvato|In attesa|Sospeso|Rifiutato)$/.test(n.textContent));

 if(status){
  status.classList.add('f31-status');

  if(status.textContent==='In attesa')
   status.classList.add('pending');

  if(/Sospeso|Rifiutato/.test(status.textContent))
   status.classList.add('suspended');
 }

 const p=findClient(card);

 if(!p)return;

 if(isChat&&messagesOK){
  const m=messages.find(x=>x.client_id===p.id);

  let preview=info.querySelector('.f31-preview');

  if(!preview){
   preview=el('div','','f31-preview');
   info.append(preview);
  }

  preview.textContent=m
   ?m.body
   :'Inizia una conversazione';

  if(m){
   let time=info.querySelector('.f31-time');

   if(!time){
    time=el('div','','f31-time');
    info.append(time);
   }

   time.textContent=new Date(m.created_at)
    .toLocaleString('it-IT',{
     day:'2-digit',
     month:'2-digit',
     hour:'2-digit',
     minute:'2-digit'
    });
  }

 }else if(!isChat&&packagesOK){

  const rows=packages.filter(x=>
   x.client_id===p.id&&
   Number(x.remaining_sessions)>0&&
   (!x.status||x.status==='active')
  );

  const remaining=rows.reduce(
   (n,x)=>n+Number(x.remaining_sessions||0),0
  );

  const total=rows.reduce(
   (n,x)=>n+Number(
    x.total_sessions||
    (Number(x.used_sessions||0)+
     Number(x.remaining_sessions||0))
   ),0
  );

  let box=card.querySelector('.f31-package');

  if(!box){
   box=el('div','','f31-package');
   card.append(box);
  }

  box.replaceChildren();

  const label=el('div','','f31-package-label');

  label.append(
   el('span','Lezioni disponibili'),
   el('strong',rows.length?remaining+'/'+total:'—')
  );

  box.append(label);

  if(total>0){
   const track=el('div','','f31-track');
   const fill=el('div');

   fill.style.width=
    Math.min(100,remaining/total*100)+'%';

   if(remaining<=1)
    fill.style.background='#e89783';

   track.append(fill);
   box.append(track);
  }
 }
}

function installFilters(root,isChat){
 const search=root.querySelector('input[type="search"]');

 if(!search)return;

 let filters=root.querySelector('.f31-filters');

 if(!filters){
  filters=el('div','','f31-filters');
  filters.dataset.value='Tutti';

  const names=isChat
   ?['Tutti','Non letti']
   :['Tutti','Attivi','In attesa','Sospesi'];

  names.forEach(name=>{
   const b=el('button',name);

   b.type='button';

   if(name==='Tutti')
    b.classList.add('selected');

   b.onclick=()=>{
    filters.dataset.value=name;

    filters.querySelectorAll('button')
     .forEach(x=>x.classList.toggle(
      'selected',x===b
     ));

    applyFilters(root,filters);
   };

   filters.append(b);
  });

  search.after(filters);
 }

 applyFilters(root,filters);
}

function applyFilters(root,filters){
 const value=filters.dataset.value;

 root.querySelectorAll('.f30-client')
 .forEach(card=>{
  const info=card.querySelector('.f30-info');
  const labels=info?[...info.querySelectorAll('small')]
   .map(x=>x.textContent):[];

  let show=true;

  if(value==='Attivi')
   show=labels.includes('Approvato');

  if(value==='In attesa')
   show=labels.includes('In attesa');

  if(value==='Sospesi')
   show=labels.includes('Sospeso');

  if(value==='Non letti'){
   const p=findClient(card);

   show=messagesOK&&!!p&&messages.some(m=>
    m.client_id===p.id&&
    m.sender_id!==owner()&&
    !m.read_at
   );
  }

  card.style.display=show?'':'none';
 });
}

function decorateEmpty(root,isChat){
 const p=[...root.querySelectorAll('p')]
  .find(n=>n.textContent.trim()==='Nessun cliente trovato.');

 if(!p)return;

 const empty=el('div','','f31-empty');
 const icon=document.createElement('span');

 icon.innerHTML=svg(isChat?'chat':'users',38);

 empty.append(
  icon,
  el('strong',isChat
   ?'Nessuna conversazione disponibile'
   :'Nessun cliente trovato'),
  el('div',isChat
   ?'Qui compariranno i clienti con cui puoi comunicare.'
   :'I clienti registrati compariranno in questa area.')
 );

 p.replaceWith(empty);
}

function decorateConversation(root){
 const compose=root.querySelector('.f30-compose');
 const panel=compose?.closest('.f30-panel');

 if(!panel)return;

 const send=compose.querySelector('button');

 if(send&&!send.dataset.f31){
  send.dataset.f31='1';
  send.setAttribute('aria-label','Invia messaggio');
  send.innerHTML=svg('send',21);
 }

 if(!panel.querySelector('.f31-chat-head')){
  const title=panel.querySelector('h3');
  const subtitle=title?.nextElementSibling;

  if(!title)return;

  const head=el('div','','f31-chat-head');

  const avatar=el(
   'div',
   title.textContent.split(/\s+/)
    .slice(0,2)
    .map(x=>x[0]||'')
    .join('').toUpperCase(),
   'f30-avatar'
  );

  const info=el('div');

  title.before(head);
  info.append(title);

  info.append(el(
   'small',
   'Conversazione privata Forge'
  ));

  if(subtitle&&subtitle.tagName==='P')
   subtitle.remove();

  head.append(avatar,info);
 }
}

function decorateProfile(root){
 const panel=root.querySelector('.f30-panel');
 const avatar=panel?.querySelector('.f30-avatar');
 const title=panel?.querySelector('h2');

 if(!panel||!avatar||!title)return;

 if(panel.querySelector('.f31-profile-head'))
  return;

 const head=el('div','','f31-profile-head');

 avatar.before(head);
 head.append(avatar,title);
}

let busy=false;

async function refresh(){
 decorateIcons();

 const card=document.getElementById('sectionCard');
 const root=document.getElementById('sectionContent');
 const title=document.getElementById('sectionTitle');

 if(!card||!root||!title)return;

 const isChat=title.textContent.trim()==='Forge Chat';
 const isClients=title.textContent.trim()==='I miei clienti';

 card.classList.toggle(
  'f31-screen',isChat||isClients
 );

 if(!isChat&&!isClients)return;
 if(card.classList.contains('hidden')||!owner())return;

 if(isChat)decorateConversation(root);
 if(isClients)decorateProfile(root);

 const search=root.querySelector('input[type="search"]');

 if(!search)return;

 if(!root.querySelector('.f31-subtitle')){
  root.prepend(el(
   'div',
   isChat
    ?'FORGE CHAT • PRIVATE MESSAGING'
    :'FORGE CLIENTS • COACH MANAGEMENT',
   'f31-subtitle'
  ));
 }

 decorateEmpty(root,isChat);

 if(busy)return;
 busy=true;

 try{
  const id=owner();

  await loadData();

  if(owner()!==id||!admin())return;

  if(title.textContent.trim()!==
   (isChat?'Forge Chat':'I miei clienti'))
   return;

  root.querySelectorAll('.f30-client')
   .forEach(card=>decorateCard(card,isChat));

  installFilters(root,isChat);

 }finally{
  busy=false;
 }
}

setInterval(()=>{
 refresh().catch(console.warn);
},1000);

refresh().catch(console.warn);

console.info('FORGE V31 PREMIUM REDESIGN ACTIVE');

})();
</script>

<script>
(()=>{
'use strict';

if(window.forgeV32)return;
window.forgeV32=true;

let busy=false;
let lastLoad=0;
let lastList=null;
let lastOwner=null;

function element(tag,text,cls){
 const e=document.createElement(tag);
 e.textContent=text||'';
 if(cls)e.className=cls;
 return e;
}

function normalize(s){
 return String(s||'').trim().toLowerCase();
}

function decorate(){

 const card=document.getElementById('sectionCard');
 const root=document.getElementById('sectionContent');
 const title=document.getElementById('sectionTitle');

 if(!card||!root||!title)return;

 const name=normalize(title.textContent);

 const chat=name==='forge chat';
 const clients=/^(i miei clienti|forge clients|forge client manager)$/.test(name);

 const enabled=(chat||clients)&&
 !card.classList.contains('hidden');

 card.classList.toggle('f32-active',enabled);
 card.classList.toggle('f32-chat',enabled&&chat);

 const conversation=enabled&&chat&&
 !!root.querySelector('.f30-messages');

 card.classList.toggle(
 'f32-conversation',conversation
 );

 if(!enabled)return;

 if(clients&&title.textContent!=='Forge Clients'){
 title.textContent='Forge Clients';
 }

 let back=card.querySelector('.f32-back');

 if(!back){
 back=element(
 'button','‹  Torna alla home','f32-back'
 );

 back.type='button';

 back.onclick=()=>{
 const close=document.getElementById(
 'closeSectionBtn'
 );

 if(close)close.click();

 card.classList.remove(
 'f32-conversation','f32-active','f32-chat'
 );
 };

 title.before(back);
 }

 const stats=root.querySelector('.stats');

 if(stats){

 stats.querySelectorAll('.stat').forEach(box=>{

 const label=box.querySelector('span');
 if(!label)return;

 const text=normalize(label.textContent);

 if(chat){

 const hide=/approvat|attesa|attivi/.test(text);

 box.classList.toggle('f32-hide',hide);

 if(text==='clienti'){
 label.textContent='Contatti';
 }

 if(text==='messaggi non letti'){
 label.textContent='Non letti';
 }

 }else{

 box.classList.remove('f32-hide');

 if(text==='approvati'){
 label.textContent='Attivi';
 }

 if(text==='messaggi non letti'){
 label.textContent='Messaggi';
 }

 }

 });

 }

 if(chat&&!conversation){

 const search=root.querySelector(
 'input[type="search"]'
 );

 if(search){
 search.placeholder='Cerca una conversazione...';
 }

 const rows=root.querySelectorAll('.f30-client');

 rows.forEach(row=>{

 const button=row.querySelector('button');

 if(button&&button.textContent.trim()==='Chat'){
 button.textContent='›';
 button.setAttribute(
 'aria-label','Apri conversazione'
 );
 }

 });

 }

}

async function previews(){

 if(busy)return;

 const card=document.getElementById('sectionCard');
 const root=document.getElementById('sectionContent');

 if(!card||!root||
 !card.classList.contains('f32-chat')||
 card.classList.contains('hidden')||
 card.classList.contains('f32-conversation'))return;

 if(typeof user==='undefined'||!user||
 typeof db==='undefined'||
 typeof role==='undefined'||role!=='admin')return;

 const rows=[...root.querySelectorAll('.f30-client')];

 if(!rows.length)return;

 const owner=user.id;
 const first=rows[0];

 if(lastList===first&&lastOwner===owner&&
 Date.now()-lastLoad<15000)return;

 busy=true;

 try{

 const profiles=await db.from('profiles')
 .select('id,first_name,last_name,full_name,email')
 .neq('id',owner)
 .limit(1000);

 if(profiles.error)throw profiles.error;

 const messages=await db
 .from('forge_chat_v28_messages')
 .select('client_id,sender_id,body,created_at,read_at')
 .eq('coach_id',owner)
 .order('created_at',{ascending:false})
 .limit(1000);

 if(messages.error)throw messages.error;

 if(!user||user.id!==owner||
 !first.isConnected||
 !card.classList.contains('f32-chat')||
 card.classList.contains('hidden'))return;

 const latest=new Map();
 const unread=new Map();

 (messages.data||[]).forEach(m=>{

 if(!latest.has(m.client_id)){
 latest.set(m.client_id,m);
 }

 if(m.sender_id!==owner&&!m.read_at){
 unread.set(
 m.client_id,
 (unread.get(m.client_id)||0)+1
 );
 }

 });

 rows.forEach(row=>{

 if(!row.isConnected)return;

 const info=row.querySelector('.f30-info');
 if(!info)return;

 const strong=info.querySelector('strong');
 if(!strong)return;

 const name=normalize(strong.textContent);
 const details=normalize(info.textContent);

 const matches=(profiles.data||[]).filter(p=>{

 const full=normalize(
 [p.first_name,p.last_name]
 .filter(Boolean).join(' ')||
 p.full_name||p.email
 );

 return full===name||
 (p.email&&details.includes(normalize(p.email)));

 });

 if(matches.length!==1)return;

 const id=matches[0].id;
 const msg=latest.get(id);

 info.querySelectorAll(
 '.f32-preview,.f32-time,.f32-unread'
 ).forEach(e=>e.remove());

 const preview=element(
 'div',
 msg
 ?(msg.sender_id===owner?'Tu: ':'')+msg.body
 :'Inizia una conversazione',
 'f32-preview'
 );

 info.append(preview);

 if(msg){

 const date=new Date(msg.created_at);

 const today=date.toDateString()===
 new Date().toDateString();

 const time=element(
 'div',
 today
 ?date.toLocaleTimeString('it-IT',{
 hour:'2-digit',minute:'2-digit'
 })
 :date.toLocaleDateString('it-IT',{
 day:'2-digit',month:'2-digit'
 }),
 'f32-time'
 );

 info.append(time);

 }

 if(unread.get(id)){

 const badge=element(
 'span',
 String(unread.get(id))+' non letti',
 'f32-unread'
 );

 info.append(badge);

 }

 });

 lastList=first;
 lastOwner=owner;
 lastLoad=Date.now();

 }catch(e){

 console.warn('Forge V32 preview:',e.message);

 }finally{

 busy=false;

 }

}

function update(){

 try{
 decorate();
 previews();
 }catch(e){
 console.warn('Forge V32:',e.message);
 }

}

update();

setInterval(update,1000);

console.info(
 'FORGE V32 PREMIUM CLIENTS & CHAT ACTIVE'
);

})();
</script>
<!-- END FORGE V32 -->

(()=>{

if(window.forgePremiumV39)return;

const get=id=>document.getElementById(id);

function make(tag,text='',cls=''){
 const n=document.createElement(tag);
 n.textContent=text;
 n.className=cls;
 return n;
}

function normalize(value){
 return String(value||'')
 .trim().toLowerCase();
}

function btn(text,fn){
 const b=make('button',text);
 b.type='button';
 b.onclick=fn;
 return b;
}

let previousScreen='';
let selectedMeal='';

function dateShift(value,amount){
 const d=new Date(value+'T12:00:00');
 d.setDate(d.getDate()+amount);

 return d.getFullYear()+'-'+
 String(d.getMonth()+1).padStart(2,'0')+'-'+
 String(d.getDate()).padStart(2,'0');
}

function decorateNutrition(root){

 const panel=root.querySelector(
 '#forgeNutritionV10'
 );

 if(!panel)return;

 const date=panel.querySelector(
 'input[type=date]'
 );

 const search=panel.querySelector(
 'input[type=search]'
 );

 if(!date||!search)return;

 [...panel.children].forEach(n=>{

 const text=normalize(n.textContent);

 if(
 n.tagName==='H3'&&
 text==='forge nutrition'
 ||
 n.tagName==='P'&&
 text==='diario alimentare personale'
 ||
 n.tagName==='LABEL'&&
 ['data','cerca alimento'].includes(text)
 ){
 n.style.display='none';
 }

 });

 if(!panel.querySelector('.f39-date')){

 const wrap=make('div','','f39-date');

 const change=amount=>{

 const next=dateShift(date.value,amount);

 if(date.max&&next>date.max)return;

 date.value=next;

 date.dispatchEvent(
 new Event('change',{bubbles:true})
 );

 };

 date.before(wrap);

 wrap.append(
 btn('‹',()=>change(-1)),
 date,
 btn('›',()=>change(1))
 );

 }

 search.placeholder='Cerca alimento o marca...';

 const find=[...panel.children].find(n=>
 n.tagName==='BUTTON'&&
 normalize(n.textContent)==='cerca alimento'
 );

 if(find&&!panel.querySelector('.f39-search')){

 const wrap=make('div','','f39-search');

 search.before(wrap);

 find.textContent='⌕';

 find.setAttribute(
 'aria-label','Cerca alimento'
 );

 wrap.append(search,find);

 }

 const heading=[...panel.querySelectorAll('h3')]
 .find(n=>
 normalize(n.textContent)==='diario della giornata'
 );

 if(!heading)return;

 const diary=heading.parentElement;

 const calories=diary.querySelector(
 '.forge-n10-kcal'
 );

 const macros=diary.querySelector(
 '.forge-n10-macros'
 );

 if(!calories||!macros)return;

 const dateRow=panel.querySelector('.f39-date');

 if(dateRow&&dateRow.nextElementSibling!==diary){
 dateRow.after(diary);
 }

 heading.style.display='none';

 if(!diary.querySelector('.f39-meals')){

 const entries=[...diary.children].filter(n=>
 n.classList.contains('forge-n10')
 );

 const groups=[
 ['Colazione',['colazione']],
 ['Pranzo',['pranzo']],
 ['Spuntini',['spuntino','spuntini','merenda']],
 ['Cena',['cena']],
 ['Extra',['extra','altro']]
 ];

 const meals=make('div','','f39-meals');

 meals.append(
 make('h3','Diario alimentare')
 );

 const used=new Set();

 groups.forEach(([name,aliases])=>{

 const box=make('div','','f39-meal');

 const head=make(
 'div','','f39-meal-head'
 );

 const info=make('div');

 const items=entries.filter(entry=>{

 const detail=entry.querySelector('p');

 const meal=normalize(
 detail?.textContent.split('•')[0]
 );

 return aliases.includes(meal);

 });

 let kcal=0;

 items.forEach(entry=>{

 used.add(entry);

 const match=entry.textContent.match(
 /([\d.,]+)\s*kcal/i
 );

 if(match){

 const value=match[1]
 .replace(/\./g,'')
 .replace(',','.');

 kcal+=Number(value)||0;

 }

 });

 info.append(
 make('strong',name),
 make('div',
 Math.round(kcal)+' kcal',
 'small')
 );

 const add=btn('+',()=>{

 selectedMeal=
 name==='Spuntini'?'Merenda':name;

 search.scrollIntoView({
 behavior:'smooth',
 block:'center'
 });

 search.focus();

 });

 add.setAttribute(
 'aria-label','Aggiungi a '+name
 );

 head.append(info,add);
 box.append(head);

 items.forEach(entry=>box.append(entry));

 meals.append(box);

 });

 entries.filter(n=>!used.has(n))
 .forEach(n=>meals.append(n));

 diary.append(meals);

 }

 if(selectedMeal){

 panel.querySelectorAll('select')
 .forEach(select=>{

 if(select.dataset.f39Meal)return;

 const values=[...select.options]
 .map(o=>o.value);

 if(
 values.includes('Colazione')&&
 values.includes('Pranzo')
 ){

 select.dataset.f39Meal='1';

 if(values.includes(selectedMeal)){
 select.value=selectedMeal;
 }

 }

 });

 }

}

function decorateClients(root){

 const search=root.querySelector(
 'input[type=search]'
 );

 if(!search)return;

 let filters=root.querySelector(
 '.f39-filters'
 );

 if(!filters){

 filters=make('div','','f39-filters');

 filters.dataset.value='Tutti';

 ['Tutti','Attivi','In attesa','Sospesi']
 .forEach(name=>{

 const b=btn(name,()=>{

 filters.dataset.value=name;

 filters.querySelectorAll('button')
 .forEach(x=>x.classList.toggle(
 'selected',x===b

 applyClientFilters(root,filters);

 });

 if(name==='Tutti'){
 b.classList.add('selected');
 }

 filters.append(b);

 });

 search.after(filters);

 }

 applyClientFilters(root,filters);

}

function applyClientFilters(root,filters){

 const value=filters.dataset.value;

 root.querySelectorAll('.f30-client')
 .forEach(card=>{

 const labels=[...card.querySelectorAll(
 '.f30-info small'
 )].map(n=>normalize(n.textContent));

 let show=true;

 if(value==='Attivi'){
 show=labels.some(t=>
 ['approvato','attivo','approved'].includes(t)
 );
 }

 if(value==='In attesa'){
 show=labels.some(t=>
 ['in attesa','pending'].includes(t)
 );
 }

 if(value==='Sospesi'){
 show=labels.some(t=>
 ['sospeso','suspended'].includes(t)
 );
 }

 card.style.display=show?'':'none';

 });

}

function refresh(){

 const app=get('app');
 const card=get('sectionCard');
 const root=get('sectionContent');
 const title=get('sectionTitle');

 if(!app||!card||!root||!title)return;

 const visible=
 !app.classList.contains('hidden')&&
 !card.classList.contains('hidden');

 const name=normalize(title.textContent);

 const nutrition=name==='forge nutrition';

 const clients=[
 'forge clients',
 'i miei clienti',
 'forge client manager'
 ].includes(name);

 const chat=name==='forge chat';

 const enabled=visible&&
 (nutrition||clients||chat);

 app.classList.toggle('f39-open',enabled);

 card.classList.toggle('f39-screen',enabled);

 card.classList.toggle(
 'f39-nutrition',enabled&&nutrition
 );

 card.classList.toggle(
 'f39-clients',enabled&&clients
 );

 card.classList.toggle(
 'f39-chat',enabled&&chat
 );

 const oldBack=card.querySelector('.f39-back');

 if(!enabled){

 if(oldBack)oldBack.remove();

 previousScreen='';
 selectedMeal='';

 return;

 }

 if(previousScreen!==name){

 previousScreen=name;

 requestAnimationFrame(()=>{
 window.scrollTo(0,0);
 });

 }

 const existingBack=card.querySelector(
 '.f32-back'
 );

 if(existingBack){

 existingBack.style.display=
 nutrition?'none':'';

 }

 if(nutrition&&!oldBack){

 const back=btn('‹ Torna alla home',()=>{

 get('closeSectionBtn')?.click();

 app.classList.remove('f39-open');

 window.scrollTo(0,0);

 });

 back.className='f39-back';

 title.before(back);

 }

 if(!nutrition&&oldBack){
 oldBack.remove();
 }

 if(nutrition){
 decorateNutrition(root);
 }

 if(clients){
 decorateClients(root);
 }

}

function safeRefresh(){
 try{
 refresh();
 }catch(e){
 console.warn('Forge V39:',e);
 }
}

document.addEventListener('click',()=>{
 setTimeout(safeRefresh,80);
});

safeRefresh();

setInterval(safeRefresh,700);

console.info(
 'FORGE V39 PREMIUM INTERFACE ACTIVE'
);

})();
</script>

 const g=Math.min(255,
  Math.round(((n>>8)&255)*f));

 const b=Math.min(255,
  Math.round((n&255)*f));

 return '#'+[r,g,b].map(
  v=>v.toString(16).padStart(2,'0')
 ).join('');
}

  diamonds:'#dcf8ff',
  waves:accent,
  vortex:'#b68aff',
  hearts:'#ff83b7',
  glitch:'#00eaff',
  spark:'#ffd477',
  rings:accent
 };

 const color=colors[effect]||accent;
 const count=Math.round(8+power*48);

 while(particles.length<count){
  particles.push(particle());
 }

 particles.length=count;

 ctx.fillStyle=color;
 ctx.strokeStyle=color;
 ctx.lineWidth=1;

 if(effect==='aurora'||effect==='waves'){

  for(let j=0;j<3;j++){

   ctx.beginPath();
   ctx.globalAlpha=.06+power*.12;
   ctx.lineWidth=effect==='aurora'?22:2;

   for(let x=0;x<=w;x+=8){

    const y=h*(.2+j*.25)+
     Math.sin(x*.012+time*.0007+j)*45;

    if(x===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
   }

   ctx.stroke();
  }

 }else if(effect==='neon'){

  ctx.globalAlpha=
   (.12+Math.sin(time*.002)*.08)*power;

  ctx.lineWidth=7;
  ctx.strokeRect(4,4,w-8,h-8);

 }else if(effect==='lightning'){

  ctx.globalAlpha=.12*power;
  ctx.lineWidth=2;

  for(let j=0;j<3;j++){
   ctx.beginPath();

   let x=w*(.2+j*.3);

   ctx.moveTo(x,0);

   for(let y=0;y<h;y+=35){
    x+=Math.sin(
     y*.08+j+time*.001
    )*25;

    ctx.lineTo(x,y);
   }

   ctx.stroke();
  }

 }else{

  for(const p of particles){

   ctx.globalAlpha=
    p.a*(.15+power*.65);

   ctx.fillStyle=effect==='confetti'?
    'hsl('+p.hue+',90%,65%)':color;

   ctx.strokeStyle=ctx.fillStyle;

   if(effect==='vortex'){

    p.phase+=.008*p.speed;

    const radius=35+p.r*40;

    p.x=w/2+
     Math.cos(p.phase)*radius;

    p.y=h/2+
     Math.sin(p.phase)*radius*1.5;

   }else if([
    'fire','embers','bubbles',
    'hearts','spark'
   ].includes(effect)){

    p.y-=p.speed;
    p.x+=Math.sin(
     time*.001+p.phase
    )*.5;

   }else{

    p.y+=p.speed*
     (effect==='rain'?4:1);

    p.x+=Math.sin(
     time*.0008+p.phase
    )*.4;
   }

   if(p.y>h+20)p.y=-20;
   if(p.y<-20)p.y=h+20;
   if(p.x>w+20)p.x=-20;
   if(p.x<-20)p.x=w+20;

   if(effect==='matrix'){

    ctx.font='12px monospace';

    ctx.fillText(
     Math.floor(time/180+p.phase)%2?
     '1':'0',p.x,p.y
    );

   }else if(
    effect==='rain'||effect==='meteor'
   ){

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x-7,p.y-18);
    ctx.stroke();

   }else if(effect==='diamonds'){

    ctx.beginPath();
    ctx.moveTo(p.x,p.y-p.r*2);
    ctx.lineTo(p.x+p.r,p.y);
    ctx.lineTo(p.x,p.y+p.r*2);
    ctx.lineTo(p.x-p.r,p.y);
    ctx.closePath();
    ctx.stroke();

   }else if(effect==='hearts'){

    ctx.font='15px sans-serif';
    ctx.fillText('♡',p.x,p.y);

   }else if(
    effect==='glitch'||
    effect==='confetti'
   ){

    ctx.fillRect(
     p.x,p.y,p.r*3,p.r
    );

   }else if(
    effect==='stars'||
    effect==='spark'
   ){

    ctx.beginPath();
    ctx.moveTo(p.x-p.r*2,p.y);
    ctx.lineTo(p.x+p.r*2,p.y);
    ctx.moveTo(p.x,p.y-p.r*2);
    ctx.lineTo(p.x,p.y+p.r*2);
    ctx.stroke();

   }else{

    ctx.beginPath();

    ctx.arc(
     p.x,p.y,
     effect==='rings'?p.r*5:
     effect==='bubbles'?p.r*3:p.r,
     0,Math.PI*2
    );

    if(
     effect==='rings'||
     effect==='bubbles'
    )ctx.stroke();

    else ctx.fill();
   }
  }
 }

 ctx.globalAlpha=1;
 frame=requestAnimationFrame(draw);
}

function startEffect(){

 if(
  !account()||
  !draft.motion||
  draft.effect==='none'||
  reduced.matches||
  document.hidden
 ){
  stopEffect();
  return;
 }

 if(canvas)return;

 canvas=document.createElement('canvas');
 canvas.id='fs40Canvas';
 canvas.setAttribute('aria-hidden','true');

 document.body.append(canvas);

 ctx=canvas.getContext('2d');

 if(!ctx){
  stopEffect();
  return;
 }

 resize();

 frame=requestAnimationFrame(draw);
}

 applyTheme();
 startEffect();
}

if(window.FORGE_ACCESS_V50)return;

let owner='';
let access=null;
let permissions={};
let loading=false;
let lastLoad=0;
let generation=0;

 'Allenamento':'training',

 n.className=cls;

 user && get('app') &&
 !get('app').classList.contains('hidden');
}

function admin(){

async function rpc(name,args={}){
 const r=await db.rpc(name,args);
 if(r.error)throw r.error;
 return r.data;
}

function button(text,fn,cls='secondary'){
 const b=node('button',text,cls);
 b.type='button';
 b.onclick=async()=>{
  b.disabled=true;
  try{
   await fn();
  }catch(e){
   alert(e.message||String(e));
  }finally{
   b.disabled=false;
  }
 };

  node('strong',String(value))
 );

}

function dateText(value){
 if(!value)return '—';
 const d=new Date(value);
 return Number.isFinite(d.getTime())
 ?d.toLocaleString('it-IT')
 :'—';

async function trialRows(id){

 .select('id,starts_at,expires_at,revoked_at')
 .eq('client_id',id)

 .limit(1);

 return r.data?.[0]||null;

 if(!Number.isFinite(ms))return '—';
 if(ms<=0)return 'Scaduto';

 const hours=Math.ceil(ms/3600000);
 const days=Math.floor(hours/24);

 return days+' g '+hours%24+' h';
}

 if(admin()){

 if(loading)return;

 if(!force&&Date.now()-lastLoad<30000){

 loading=true;

   {p_client_id:id}
  );

  const checks=await Promise.all(
   [...new Set(Object.values(modules))]
   .map(async key=>[
    key,
    await rpc('forge_v47_can_access',{
     p_module:key
    })
   ])
  );

  let trial=null;

  try{
   trial=await trialRows(id);
  }catch(e){
   console.warn('Forge trial:',e.message);
  }

  if(!visible()||user.id!==id||
   generation!==g)return;

  access={
   ...status,
   f50TrialEnd:trialEnd(trial)
  };

  permissions=Object.fromEntries(checks);
  lastLoad=Date.now();

  drawHome();
  paintNavigation();

  const key=modules[active];

  if(key&&permissions[key]===false){
   get('sectionContent')?.replaceChildren(
    node('p',
     'Accesso non disponibile. Contatta il coach o rinnova il tuo piano.',
     'f50-warning')
   );
  }

 }catch(e){
  console.warn('Forge Access V50:',e.message);
 }finally{
  loading=false;
 }
}

document.addEventListener('click',e=>{
 if(!visible()||admin())return;

 const b=e.target.closest('[data-section]');
 if(!b)return;

 const key=modules[b.dataset.section];

 if(key&&permissions[key]===false){
  e.preventDefault();
  e.stopImmediatePropagation();

  alert(
   'Questa funzione non è disponibile con il tuo accesso attuale.'
  );
 }
},true);

function installAdminButton(){
 if(!admin()||get('f50AdminButton'))return;

 const nav=get('mainNav');
 if(!nav)return;

 const b=button(
  'Gestione accessi',
  openAdmin
 );

 b.id='f50AdminButton';
 nav.append(b);
}

async function openAdmin(){
 if(!admin())return;

 serial++;
 calendarSerial++;
 active='Forge Access Control';

 const root=get('sectionContent');

 get('sectionTitle').textContent=
 'Forge Access Control';

 get('sectionText').textContent=
 'Prove gratuite, accessi e scadenze';

 get('sectionCard').classList.remove('hidden');

 root.replaceChildren(
  node('p','Caricamento clienti...','muted')
 );

 const id=user.id;
 const request=serial;

 try{
  const [profiles,accounts]=await Promise.all([
   db.from('profiles')
   .select('id,first_name,last_name,full_name,email')
   .neq('id',id)
   .limit(1000),

   db.from('account_access')
   .select('user_id,status')
   .limit(1000)
  ]);

  if(profiles.error)throw profiles.error;
  if(accounts.error)throw accounts.error;

  if(!admin()||user.id!==id||
   request!==serial)return;

  const map=new Map(
   (accounts.data||[])
   .map(x=>[x.user_id,x.status])
  );

  const clients=(profiles.data||[]).map(p=>({
   ...p,
   name:[p.first_name,p.last_name]
   .filter(Boolean).join(' ')||
   p.full_name||p.email||'Cliente',
   status:map.get(p.id)||'unknown'
  }));

  root.replaceChildren();

  const panel=node('div','','f50-panel');

  panel.append(
   node('h3','GESTIONE CLIENTI')
  );

  const stats=node('div','','f50-grid');

  stats.append(
   stat('Clienti',clients.length),
   stat('Approvati',
    clients.filter(p=>p.status==='approved').length)
  );

  const search=node('input');
  search.type='search';
  search.placeholder='Cerca cliente...';

  const list=node('div');

  panel.append(stats,search,list);
  root.append(panel);

  function draw(){
   list.replaceChildren();

   const q=search.value.toLowerCase().trim();

   clients.filter(p=>
    (p.name+' '+(p.email||''))
    .toLowerCase().includes(q)
   ).forEach(p=>{

    const details=node('details','','f50-client');

    details.append(
     node('summary',p.name),
     node('p',p.email||'','muted'),
     node('p','Account: '+p.status,'muted')
    );

    const body=node('div');
    details.append(body);

    details.ontoggle=()=>{
     if(details.open){
      loadClient(p,body);
     }
    };

    list.append(details);
   });

   if(!list.children.length){
    list.append(
     node('p','Nessun cliente trovato.','muted')
    );
   }
  }

  search.oninput=draw;
  draw();

  get('sectionCard').scrollIntoView({
   behavior:'smooth'
  });

 }catch(e){
  if(request===serial){
   root.replaceChildren(
    node('div',e.message,'status error')
   );
  }
 }
}

async function loadClient(p,root){
 if(!admin())return;

 root.replaceChildren(
  node('p','Caricamento accessi...','muted')
 );

 try{
  const [s,t]=await Promise.all([
   rpc('forge_v45_access_status',{
    p_client_id:p.id
   }),
   trialRows(p.id)
  ]);

  if(!root.isConnected||!admin())return;

  root.replaceChildren();

  const grid=node('div','','f50-grid');

  grid.append(
   stat('Accesso',modeLabel(s.mode)),
   stat('Lezioni',s.remaining_sessions??0),
   stat('Premium',
    s.premium_access?'Attivo':'Non attivo'),
   stat('Coaching',
    s.full_access?'Attivo':'Non attivo')
  );

  root.append(grid);

  if(t){
   root.append(
    node('p',
     'Ultima prova: '+dateText(t.expires_at),
     'muted'),
    node('p',
     t.revoked_at?'Revocata':
     remaining(t.expires_at),
     'f50-countdown')
   );
  }

  if(p.status!=='approved'){
   root.append(
    node('p',
     'Approva prima il cliente dalla sezione Forge Clients.',
     'f50-warning')
   );
   return;
  }

  root.append(
   node('h3','Prova gratuita')
  );

  const hours=numberInput(48,1,720);
  const presets=node('div','','f50-grid');

  [
   ['24 ore',24],
   ['48 ore',48],
   ['72 ore',72],
   ['7 giorni',168]
  ].forEach(([label,value])=>{
   presets.append(
    button(label,()=>{
     hours.value=value;
    })
   );
  });

  const repeat=node('input');
  repeat.type='checkbox';
  repeat.style.width='20px';

  const repeatLabel=node('label');
  repeatLabel.append(
   repeat,
   document.createTextNode(
    ' Consenti una nuova prova'
   )
  );

  root.append(
   presets,
   node('label','Durata personalizzata in ore'),
   hours,
   repeatLabel,
   button('Attiva prova gratuita',async()=>{

    const h=validHours(hours,720);

    if(!confirm(
     'Attivare '+h+' ore per '+p.name+'?'
    ))return;

    await rpc('forge_v41_grant_trial',{
     p_client_id:p.id,
     p_hours:h,
     p_allow_repeat:repeat.checked
    });

    await loadClient(p,root);
   },'')
  );

  if(t&&!t.revoked_at){

   const extension=numberInput(24,1,8760);

   root.append(
    node('label','Ore aggiuntive'),
    extension,

    button('Proroga prova',async()=>{

     const h=validHours(extension,8760);

     if(!confirm(
      'Aggiungere '+h+' ore?'
     ))return;

     await rpc('forge_v46_extend_trial',{
      p_client_id:p.id,
      p_hours:h
     });

     await loadClient(p,root);
    }),

    button('Revoca prova',async()=>{

     if(!confirm('Revocare la prova gratuita?'))
      return;

     await rpc('forge_v41_revoke_trial',{
      p_trial_id:t.id
     });

     await loadClient(p,root);
    })
   );
  }

  root.append(
   node('h3','Modalità di accesso')
  );

  [
   ['Accesso standard','standard'],
   ['Accesso illimitato','unlimited'],
   ['Sospendi accesso','suspended']
  ].forEach(([label,mode])=>{

   root.append(
    button(label,async()=>{

     if(!confirm(label+' per '+p.name+'?'))
      return;

     await rpc('forge_v43_set_access',{
      p_client_id:p.id,
      p_mode:mode
     });

     await loadClient(p,root);
    })
   );
  });

 }catch(e){
  root.replaceChildren(
   node('div',e.message,'status error')
  );
 }
}

function safeRefresh(force=false){
 refresh(force).catch(e=>{
  console.warn('Forge V50:',e.message);
 });
}

setInterval(()=>{
 safeRefresh();
},2000);

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(!document.hidden)safeRefresh(true);
 }
);

safeRefresh(true);

console.info(
 'FORGE ACCESS CONTROL V50 ACTIVE'
);

})();
</script>
